<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap">
  <style>
    body {
      /* 全部取自 llmgw/web/src/theme.css 的深色档，逐字对齐，未四舍五入 */
      --bg-page: #03080a;
      --bg-surface: #0c1114;
      --bg-elevated: #11181d;
      --bg-input: #091014;
      --bg-base: #030608;
      --text-primary: #fcfcfe;
      --text-secondary: #c4c4cc;
      --text-muted: #a1a1aa;
      --border-subtle: rgba(255, 255, 255, 0.1);
      --border-strong: rgba(255, 255, 255, 0.16);
      --accent: #a78bfa;
      --accent-soft: rgba(167, 139, 250, 0.14);
      --radius: 8px;
      --radius-sm: 6px;
      /* 新尺度：卡片内边距一种、卡内间距三种（漂移守卫数的是种类不是大小） */
      --card-pad: 24px;
      --sp-tight: 8px;
      --sp-group: 20px;
      --sp-layer: 28px;
      margin: 0;
      background: var(--bg-page);
      color: var(--text-primary);
      font-family: 'Plus Jakarta Sans', 'Noto Sans SC', 'PingFang SC', system-ui, sans-serif;
      font-size: 14px;
      font-weight: 450;
      line-height: 1.625;
      -webkit-font-smoothing: antialiased;
    }
    a { color: var(--accent); text-decoration: none; }
    a:hover { color: #c4b5fd; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  </style>
</helmet>

<div style="padding: 24px 28px; display: flex; flex-direction: column; gap: 20px;">

  <!-- 页头 -->
  <div style="display: flex; flex-direction: column; gap: 3px;">
    <div style="font-size: 20px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.8;">Quickstart</div>
    <div style="font-size: 13px; color: var(--text-muted);">先说清要做什么，再签发；密钥在下一屏只显示一次。</div>
  </div>

  <!-- 步骤卡 -->
  <div style="background: var(--bg-surface); border: 1px solid var(--border-subtle); border-radius: var(--radius); padding: var(--card-pad); display: flex; flex-direction: column; gap: var(--sp-layer);">

    <!--
      层 0 · 步骤头
      修掉旧版「序号+标题+副标题+文字链全挤在一条基线」：标题独占首行，
      文字链用 margin-left:auto 推到行尾并单独成为 32px 高的点击区；
      副标题落到第二行，左缩进与标题文字对齐（28 + 12）。
    -->
    <div style="display: flex; flex-direction: column; gap: 8px;">
      <div style="display: flex; align-items: center; gap: 8px;">
        <span style="flex: none; width: 28px; height: 28px; display: inline-flex; align-items: center; justify-content: center; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-size: 13px; font-weight: 700;">2</span>
        <strong style="font-size: 15px; font-weight: 650; color: var(--text-primary);">颁发调用用途码</strong>
        <button type="button" style="margin-left: auto; height: 32px; padding: 0 10px; border: none; background: none; color: var(--accent); font: inherit; font-size: 13px; cursor: pointer; border-radius: var(--radius-sm);">改那句话</button>
      </div>
      <div style="padding-left: 40px; font-size: 13px; color: var(--text-muted);">按你写的那句话推导</div>
    </div>

    <!--
      层 1 · 你说的那句话
      加一条 2px 强调竖线 + 小标签，让它一眼是「引用」而不是又一段正文。
    -->
    <div style="display: flex; flex-direction: column; gap: var(--sp-tight);">
      <div style="font-size: 12px; color: var(--text-muted); letter-spacing: 0.04em;">你写的</div>
      <div style="border-left: 2px solid var(--accent); background: var(--bg-elevated); border-radius: 0 var(--radius-sm) var(--radius-sm) 0; padding: 14px 18px; font-size: 14px; color: var(--text-secondary); line-height: 1.7;">接入小米音响，对接大模型网关指令集</div>
    </div>

    <!--
      层 2 · 系统推出来的结果
      旧版是一条左右两端拉开、中间空着的横条。改成纵向叙述：
      眉标 → 码（本屏最大的字，17px mono）→ 来源 chip + 理由。
      调用类型移出这一块，单独成为下面的一个字段。
    -->
    <div style="display: flex; flex-direction: column; gap: var(--sp-group);">
      <div style="background: var(--accent-soft); border: 1px solid rgba(167, 139, 250, 0.32); border-radius: var(--radius); padding: var(--card-pad); display: flex; flex-direction: column; gap: var(--sp-tight);">
        <div style="font-size: 12px; color: var(--accent); letter-spacing: 0.06em; font-weight: 500;">将颁发</div>
        <div class="mono" style="font-size: 17px; font-weight: 650; color: var(--text-primary); line-height: 1.5; word-break: break-all;">xiaomi-speaker.model-gateway-command::chat</div>
        <div style="display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-tight); padding-top: 4px;">
          <span style="display: inline-flex; align-items: center; height: 24px; padding: 0 10px; border-radius: 999px; border: 1px solid rgba(167, 139, 250, 0.32); background: rgba(167, 139, 250, 0.10); color: var(--accent); font-size: 12px; font-weight: 500;">模型推导 · gpt-3.5-turbo</span>
          <span style="font-size: 13px; color: var(--text-muted); line-height: 1.7;">「小米音响」是调用方，「指令集」说明要对接大模型网关的命令集</span>
        </div>
      </div>

      <!-- 调用类型：从结果条里拆出来，成为一个有标签的字段，不再和码抢同一行 -->
      <div style="display: flex; flex-direction: column; gap: var(--sp-tight);">
        <div style="font-size: 12px; color: var(--text-muted); letter-spacing: 0.04em;">调用类型</div>
        <div style="display: inline-flex; align-self: flex-start; gap: 3px; padding: 3px; background: var(--bg-elevated); border: 1px solid var(--border-subtle); border-radius: var(--radius-sm);">
          <button type="button" style="height: 32px; padding: 0 16px; border: 1px solid var(--accent); border-radius: 4px; background: var(--accent-soft); color: var(--accent); font: inherit; font-size: 13px; font-weight: 500; cursor: pointer;">文字对话</button>
          <button type="button" style="height: 32px; padding: 0 16px; border: 1px solid transparent; border-radius: 4px; background: none; color: var(--text-muted); font: inherit; font-size: 13px; font-weight: 500; cursor: pointer;">图片理解</button>
        </div>
      </div>
    </div>

    <!-- 层 3 · 你要做的决定：一条分隔线把「系统给的」和「你要做的」隔开 -->
    <div style="display: flex; flex-direction: column; gap: var(--sp-group); border-top: 1px solid var(--border-subtle); padding-top: var(--sp-layer);">

      <button type="button" style="display: flex; align-items: center; gap: var(--sp-tight); height: 32px; padding: 0; border: none; background: none; color: var(--text-secondary); font: inherit; font-size: 13px; cursor: pointer;">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4l4 4-4 4"/></svg>
        改这条码（高级）
      </button>

      <!--
        底部行：提示句 flex:1 1 320px，按钮组 flex:none 靠右。
        提示先占位再让位，窄屏自然折成两行而不是把按钮挤扁。
      -->
      <div style="display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-group);">
        <span style="flex: 1 1 320px; min-width: 0; font-size: 13px; color: var(--text-muted); line-height: 1.7;">码登记后跟着团队走，先确认它说的是你要做的事。</span>
        <div style="flex: none; display: flex; gap: var(--sp-tight);">
          <button type="button" style="height: 32px; padding: 0 10px; border: 1px solid var(--border-strong); border-radius: var(--radius-sm); background: none; color: var(--text-primary); font: inherit; font-size: 13px; font-weight: 500; cursor: pointer;">重新生成</button>
          <button type="button" style="height: 32px; padding: 0 16px; border: 1px solid var(--accent); border-radius: var(--radius-sm); background: var(--accent); color: #09090b; font: inherit; font-size: 13px; font-weight: 500; cursor: pointer;">下一步</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 页脚两条折叠区，保持原页面的信息架构 -->
  <div style="display: flex; flex-direction: column; gap: var(--sp-tight);">
    <button type="button" style="display: flex; align-items: center; gap: var(--sp-tight); height: 32px; padding: 0; border: none; background: none; color: var(--text-secondary); font: inherit; font-size: 13px; cursor: pointer;">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4l4 4-4 4"/></svg>
      已经有密钥？看接入地址与现有密钥前缀
    </button>
    <button type="button" style="display: flex; align-items: center; gap: var(--sp-tight); height: 32px; padding: 0; border: none; background: none; color: var(--text-secondary); font: inherit; font-size: 13px; cursor: pointer;">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4l4 4-4 4"/></svg>
      工作原理：三个身份、预算与失败定位
    </button>
  </div>
</div>
</x-dc>
</body>
</html>
