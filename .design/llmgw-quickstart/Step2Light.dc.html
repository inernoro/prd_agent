<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap">
  <style>
    body {
      /* 浅色档，取自 theme.css 的 [data-theme='light'] */
      --bg-page: #f8fafc; --bg-surface: #ffffff; --bg-input: #ffffff; --bg-base: #f1f5f9;
      --text-primary: #111827; --text-secondary: #374151; --text-muted: #4b5563;
      --border-subtle: #e5e7eb; --border-strong: #d1d5db;
      --accent: #7c3aed; --accent-soft: rgba(124,58,237,0.1); --accent-contrast: #ffffff;
      --radius: 8px; --radius-sm: 6px;
      --card-pad: 24px; --sp-tight: 8px; --sp-group: 20px; --sp-layer: 28px;
      margin: 0; background: var(--bg-page); color: var(--text-primary);
      font-family: 'Plus Jakarta Sans', 'Noto Sans SC', 'PingFang SC', system-ui, sans-serif;
      font-size: 14px; font-weight: 450; line-height: 1.625; -webkit-font-smoothing: antialiased;
    }
    a { color: var(--accent); text-decoration: none; }
    a:hover { color: #6d28d9; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  </style>
</helmet>

<div style="padding: 24px 28px; display: flex; flex-direction: column; gap: 20px;">
  <div style="display: flex; flex-direction: column; gap: 3px;">
    <div style="font-size: 20px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.8;">Quickstart</div>
    <div style="font-size: 13px; color: var(--text-muted);">先说清要做什么，再签发；密钥在下一屏只显示一次。</div>
  </div>

  <div style="background: var(--bg-surface); border: 1px solid var(--border-subtle); border-radius: var(--radius); padding: var(--card-pad); display: flex; flex-direction: column; gap: var(--sp-layer);">

    <div style="display: flex; flex-direction: column; gap: 8px;">
      <div style="display: flex; align-items: center; gap: 8px;">
        <span style="flex: none; width: 28px; height: 28px; display: inline-flex; align-items: center; justify-content: center; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-size: 13px; font-weight: 700;">2</span>
        <strong style="font-size: 15px; font-weight: 650;">颁发调用用途码</strong>
        <button type="button" style="margin-left: auto; height: 32px; padding: 0 10px; border: none; background: none; color: var(--accent); font: inherit; font-size: 13px; cursor: pointer; border-radius: var(--radius-sm);">改那句话</button>
      </div>
      <div style="padding-left: 40px; font-size: 13px; color: var(--text-muted);">按你写的那句话推导</div>
    </div>

    <!--
      浅色档的关键差异：--bg-elevated 与 --bg-surface 同为 #ffffff，
      嵌套块用它等于没有底色。这里一律改用 --bg-base(#f1f5f9)，否则引用块与卡片糊成一片。
    -->
    <div style="display: flex; flex-direction: column; gap: var(--sp-tight);">
      <div style="font-size: 12px; color: var(--text-muted); letter-spacing: 0.04em;">你写的</div>
      <div style="border-left: 2px solid var(--accent); background: var(--bg-base); border-radius: 0 var(--radius-sm) var(--radius-sm) 0; padding: 14px 18px; font-size: 14px; color: var(--text-secondary); line-height: 1.7;">接入小米音响，对接大模型网关指令集</div>
    </div>

    <div style="display: flex; flex-direction: column; gap: var(--sp-group);">
      <div style="background: var(--accent-soft); border: 1px solid rgba(124,58,237,0.28); border-radius: var(--radius); padding: var(--card-pad); display: flex; flex-direction: column; gap: var(--sp-tight);">
        <div style="font-size: 12px; color: var(--accent); letter-spacing: 0.06em; font-weight: 500;">将颁发</div>
        <div class="mono" style="font-size: 17px; font-weight: 650; color: var(--text-primary); line-height: 1.5; word-break: break-all;">xiaomi-speaker.model-gateway-command::chat</div>
        <div style="display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-tight); padding-top: 4px;">
          <span style="display: inline-flex; align-items: center; height: 24px; padding: 0 10px; border-radius: 999px; border: 1px solid rgba(124,58,237,0.28); background: #ffffff; color: var(--accent); font-size: 12px; font-weight: 500;">模型推导 · gpt-3.5-turbo</span>
          <span style="font-size: 13px; color: var(--text-muted); line-height: 1.7;">「小米音响」是调用方，「指令集」说明要对接大模型网关的命令集</span>
        </div>
      </div>

      <div style="display: flex; flex-direction: column; gap: var(--sp-tight);">
        <div style="font-size: 12px; color: var(--text-muted); letter-spacing: 0.04em;">调用类型</div>
        <div style="display: inline-flex; align-self: flex-start; gap: 3px; padding: 3px; background: var(--bg-base); border: 1px solid var(--border-subtle); border-radius: var(--radius-sm);">
          <button type="button" style="height: 32px; padding: 0 16px; border: 1px solid var(--accent); border-radius: 4px; background: #ffffff; color: var(--accent); font: inherit; font-size: 13px; font-weight: 500; cursor: pointer;">文字对话</button>
          <button type="button" style="height: 32px; padding: 0 16px; border: 1px solid transparent; border-radius: 4px; background: none; color: var(--text-muted); font: inherit; font-size: 13px; font-weight: 500; cursor: pointer;">图片理解</button>
        </div>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: var(--sp-group); border-top: 1px solid var(--border-subtle); padding-top: var(--sp-layer);">
      <button type="button" style="display: flex; align-items: center; gap: var(--sp-tight); height: 32px; padding: 0; border: none; background: none; color: var(--text-secondary); font: inherit; font-size: 13px; cursor: pointer;">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4l4 4-4 4"/></svg>
        改这条码（高级）
      </button>
      <div style="display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-group);">
        <span style="flex: 1 1 320px; min-width: 0; font-size: 13px; color: var(--text-muted); line-height: 1.7;">码登记后跟着团队走，先确认它说的是你要做的事。</span>
        <div style="flex: none; display: flex; gap: var(--sp-tight);">
          <button type="button" style="height: 32px; padding: 0 10px; border: 1px solid var(--border-strong); border-radius: var(--radius-sm); background: #ffffff; color: var(--text-primary); font: inherit; font-size: 13px; font-weight: 500; cursor: pointer;">重新生成</button>
          <button type="button" style="height: 32px; padding: 0 16px; border: 1px solid var(--accent); border-radius: var(--radius-sm); background: var(--accent); color: var(--accent-contrast); font: inherit; font-size: 13px; font-weight: 500; cursor: pointer;">下一步</button>
        </div>
      </div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
