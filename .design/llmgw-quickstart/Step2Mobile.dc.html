<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap">
  <style>
    body {
      --bg-page: #03080a; --bg-surface: #0c1114; --bg-elevated: #11181d;
      --text-primary: #fcfcfe; --text-secondary: #c4c4cc; --text-muted: #a1a1aa;
      --border-subtle: rgba(255,255,255,0.1); --border-strong: rgba(255,255,255,0.16);
      --accent: #a78bfa; --accent-soft: rgba(167,139,250,0.14);
      --radius: 8px; --radius-sm: 6px;
      /* 窄屏把卡片内边距降一档到 16：390 宽下 24 的左右留白会把码挤到换行三次 */
      --card-pad: 16px; --sp-tight: 8px; --sp-group: 20px; --sp-layer: 28px;
      margin: 0; background: var(--bg-page); color: var(--text-primary);
      font-family: 'Plus Jakarta Sans', 'Noto Sans SC', 'PingFang SC', system-ui, sans-serif;
      font-size: 14px; font-weight: 450; line-height: 1.625; -webkit-font-smoothing: antialiased;
    }
    a { color: var(--accent); text-decoration: none; }
    a:hover { color: #c4b5fd; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  </style>
</helmet>

<div style="padding: 16px 12px 24px; display: flex; flex-direction: column; gap: var(--sp-group);">
  <div style="display: flex; flex-direction: column; gap: 3px;">
    <div style="font-size: 20px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.4;">Quickstart</div>
    <div style="font-size: 13px; color: var(--text-muted); line-height: 1.6;">先说清要做什么，再签发。</div>
  </div>

  <div style="background: var(--bg-surface); border: 1px solid var(--border-subtle); border-radius: var(--radius); padding: var(--card-pad); display: flex; flex-direction: column; gap: var(--sp-layer);">

    <!-- 窄屏：文字链落到第二行行尾，不和标题抢同一条基线 -->
    <div style="display: flex; flex-direction: column; gap: 8px;">
      <div style="display: flex; align-items: center; gap: 8px;">
        <span style="flex: none; width: 28px; height: 28px; display: inline-flex; align-items: center; justify-content: center; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-size: 13px; font-weight: 700;">2</span>
        <strong style="font-size: 15px; font-weight: 650;">颁发调用用途码</strong>
      </div>
      <div style="padding-left: 40px; display: flex; align-items: center; gap: var(--sp-tight);">
        <span style="font-size: 13px; color: var(--text-muted);">按你写的那句话推导</span>
        <button type="button" style="margin-left: auto; height: 32px; padding: 0 8px; border: none; background: none; color: var(--accent); font: inherit; font-size: 13px; cursor: pointer;">改那句话</button>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: var(--sp-tight);">
      <div style="font-size: 12px; color: var(--text-muted); letter-spacing: 0.04em;">你写的</div>
      <div style="border-left: 2px solid var(--accent); background: var(--bg-elevated); border-radius: 0 var(--radius-sm) var(--radius-sm) 0; padding: 12px 14px; font-size: 14px; color: var(--text-secondary); line-height: 1.7;">接入小米音响，对接大模型网关指令集</div>
    </div>

    <div style="display: flex; flex-direction: column; gap: var(--sp-group);">
      <!--
        码在 390 宽必须完整可见：break-all + 15px（比桌面的 17 降一档），
        绝不横向滚动、绝不裁切。
      -->
      <div style="background: var(--accent-soft); border: 1px solid rgba(167,139,250,0.32); border-radius: var(--radius); padding: var(--card-pad); display: flex; flex-direction: column; gap: var(--sp-tight);">
        <div style="font-size: 12px; color: var(--accent); letter-spacing: 0.06em; font-weight: 500;">将颁发</div>
        <div class="mono" style="font-size: 15px; font-weight: 650; color: var(--text-primary); line-height: 1.6; word-break: break-all;">xiaomi-speaker.model-gateway-command::chat</div>
        <div style="display: flex; flex-direction: column; gap: var(--sp-tight); padding-top: 4px;">
          <span style="align-self: flex-start; display: inline-flex; align-items: center; height: 24px; padding: 0 10px; border-radius: 999px; border: 1px solid rgba(167,139,250,0.32); background: rgba(167,139,250,0.10); color: var(--accent); font-size: 12px; font-weight: 500;">模型推导 · gpt-3.5-turbo</span>
          <span style="font-size: 13px; color: var(--text-muted); line-height: 1.7;">「小米音响」是调用方，「指令集」说明要对接大模型网关的命令集</span>
        </div>
      </div>

      <div style="display: flex; flex-direction: column; gap: var(--sp-tight);">
        <div style="font-size: 12px; color: var(--text-muted); letter-spacing: 0.04em;">调用类型</div>
        <!-- 窄屏两个选项各占一半，44px 高，满足触控命中区 -->
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 3px; padding: 3px; background: var(--bg-elevated); border: 1px solid var(--border-subtle); border-radius: var(--radius-sm);">
          <button type="button" style="height: 44px; border: 1px solid var(--accent); border-radius: 4px; background: var(--accent-soft); color: var(--accent); font: inherit; font-size: 13px; font-weight: 500; cursor: pointer;">文字对话</button>
          <button type="button" style="height: 44px; border: 1px solid transparent; border-radius: 4px; background: none; color: var(--text-muted); font: inherit; font-size: 13px; font-weight: 500; cursor: pointer;">图片理解</button>
        </div>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: var(--sp-group); border-top: 1px solid var(--border-subtle); padding-top: var(--sp-layer);">
      <button type="button" style="display: flex; align-items: center; gap: var(--sp-tight); height: 44px; padding: 0; border: none; background: none; color: var(--text-secondary); font: inherit; font-size: 13px; cursor: pointer;">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4l4 4-4 4"/></svg>
        改这条码（高级）
      </button>
      <span style="font-size: 13px; color: var(--text-muted); line-height: 1.7;">码登记后跟着团队走，先确认它说的是你要做的事。</span>
      <!-- 窄屏按钮纵向铺满：主操作在下、拇指够得着 -->
      <div style="display: flex; flex-direction: column; gap: var(--sp-tight);">
        <button type="button" style="height: 44px; border: 1px solid var(--border-strong); border-radius: var(--radius-sm); background: none; color: var(--text-primary); font: inherit; font-size: 14px; font-weight: 500; cursor: pointer;">重新生成</button>
        <button type="button" style="height: 44px; border: 1px solid var(--accent); border-radius: var(--radius-sm); background: var(--accent); color: #09090b; font: inherit; font-size: 14px; font-weight: 500; cursor: pointer;">下一步</button>
      </div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
