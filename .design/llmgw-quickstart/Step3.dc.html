<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap">
  <style>
    body {
      --bg-page: #03080a; --bg-surface: #0c1114; --bg-elevated: #11181d; --bg-input: #091014;
      --text-primary: #fcfcfe; --text-secondary: #c4c4cc; --text-muted: #a1a1aa;
      --border-subtle: rgba(255,255,255,0.1); --border-strong: rgba(255,255,255,0.16);
      --accent: #a78bfa; --accent-soft: rgba(167,139,250,0.14);
      --radius: 8px; --radius-sm: 6px;
      --card-pad: 24px; --sp-tight: 8px; --sp-group: 20px; --sp-layer: 28px;
      margin: 0; background: var(--bg-page); color: var(--text-primary);
      font-family: 'Plus Jakarta Sans', 'Noto Sans SC', 'PingFang SC', system-ui, sans-serif;
      font-size: 14px; font-weight: 450; line-height: 1.625; -webkit-font-smoothing: antialiased;
    }
    a { color: var(--accent); text-decoration: none; }
    a:hover { color: #c4b5fd; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  </style>
</helmet>

<div style="padding: 24px 28px; display: flex; flex-direction: column; gap: 20px;">
  <div style="display: flex; flex-direction: column; gap: 3px;">
    <div style="font-size: 20px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.8;">Quickstart</div>
    <div style="font-size: 13px; color: var(--text-muted);">先说清要做什么，再签发；密钥在下一屏只显示一次。</div>
  </div>

  <div style="background: var(--bg-surface); border: 1px solid var(--border-subtle); border-radius: var(--radius); padding: var(--card-pad); display: flex; flex-direction: column; gap: var(--sp-layer);">

    <div style="display: flex; flex-direction: column; gap: 8px;">
      <div style="display: flex; align-items: center; gap: 8px;">
        <span style="flex: none; width: 28px; height: 28px; display: inline-flex; align-items: center; justify-content: center; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-size: 13px; font-weight: 700;">3</span>
        <strong style="font-size: 15px; font-weight: 650;">算谁的</strong>
        <button type="button" style="margin-left: auto; height: 32px; padding: 0 10px; border: none; background: none; color: var(--accent); font: inherit; font-size: 13px; cursor: pointer; border-radius: var(--radius-sm);">回上一步</button>
      </div>
      <div style="padding-left: 40px; font-size: 13px; color: var(--text-muted);">这把密钥的用量与预算记在哪个团队名下</div>
    </div>

    <!-- 已定的码收成一条只读带，让第三步的注意力全在两个字段上 -->
    <div style="display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-tight); background: var(--bg-elevated); border: 1px solid var(--border-subtle); border-radius: var(--radius-sm); padding: 12px 16px;">
      <span style="font-size: 12px; color: var(--text-muted); letter-spacing: 0.04em;">已定</span>
      <span class="mono" style="font-size: 14px; font-weight: 650; color: var(--text-primary); word-break: break-all;">xiaomi-speaker.model-gateway-command::chat</span>
      <span style="font-size: 12px; color: var(--text-muted);">文字对话</span>
    </div>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--sp-group);">
      <div style="display: flex; flex-direction: column; gap: var(--sp-tight);">
        <div style="font-size: 12px; color: var(--text-muted); letter-spacing: 0.04em;">归属团队</div>
        <div style="height: 40px; display: flex; align-items: center; justify-content: space-between; border: 1px solid var(--border-strong); border-radius: var(--radius-sm); background: var(--bg-input); padding: 0 14px; font-size: 14px;">
          <span>核心平台组</span>
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="color: var(--text-muted);"><path d="M4 6l4 4 4-4"/></svg>
        </div>
        <span style="font-size: 12px; color: var(--text-muted);">密钥与用途码都登记在这个团队下</span>
      </div>
      <div style="display: flex; flex-direction: column; gap: var(--sp-tight);">
        <div style="font-size: 12px; color: var(--text-muted); letter-spacing: 0.04em;">月预算（USD）</div>
        <div style="height: 40px; display: flex; align-items: center; border: 1px solid var(--border-strong); border-radius: var(--radius-sm); background: var(--bg-input); padding: 0 14px; font-size: 14px; color: var(--text-muted);">留空即不限</div>
        <span style="font-size: 12px; color: var(--text-muted);">填了会按 1% 自动派生单次预占上限</span>
      </div>
    </div>

    <div style="display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-group); border-top: 1px solid var(--border-subtle); padding-top: var(--sp-layer);">
      <span style="flex: 1 1 320px; min-width: 0; font-size: 13px; color: var(--text-muted); line-height: 1.7;">点下去会真的签发一把密钥，明文只在下一屏显示一次。</span>
      <div style="flex: none; display: flex; gap: var(--sp-tight);">
        <button type="button" style="height: 32px; padding: 0 16px; border: 1px solid var(--accent); border-radius: var(--radius-sm); background: var(--accent); color: #09090b; font: inherit; font-size: 13px; font-weight: 500; cursor: pointer;">创建密钥</button>
      </div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
