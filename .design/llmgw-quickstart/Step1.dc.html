<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap">
  <style>
    body {
      --bg-page: #03080a; --bg-surface: #0c1114; --bg-elevated: #11181d; --bg-input: #091014;
      --text-primary: #fcfcfe; --text-secondary: #c4c4cc; --text-muted: #a1a1aa;
      --border-subtle: rgba(255,255,255,0.1); --border-strong: rgba(255,255,255,0.16);
      --accent: #a78bfa; --accent-soft: rgba(167,139,250,0.14);
      --radius: 8px; --radius-sm: 6px;
      --card-pad: 24px; --sp-tight: 8px; --sp-group: 20px; --sp-layer: 28px;
      margin: 0; background: var(--bg-page); color: var(--text-primary);
      font-family: 'Plus Jakarta Sans', 'Noto Sans SC', 'PingFang SC', system-ui, sans-serif;
      font-size: 14px; font-weight: 450; line-height: 1.625; -webkit-font-smoothing: antialiased;
    }
    a { color: var(--accent); text-decoration: none; }
    a:hover { color: #c4b5fd; }
  </style>
</helmet>

<div style="padding: 24px 28px; display: flex; flex-direction: column; gap: 20px;">
  <div style="display: flex; flex-direction: column; gap: 3px;">
    <div style="font-size: 20px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.8;">Quickstart</div>
    <div style="font-size: 13px; color: var(--text-muted);">先说清要做什么，再签发；密钥在下一屏只显示一次。</div>
  </div>

  <div style="background: var(--bg-surface); border: 1px solid var(--border-subtle); border-radius: var(--radius); padding: var(--card-pad); display: flex; flex-direction: column; gap: var(--sp-layer);">

    <div style="display: flex; flex-direction: column; gap: 8px;">
      <div style="display: flex; align-items: center; gap: 8px;">
        <span style="flex: none; width: 28px; height: 28px; display: inline-flex; align-items: center; justify-content: center; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-size: 13px; font-weight: 700;">1</span>
        <strong style="font-size: 15px; font-weight: 650;">说清要做什么</strong>
      </div>
      <div style="padding-left: 40px; font-size: 13px; color: var(--text-muted);">这一句是颁发调用用途码的唯一依据，系统无从代劳</div>
    </div>

    <!-- 输入框是全屏主角：给足高度与内边距，占位提示用正文档而不是更小的字 -->
    <div style="display: flex; flex-direction: column; gap: var(--sp-tight);">
      <div style="font-size: 12px; color: var(--text-muted); letter-spacing: 0.04em;">我想做什么</div>
      <div style="min-height: 132px; border: 1px solid var(--border-strong); border-radius: var(--radius); background: var(--bg-input); padding: 18px 20px; font-size: 14px; line-height: 1.7; color: var(--text-muted);">例如：接入小米音响，用小米音响控制设备</div>
    </div>

    <div style="display: flex; flex-direction: column; gap: var(--sp-tight);">
      <div style="font-size: 12px; color: var(--text-muted); letter-spacing: 0.04em;">点一下直接填进去</div>
      <div style="display: flex; flex-wrap: wrap; gap: var(--sp-tight);">
        <button type="button" style="height: 32px; padding: 0 14px; border: 1px solid var(--border-subtle); border-radius: 999px; background: var(--bg-elevated); color: var(--text-secondary); font: inherit; font-size: 13px; cursor: pointer;">接入小米音响，用小米音响控制设备</button>
        <button type="button" style="height: 32px; padding: 0 14px; border: 1px solid var(--border-subtle); border-radius: 999px; background: var(--bg-elevated); color: var(--text-secondary); font: inherit; font-size: 13px; cursor: pointer;">运营后台自动读发票图片上的金额</button>
        <button type="button" style="height: 32px; padding: 0 14px; border: 1px solid var(--border-subtle); border-radius: 999px; background: var(--bg-elevated); color: var(--text-secondary); font: inherit; font-size: 13px; cursor: pointer;">客服机器人回答产品问题</button>
      </div>
    </div>

    <div style="display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-group); border-top: 1px solid var(--border-subtle); padding-top: var(--sp-layer);">
      <span style="flex: 1 1 320px; min-width: 0; font-size: 13px; color: var(--text-muted); line-height: 1.7;">写清「谁在调用」和「要做什么」两件事就够，其余系统自己推。</span>
      <div style="flex: none; display: flex; gap: var(--sp-tight);">
        <button type="button" style="height: 32px; padding: 0 16px; border: 1px solid var(--accent); border-radius: var(--radius-sm); background: var(--accent); color: #09090b; font: inherit; font-size: 13px; font-weight: 500; cursor: pointer;">准备接入</button>
      </div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
