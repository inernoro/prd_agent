services:
  frontend:
    image: node:20-alpine
    working_dir: /app
    command: sh -lc "npx --yes serve -s . -l $$PORT"
    ports:
      - "4173:4173"
    volumes:
      - ./frontend:/app
    environment:
      PORT: "4173"
    labels:
      cds.path-prefix: /
      cds.readiness-path: /

  backend:
    image: node:20-alpine
    working_dir: /app
    command: sh -lc "npm install --no-audit --no-fund && node server.js"
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
    depends_on:
      - kafka
    environment:
      PORT: "3000"
      KAFKA_BROKERS: ${KAFKA_BROKERS}
    labels:
      cds.path-prefix: /api/
      cds.readiness-path: /api/health

  # Single-node Kafka in KRaft mode (no Zookeeper). The broker is both
  # controller and broker; internal clients reach it at kafka:9092 and must
  # authenticate with SASL/PLAIN — CDS 的基础设施认证门禁不再接受裸 PLAINTEXT
  # 的客户端监听器（见 doc/debt.cds.md E49）。CONTROLLER 监听器保持 PLAINTEXT：
  # 它只在 9093 上、只被本节点自己用，从不对外发布。
  # JAAS 里的值一律不加双引号：CDS 拼 docker run 时 env 走 -e "K=V" 且不转义
  # 值里的双引号，加了引号容器起不来（见 E50）。
  kafka:
    image: apache/kafka:3.7.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_LISTENERS: "SASL_PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093"
      KAFKA_ADVERTISED_LISTENERS: "SASL_PLAINTEXT://kafka:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "SASL_PLAINTEXT:SASL_PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_INTER_BROKER_LISTENER_NAME: "SASL_PLAINTEXT"
      KAFKA_SASL_ENABLED_MECHANISMS: "PLAIN"
      KAFKA_SASL_MECHANISM_INTER_BROKER_PROTOCOL: "PLAIN"
      KAFKA_LISTENER_NAME_SASL_PLAINTEXT_PLAIN_SASL_JAAS_CONFIG: "org.apache.kafka.common.security.plain.PlainLoginModule required username=app password=demokafkapw user_app=demokafkapw;"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      CLUSTER_ID: "demo-kafka-cluster-0001"
    volumes:
      - kafka-data:/var/lib/kafka/data

volumes:
  kafka-data:

x-cds-project:
  name: 事件流 Demo (Kafka KRaft)
  description: 前端生产事件到单节点 Kafka（KRaft 模式，无 Zookeeper），后端消费者读取并回显。纯 image + command + bind-mount 一键部署。

x-cds-env:
  KAFKA_BROKERS: kafka:9092
  KAFKA_SECURITY_PROTOCOL: SASL_PLAINTEXT
  KAFKA_SASL_MECHANISM: PLAIN
  KAFKA_SASL_USERNAME: app
  KAFKA_SASL_PASSWORD: demokafkapw

x-cds-env-meta:
  KAFKA_BROKERS:
    kind: infra-derived
    hint: 后端连接的 Kafka broker 地址（容器网络内通过服务名 kafka 访问）。
  KAFKA_SECURITY_PROTOCOL:
    kind: infra-derived
    hint: 客户端要用的安全协议，与 broker 的监听器一致。
  KAFKA_SASL_MECHANISM:
    kind: infra-derived
    hint: SASL 机制，固定 PLAIN。
  KAFKA_SASL_USERNAME:
    kind: infra-derived
    hint: Kafka SASL 账号。
  KAFKA_SASL_PASSWORD:
    kind: infra-derived
    hint: Kafka SASL 口令。示例工程用固定值方便复现；真实项目应让 CDS 生成随机值。
