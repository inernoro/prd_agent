<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="242" viewBox="0 0 1200 242" role="img" aria-labelledby="title">
  <title id="title">An example from the real homepage workflow template: manual trigger, TAPD collector, defect statistics, HTML rendering, export and completion notice.</title>
  <defs>
    <clipPath id="frame">
      <rect x="0" y="0" width="1200" height="242" rx="16" />
    </clipPath>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r=".75" fill="#D8D6CE" opacity=".24" />
    </pattern>
  </defs>
  <rect x="0" y="0" width="1200" height="242" rx="16" fill="#F5F3EE" />
  <g clip-path="url(#frame)">
    <rect x="0" y="0" width="1200" height="242" rx="16" fill="#F5F3EE" />
    <text x="34" y="38" font-size="11" fill="#59645B" font-weight="400" font-family="Arial, Helvetica, sans-serif" letter-spacing="1.6">WORKFLOW / A TEMPLATE FROM THE ADMIN HOMEPAGE</text>
    <text x="34" y="83" font-size="33" fill="#26322B" font-weight="700" font-family="Arial, Helvetica, sans-serif">Line up the work. Let it run.</text>
    <rect x="34" y="116" width="166" height="58" rx="8" fill="#FFFFFF" stroke="#D8D6CE" />
    <rect x="34" y="116" width="3" height="58" rx="8" fill="#A94F36" />
    <text x="48" y="140" font-size="15" fill="#26322B" font-weight="600" font-family="Arial, Helvetica, sans-serif">Manual trigger</text>
    <text x="48" y="160" font-size="11" fill="#59645B" font-weight="400" font-family="Arial, Helvetica, sans-serif">trigger</text>
    <path d="M206 145H217m-7-5 7 5-7 5" fill="none" stroke="#A94F36" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="227" y="116" width="166" height="58" rx="8" fill="#FFFFFF" stroke="#D8D6CE" />
    <rect x="227" y="116" width="3" height="58" rx="8" fill="#A94F36" />
    <text x="241" y="140" font-size="15" fill="#26322B" font-weight="600" font-family="Arial, Helvetica, sans-serif">TAPD collector</text>
    <text x="241" y="160" font-size="11" fill="#59645B" font-weight="400" font-family="Arial, Helvetica, sans-serif">process</text>
    <path d="M399 145H410m-7-5 7 5-7 5" fill="none" stroke="#A94F36" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="420" y="116" width="166" height="58" rx="8" fill="#FFFFFF" stroke="#D8D6CE" />
    <rect x="420" y="116" width="3" height="58" rx="8" fill="#A94F36" />
    <text x="434" y="140" font-size="15" fill="#26322B" font-weight="600" font-family="Arial, Helvetica, sans-serif">Defect stats</text>
    <text x="434" y="160" font-size="11" fill="#59645B" font-weight="400" font-family="Arial, Helvetica, sans-serif">process</text>
    <path d="M592 145H603m-7-5 7 5-7 5" fill="none" stroke="#A94F36" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="613" y="116" width="166" height="58" rx="8" fill="#FFFFFF" stroke="#D8D6CE" />
    <rect x="613" y="116" width="3" height="58" rx="8" fill="#A94F36" />
    <text x="627" y="140" font-size="15" fill="#26322B" font-weight="600" font-family="Arial, Helvetica, sans-serif">HTML render</text>
    <text x="627" y="160" font-size="11" fill="#59645B" font-weight="400" font-family="Arial, Helvetica, sans-serif">process</text>
    <path d="M785 145H796m-7-5 7 5-7 5" fill="none" stroke="#A94F36" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="806" y="116" width="166" height="58" rx="8" fill="#FFFFFF" stroke="#D8D6CE" />
    <rect x="806" y="116" width="3" height="58" rx="8" fill="#A94F36" />
    <text x="820" y="140" font-size="15" fill="#26322B" font-weight="600" font-family="Arial, Helvetica, sans-serif">Export HTML</text>
    <text x="820" y="160" font-size="11" fill="#59645B" font-weight="400" font-family="Arial, Helvetica, sans-serif">output</text>
    <path d="M978 145H989m-7-5 7 5-7 5" fill="none" stroke="#A94F36" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="999" y="116" width="166" height="58" rx="8" fill="#FFFFFF" stroke="#D8D6CE" />
    <rect x="999" y="116" width="3" height="58" rx="8" fill="#A94F36" />
    <text x="1013" y="140" font-size="15" fill="#26322B" font-weight="600" font-family="Arial, Helvetica, sans-serif">Completion notice</text>
    <text x="1013" y="160" font-size="11" fill="#59645B" font-weight="400" font-family="Arial, Helvetica, sans-serif">output</text>
    <text x="34" y="216" font-size="15" fill="#59645B" font-weight="400" font-family="Arial, Helvetica, sans-serif">Test one capsule on its own. Inspect the input and output. Then connect the next.</text>
  </g>
</svg>
