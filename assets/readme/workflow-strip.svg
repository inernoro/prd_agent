ound" stroke-linejoin="round"/><rect x="613" y="116" width="166" height="58" rx="9" fill="#fffcf5" stroke="#d9d2c4"/><rect x="613" y="116" width="3" height="58" rx="1" fill="#6f9da5"/><text x="627" y="140" font-size="15" fill="#292b28" font-weight="600" font-family="Arial, Helvetica, sans-serif">HTML render</text><text x="627" y="160" font-size="11" fill="#656b61" font-weight="400" font-family="Arial, Helvetica, sans-serif">process</text><path d="M785 145H796m-7-5 7 5-7 5" fill="none" stroke="#82968b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="806" y="116" width="166" height="58" rx="9" fill="#fffcf5" stroke="#d9d2c4"/><rect x="806" y="116" width="3" height="58" rx="1" fill="#326959"/><text x="820" y="140" font-size="15" fill="#292b28" font-weight="600" font-family="Arial, Helvetica, sans-serif">Export HTML</text><text x="820" y="160" font-size="11" fill="#656b61" font-weight="400" font-family="Arial, Helvetica, sans-serif">output</text><path d="M978 145H989m-7-5 7 5-7 5" fill="none" stroke="#82968b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="999" y="116" width="166" height="58" rx="9" fill="#fffcf5" stroke="#d9d2c4"/><rect x="999" y="116" width="3" height="58" rx="1" fill="#326959"/><text x="1013" y="140" font-size="15" fill="#292b28" font-weight="600" font-family="Arial, Helvetica, sans-serif">Completion notice</text><text x="1013" y="160" font-size="11" fill="#656b61" font-weight="400" font-family="Arial, Helvetica, sans-serif">output</text><text x="34" y="216" font-size="15" fill="#656b61" font-weight="400" font-family="Arial, Helvetica, sans-serif">Test one capsule on its own. Inspect the input and output. Then connect the next.</text></svg>