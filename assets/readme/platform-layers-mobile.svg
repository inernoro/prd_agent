<svg xmlns="http://www.w3.org/2000/svg" width="600" height="878" viewBox="0 0 600 878" role="img" aria-labelledby="title">
  <title id="title">MAP, LLMGW and CDS: a vertically arranged guide to the product, model execution, and branch delivery layers.</title>
  <defs>
