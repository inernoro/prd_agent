    <text x="412" y="537" font-size="11" fill="#59645B" font-weight="400" font-family="Arial, Helvetica, sans-serif">execute the call</text>
    <path d="M28 620H572" fill="none" stroke="#D8D6CE" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" />
    <text x="28" y="655" font-size="11" fill="#A94F36" font-weight="400" font-family="Arial, Helvetica, sans-serif" letter-spacing="1.6">03</text>
