<svg xmlns="http://www.w3.org/2000/svg" width="600" height="556" viewBox="0 0 600 556" role="img" aria-labelledby="title">
  <title id="title">The six-step homepage TAPD workflow template arranged as a readable path for mobile.</title>
  <defs>
    <clipPath id="frame">
      <rect x="0" y="0" width="600" height="556" rx="16" />
    </clipPath>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r=".75" fill="#D8D6CE" opacity=".24" />
    </pattern>
  </defs>
  <rect x="0" y="0" width="600" height="556" rx="16" fill="#F5F3EE" />
  <g clip-path="url(#frame)">
    <rect x="0" y="0" width="600" height="556" rx="16" fill="#F5F3EE" />
    <text x="28" y="36" font-size="11" fill="#59645B" font-weight="400" font-family="Arial, Helvetica, sans-serif" letter-spacing="1.5">WORKFLOW / HOMEPAGE TEMPLATE</text>
    <text x="28" y="83" font-size="34" fill="#26322B" font-weight="700" font-family="Arial, Helvetica, sans-serif">Line up the work.</text>
    <text x="28" y="125" font-size="34" fill="#26322B" font-weight="700" font-family="Arial, Helvetica, sans-serif">Let it run.</text>
    <rect x="28" y="161" width="246" height="58" rx="8" fill="#FFFFFF" stroke="#D8D6CE" />
    <rect x="28" y="161" width="3" height="58" rx="8" fill="#A94F36" />
    <text x="42" y="185" font-size="15" fill="#26322B" font-weight="600" font-family="Arial, Helvetica, sans-serif">Manual trigger</text>
    <text x="42" y="205" font-size="11" fill="#59645B" font-weight="400" font-family="Arial, Helvetica, sans-serif">trigger</text>
    <text x="28" y="149" font-size="11" fill="#59645B" font-weight="400" font-family="Arial, Helvetica, sans-serif">01</text>
    <rect x="326" y="161" width="246" height="58" rx="8" fill="#FFFFFF" stroke="#D8D6CE" />
    <rect x="326" y="161" width="3" height="58" rx="8" fill="#A94F36" />
    <text x="340" y="185" font-size="15" fill="#26322B" font-weight="600" font-family="Arial, Helvetica, sans-serif">TAPD collector</text>
    <text x="340" y="205" font-size="11" fill="#59645B" font-weight="400" font-family="Arial, Helvetica, sans-serif">process</text>
    <text x="326" y="149" font-size="11" fill="#59645B" font-weight="400" font-family="Arial, Helvetica, sans-serif">02</text>
    <rect x="326" y="291" width="246" height="58" rx="8" fill="#FFFFFF" stroke="#D8D6CE" />
    <rect x="326" y="291" width="3" height="58" rx="8" fill="#A94F36" />
    <text x="340" y="315" font-size="15" fill="#26322B" font-weight="600" font-family="Arial, Helvetica, sans-serif">Defect stats</text>
    <text x="340" y="335" font-size="11" fill="#59645B" font-weight="400" font-family="Arial, Helvetica, sans-serif">process</text>
    <text x="326" y="279" font-size="11" fill="#59645B" font-weight="400" font-family="Arial, Helvetica, sans-serif">03</text>
    <rect x="28" y="291" width="246" height="58" rx="8" fill="#FFFFFF" stroke="#D8D6CE" />
    <rect x="28" y="291" width="3" height="58" rx="8" fill="#A94F36" />
    <text x="42" y="315" font-size="15" fill="#26322B" font-weight="600" font-family="Arial, Helvetica, sans-serif">HTML render</text>
    <text x="42" y="335" font-size="11" fill="#59645B" font-weight="400" font-family="Arial, Helvetica, sans-serif">process</text>
    <text x="28" y="279" font-size="11" fill="#59645B" font-weight="400" font-family="Arial, Helvetica, sans-serif">04</text>
    <rect x="28" y="421" width="246" height="58" rx="8" fill="#FFFFFF" stroke="#D8D6CE" />
    <rect x="28" y="421" width="3" height="58" rx="8" fill="#A94F36" />
    <text x="42" y="445" font-size="15" fill="#26322B" font-weight="600" font-family="Arial, Helvetica, sans-serif">Export HTML</text>
    <text x="42" y="465" font-size="11" fill="#59645B" font-weight="400" font-family="Arial, Helvetica, sans-serif">output</text>
    <text x="28" y="409" font-size="11" fill="#59645B" font-weight="400" font-family="Arial, Helvetica, sans-serif">05</text>
    <rect x="326" y="421" width="246" height="58" rx="8" fill="#FFFFFF" stroke="#D8D6CE" />
    <rect x="326" y="421" width="3" height="58" rx="8" fill="#A94F36" />
    <text x="340" y="445" font-size="15" fill="#26322B" font-weight="600" font-family="Arial, Helvetica, sans-serif">Completion notice</text>
    <text x="340" y="465" font-size="11" fill="#59645B" font-weight="400" font-family="Arial, Helvetica, sans-serif">output</text>
    <text x="326" y="409" font-size="11" fill="#59645B" font-weight="400" font-family="Arial, Helvetica, sans-serif">06</text>
    <path d="M282 190H315m-7-5 7 5-7 5" fill="none" stroke="#A94F36" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M282 450H315m-7-5 7 5-7 5" fill="none" stroke="#A94F36" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M449 230V271m-5-7 5 7 5-7" fill="none" stroke="#A94F36" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M151 360V400m-5-7 5 7 5-7" fill="none" stroke="#A94F36" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M315 320H282m7-5-7 5 7 5" fill="none" stroke="#A94F36" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    <text x="28" y="529" font-size="17" fill="#59645B" font-weight="400" font-family="Arial, Helvetica, sans-serif">Inspect one step. Connect the next.</text>
