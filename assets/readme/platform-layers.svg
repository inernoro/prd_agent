    <text x="36" y="159" font-size="11" fill="#A94F36" font-weight="400" font-family="Arial, Helvetica, sans-serif" letter-spacing="1.6">01</text>
    <text x="69" y="161" font-size="24" fill="#26322B" font-weight="700" font-family="Arial, Helvetica, sans-serif">MAP</text>
    <text x="69" y="187" font-size="13" fill="#59645B" font-weight="400" font-family="Arial, Helvetica, sans-serif">The shared desk</text>
    <text x="36" y="283" font-size="11" fill="#A94F36" font-weight="400" font-family="Arial, Helvetica, sans-serif" letter-spacing="1.6">02</text>
    <text x="69" y="285" font-size="24" fill="#26322B" font-weight="700" font-family="Arial, Helvetica, sans-serif">LLMGW</text>
    <text x="69" y="311" font-size="13" fill="#59645B" font-weight="400" font-family="Arial, Helvetica, sans-serif">Model execution</text>
    <text x="36" y="407" font-size="11" fill="#A94F36" font-weight="400" font-family="Arial, Helvetica, sans-serif" letter-spacing="1.6">03</text>
    <text x="69" y="409" font-size="24" fill="#26322B" font-weight="700" font-family="Arial, Helvetica, sans-serif">CDS</text>
    <text x="69" y="435" font-size="13" fill="#59645B" font-weight="400" font-family="Arial, Helvetica, sans-serif">Branch delivery</text>
    <rect x="300" y="139" width="245" height="58" rx="8" fill="#FFFFFF" stroke="#D8D6CE" />
