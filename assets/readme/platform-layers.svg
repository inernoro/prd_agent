    <path d="M305 417H430Q450 417 470 397H533" fill="none" stroke="#A94F36" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <text x="306" y="399" font-size="12" fill="#59645B" font-weight="400" font-family="Arial, Helvetica, sans-serif">main</text>
    <text x="479" y="381" font-size="11" fill="#A94F36" font-weight="400" font-family="Arial, Helvetica, sans-serif">feature branch</text>
    <rect x="542" y="388" width="247" height="58" rx="8" fill="#FFFFFF" stroke="#D8D6CE" />
    <rect x="542" y="388" width="3" height="58" rx="8" fill="#A94F36" />
    <text x="556" y="412" font-size="15" fill="#26322B" font-weight="600" font-family="Arial, Helvetica, sans-serif">Services</text>
    <text x="556" y="432" font-size="11" fill="#59645B" font-weight="400" font-family="Arial, Helvetica, sans-serif">app + dependencies</text>
    <path d="M804 417H865m-7-5 7 5-7 5" fill="none" stroke="#A94F36" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="880" y="388" width="260" height="58" rx="8" fill="#FFFFFF" stroke="#D8D6CE" />
    <rect x="880" y="388" width="3" height="58" rx="8" fill="#A94F36" />
    <text x="894" y="412" font-size="15" fill="#26322B" font-weight="600" font-family="Arial, Helvetica, sans-serif">Preview</text>
    <text x="894" y="432" font-size="11" fill="#59645B" font-weight="400" font-family="Arial, Helvetica, sans-serif">an address you can open</text>
    <text x="36" y="478" font-size="14" fill="#59645B" font-weight="400" font-family="Arial, Helvetica, sans-serif">Work in MAP. Route through LLMGW. Deliver with CDS.</text>
