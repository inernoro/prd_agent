    <text x="314" y="307" font-size="11" fill="#59645B" font-weight="400" font-family="Arial, Helvetica, sans-serif">business identity</text>
    <path d="M492 292H508m-7-5 7 5-7 5" fill="none" stroke="#A94F36" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="520" y="263" width="183" height="58" rx="8" fill="#FFFFFF" stroke="#D8D6CE" />
