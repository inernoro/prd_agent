    <text x="534" y="307" font-size="11" fill="#59645B" font-weight="400" font-family="Arial, Helvetica, sans-serif">allowed model pool</text>
    <path d="M712 292H728m-7-5 7 5-7 5" fill="none" stroke="#A94F36" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="740" y="263" width="183" height="58" rx="8" fill="#FFFFFF" stroke="#D8D6CE" />
    <rect x="740" y="263" width="3" height="58" rx="8" fill="#A94F36" />
    <text x="754" y="287" font-size="15" fill="#26322B" font-weight="600" font-family="Arial, Helvetica, sans-serif">Members</text>
    <text x="754" y="307" font-size="11" fill="#59645B" font-weight="400" font-family="Arial, Helvetica, sans-serif">priority &amp; failover</text>
