<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="498" viewBox="0 0 1200 498" role="img" aria-labelledby="title">
  <title id="title">Three independent products form one chain: MAP turns work into artifacts; LLMGW routes callers through model pools and providers; CDS builds branch environments and previews.</title>
  <defs>
    <clipPath id="frame">
      <rect x="0" y="0" width="1200" height="498" rx="16" />
    </clipPath>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r=".75" fill="#D8D6CE" opacity=".24" />
    </pattern>
  </defs>
  <rect x="0" y="0" width="1200" height="498" rx="16" fill="#F5F3EE" />
  <g clip-path="url(#frame)">
    <rect x="0" y="0" width="1200" height="498" rx="16" fill="#F5F3EE" />
    <text x="36" y="38" font-size="11" fill="#59645B" font-weight="400" font-family="Arial, Helvetica, sans-serif" letter-spacing="2.1">THE PLATFORM UNDERNEATH</text>
    <text x="36" y="85" font-size="34" fill="#26322B" font-weight="700" font-family="Arial, Helvetica, sans-serif">Three products. One connected workflow.</text>
