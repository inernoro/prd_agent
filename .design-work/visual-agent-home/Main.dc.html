<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; background: #141418; color: #f7f7fb;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif; }
    a { color: #E8A87C; } a:hover { color: #D97757; }
    .dk-btn { border: 0; cursor: pointer; font: inherit; }
    /* 暗房：整页唯一持续在动的东西，慢到几乎察觉不到。
       织纹周期与生图等待卡同源（45 度、6/13px），让「等待」和「首页」是同一种材质。 */
    @keyframes dk-breathe { 0%,100% { opacity: .45; transform: scale(.98); } 50% { opacity: 1; transform: scale(1.03); } }
    @keyframes dk-drift { from { transform: translate3d(-8%,0,0); } to { transform: translate3d(8%,0,0); } }
    @media (prefers-reduced-motion: reduce) {
      .dk-core, .dk-drift { animation: none !important; }
    }
  </style>
</helmet>

<div style="position: relative; width: 1440px; min-height: 1000px; overflow: hidden; background: #141418">

  <!-- 潜像场：三层，全部极低对比。神秘感来自「底下有东西但看不清」，不是来自星星。 -->
  <div style="position: absolute; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(45deg, rgba(255,255,255,0.020) 0 6px, transparent 6px 13px)"></div>
  <div class="dk-core" style="position: absolute; left: 50%; top: -180px; width: 1100px; height: 780px;
    margin-left: -550px; pointer-events: none; animation: dk-breathe 14s ease-in-out infinite;
    background: radial-gradient(50% 50% at 50% 50%, rgba(217,119,87,0.13) 0%, rgba(217,119,87,0.05) 42%, transparent 72%)"></div>
  <div class="dk-drift" style="position: absolute; left: -10%; top: 120px; width: 120%; height: 520px;
    pointer-events: none; animation: dk-drift 26s ease-in-out infinite alternate;
    background: linear-gradient(104deg, transparent 0%, rgba(255,236,222,0.030) 46%, transparent 100%)"></div>

  <!-- 顶栏：三段式，与视频创作同结构 -->
  <div style="position: relative; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
    min-height: 64px; padding: 0 24px; border-bottom: 1px solid rgba(255,255,255,0.08);
    background: rgba(30,30,36,0.82); backdrop-filter: blur(16px)">
    <div style="display: flex; align-items: center; gap: 10px; justify-self: start">
      <span style="display: grid; width: 34px; height: 34px; place-items: center; border-radius: 8px;
        background: #f7f7fb; color: #141418">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
          stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 15l5-5 4 4 3-3 6 6"/><circle cx="9" cy="8.5" r="1.4"/></svg>
      </span>
      <span>
        <strong style="display: block; font-size: 13px; font-weight: 650">视觉创作</strong>
        <small style="display: block; margin-top: 1px; color: rgba(247,247,251,0.68); font-size: 9px; font-weight: 500;
          letter-spacing: .08em">DARKROOM</small>
      </span>
    </div>
    <div style="display: flex; height: 38px; align-items: center; gap: 2px; padding: 3px; border-radius: 8px;
      background: rgba(255,255,255,0.06)">
      <button class="dk-btn" style="min-width: 64px; height: 32px; border-radius: 6px; background: rgba(255,255,255,0.08);
        color: #f7f7fb; font-size: 11px; box-shadow: 0 2px 6px rgba(0,0,0,0.20)">创作</button>
      <button class="dk-btn" style="min-width: 64px; height: 32px; border-radius: 6px; background: transparent;
        color: rgba(247,247,251,0.68); font-size: 11px">作品</button>
    </div>
    <div style="display: flex; gap: 6px; justify-self: end">
      <button class="dk-btn" style="display: flex; align-items: center; gap: 6px; min-height: 36px; padding: 0 10px;
        border-radius: 7px; background: transparent; color: rgba(247,247,251,0.80); font-size: 11px">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
          stroke-linecap="round" stroke-linejoin="round"><path d="M2 4h7a3 3 0 013 3v13a2.5 2.5 0 00-2.5-2.5H2z"/><path d="M22 4h-7a3 3 0 00-3 3v13a2.5 2.5 0 012.5-2.5H22z"/></svg>
        教程
      </button>
      <button class="dk-btn" style="display: flex; align-items: center; gap: 6px; min-height: 36px; padding: 0 10px;
        border-radius: 7px; background: transparent; color: rgba(247,247,251,0.80); font-size: 11px">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
          stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
        新建项目
      </button>
    </div>
  </div>

  <!-- 主舞台 -->
  <div style="position: relative; width: 1180px; margin: 0 auto; padding: 52px 0 56px">

    <div style="width: 820px; margin: 0 auto">
      <!-- 标题区 -->
      <div style="margin-bottom: 22px; text-align: center">
        <span style="display: inline-flex; align-items: center; gap: 7px; color: #E8A87C; font-size: 11px; font-weight: 700">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
            stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/></svg>
          一句话开局，之后都在画布上改
        </span>
        <h1 style="margin: 10px 0 0; font-family: 'Space Grotesk', 'PingFang SC', sans-serif; font-size: 32px;
          font-weight: 650; line-height: 1.2">先落到画布，再谈生成</h1>
        <p style="margin: 10px 0 0; color: rgba(247,247,251,0.68); font-size: 13px; line-height: 1.6">
          生成只是其中一步。出图之后还能拆图层、局部重绘、扩展画幅——都在同一张画布上。</p>
      </div>

      <!-- 两种开局，与视频创作的「故事分镜 / 单镜直出」同构 -->
      <div style="display: grid; width: 420px; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px;
        margin: 0 auto 10px; padding: 4px; border-radius: 8px; background: rgba(255,255,255,0.06)">
        <button class="dk-btn" style="display: flex; align-items: center; gap: 9px; min-height: 50px; padding: 6px 12px;
          border-radius: 6px; background: rgba(255,255,255,0.08); color: #f7f7fb; text-align: left;
          box-shadow: 0 2px 6px rgba(0,0,0,0.20)">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
            stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
          <span style="min-width: 0">
            <strong style="display: block; font-size: 11px">画布创作</strong>
            <small style="display: block; margin-top: 2px; color: rgba(247,247,251,0.68); font-size: 9px">多图并置、图层可拆</small>
          </span>
        </button>
        <button class="dk-btn" style="display: flex; align-items: center; gap: 9px; min-height: 50px; padding: 6px 12px;
          border-radius: 6px; background: transparent; color: rgba(247,247,251,0.68); text-align: left">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
            stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M10 8.5l5.5 3.5L10 15.5z"/></svg>
          <span style="min-width: 0">
            <strong style="display: block; font-size: 11px">单图直出</strong>
            <small style="display: block; margin-top: 2px; color: rgba(247,247,251,0.68); font-size: 9px">一句描述生成一张</small>
          </span>
        </button>
      </div>

      <!-- 输入区 -->
      <div style="overflow: hidden; border: 1px solid rgba(255,255,255,0.12); border-radius: 8px;
        background: #1e1e24; box-shadow: 0 2px 14px rgba(0,0,0,0.35)">
        <div style="padding: 17px 20px 3px; font-size: 13px; font-weight: 650">白桃 · 夏季包装主视觉</div>
        <div style="padding: 12px 20px 15px; color: rgba(247,247,251,0.80); font-size: 14px; line-height: 1.65;
          min-height: 96px">水蜜桃产品主图，桃子切面朝上，晨雾质感，浅奶油底色，右上角留出品牌字位置。<span style="display: inline-block; width: 1.5px; height: 16px; margin-left: 1px; vertical-align: -3px; background: #D97757"></span></div>
        <div style="display: flex; flex-wrap: wrap; gap: 7px; padding: 0 20px 13px">
          <span style="display: flex; height: 30px; align-items: center; gap: 6px; padding: 3px 8px 3px 4px;
            border-radius: 6px; background: rgba(255,255,255,0.06); color: rgba(247,247,251,0.80); font-size: 10px">
            <span style="width: 24px; height: 24px; border-radius: 4px;
              background: linear-gradient(140deg, #f3c6a8, #e08a6a)"></span>参考图 · 去年主图
          </span>
        </div>
        <div style="display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 58px;
          padding: 9px 10px 9px 13px; border-top: 1px solid rgba(255,255,255,0.08); background: rgba(255,255,255,0.06)">
          <div style="display: flex; gap: 3px">
            <button class="dk-btn" style="display: flex; align-items: center; gap: 6px; min-height: 36px; padding: 0 9px;
              border-radius: 7px; background: transparent; color: rgba(247,247,251,0.80); font-size: 10px">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
                stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>参考图
            </button>
            <button class="dk-btn" style="display: flex; align-items: center; gap: 6px; min-height: 36px; padding: 0 9px;
              border-radius: 7px; background: transparent; color: rgba(247,247,251,0.80); font-size: 10px">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
                stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 3v18"/></svg>1K · 1:1
            </button>
            <button class="dk-btn" style="display: flex; align-items: center; gap: 6px; min-height: 36px; padding: 0 9px;
              border-radius: 7px; background: transparent; color: rgba(247,247,251,0.80); font-size: 10px">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
                stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 00.33 1.76l.06.06a2 2 0 11-2.83 2.83l-.06-.06A1.6 1.6 0 0015 19.4a1.6 1.6 0 00-1 1.47V21a2 2 0 11-4 0v-.09A1.6 1.6 0 009 19.4a1.6 1.6 0 00-1.76.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06A1.6 1.6 0 004.6 15a1.6 1.6 0 00-1.47-1H3a2 2 0 110-4h.09A1.6 1.6 0 004.6 9a1.6 1.6 0 00-.33-1.76l-.06-.06a2 2 0 112.83-2.83l.06.06A1.6 1.6 0 009 4.6a1.6 1.6 0 001-1.47V3a2 2 0 114 0v.09a1.6 1.6 0 001 1.47 1.6 1.6 0 001.76-.33l.06-.06a2 2 0 112.83 2.83l-.06.06A1.6 1.6 0 0019.4 9v0a1.6 1.6 0 001.47 1H21a2 2 0 110 4h-.09a1.6 1.6 0 00-1.47 1z"/></svg>设置
            </button>
          </div>
          <button class="dk-btn" style="display: flex; align-items: center; gap: 7px; min-height: 40px; padding: 0 16px;
            border-radius: 7px; background: #f7f7fb; color: #141418; font-size: 12px; font-weight: 650">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
              stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/></svg>
            开始创作
          </button>
        </div>
      </div>

      <!-- 预设：六列，与视频创作的风格档同构；左侧色条是唯一的彩色 -->
      <div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; margin-top: 12px">
        <button class="dk-btn" style="display: inline-flex; align-items: center; justify-content: center; gap: 6px;
          min-width: 0; min-height: 38px; padding: 0 7px; border-radius: 6px; background: rgba(255,255,255,0.08);
          color: #f7f7fb; font-size: 9px; box-shadow: inset 0 0 0 1px #D97757, 0 2px 6px rgba(0,0,0,0.20)">
          <i style="width: 8px; height: 22px; flex: 0 0 auto; border-radius: 3px; background: #D97757"></i>
          <span style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap">MAP Pro</span>
        </button>
        <button class="dk-btn" style="display: inline-flex; align-items: center; justify-content: center; gap: 6px;
          min-width: 0; min-height: 38px; padding: 0 7px; border-radius: 6px; background: rgba(255,255,255,0.06);
          color: rgba(247,247,251,0.68); font-size: 9px">
          <i style="width: 8px; height: 22px; flex: 0 0 auto; border-radius: 3px; background: #6fd5ef"></i>
          <span style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap">平面设计</span>
        </button>
        <button class="dk-btn" style="display: inline-flex; align-items: center; justify-content: center; gap: 6px;
          min-width: 0; min-height: 38px; padding: 0 7px; border-radius: 6px; background: rgba(255,255,255,0.06);
          color: rgba(247,247,251,0.68); font-size: 9px">
          <i style="width: 8px; height: 22px; flex: 0 0 auto; border-radius: 3px; background: #E8A87C"></i>
          <span style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap">品牌设计</span>
        </button>
        <button class="dk-btn" style="display: inline-flex; align-items: center; justify-content: center; gap: 6px;
          min-width: 0; min-height: 38px; padding: 0 7px; border-radius: 6px; background: rgba(255,255,255,0.06);
          color: rgba(247,247,251,0.68); font-size: 9px">
          <i style="width: 8px; height: 22px; flex: 0 0 auto; border-radius: 3px; background: #77e3b2"></i>
          <span style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap">插画创作</span>
        </button>
        <button class="dk-btn" style="display: inline-flex; align-items: center; justify-content: center; gap: 6px;
          min-width: 0; min-height: 38px; padding: 0 7px; border-radius: 6px; background: rgba(255,255,255,0.06);
          color: rgba(247,247,251,0.68); font-size: 9px">
          <i style="width: 8px; height: 22px; flex: 0 0 auto; border-radius: 3px; background: #fb7185"></i>
          <span style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap">电商设计</span>
        </button>
        <button class="dk-btn" style="display: inline-flex; align-items: center; justify-content: center; gap: 6px;
          min-width: 0; min-height: 38px; padding: 0 7px; border-radius: 6px; background: rgba(255,255,255,0.06);
          color: rgba(247,247,251,0.68); font-size: 9px">
          <i style="width: 8px; height: 22px; flex: 0 0 auto; border-radius: 3px; background: #a78bfa"></i>
          <span style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap">视频封面</span>
        </button>
      </div>

      <div style="display: flex; justify-content: center; gap: 16px; margin-top: 10px;
        color: rgba(247,247,251,0.68); font-size: 9px">
        <span>1024 × 1024</span><span>约 30 秒</span><span>每次 4 张</span><span>GPT Image 1</span>
      </div>
    </div>

    <!-- 最近项目：不再是一排等宽方卡，改成「一大 + 一列」的胶片式，与视频创作的镜头草图同构 -->
    <div style="display: grid; min-height: 300px; grid-template-columns: minmax(0, 1.65fr) minmax(280px, 0.65fr);
      gap: 12px; margin-top: 56px">
      <div style="position: relative; overflow: hidden; border-radius: 8px; background: #20211f">
        <div style="width: 100%; height: 300px;
          background: radial-gradient(70% 90% at 30% 25%, #f6d3b6 0%, #e79a72 38%, #7d3f2c 78%, #2a1712 100%)"></div>
        <div style="position: absolute; right: 18px; bottom: 18px; left: 18px; padding: 15px 16px; border-radius: 7px;
          background: rgba(20,21,18,0.78); backdrop-filter: blur(12px)">
          <span style="display: inline-block; margin-bottom: 9px; padding: 5px 7px; border-radius: 4px;
            background: rgba(20,21,18,0.65); font-size: 9px; color: rgba(247,247,251,0.80)">最近打开 · 12 张图 · 3 个图层组</span>
          <strong style="display: block; font-size: 20px">白桃</strong>
          <small style="display: block; margin-top: 7px; color: rgba(247,247,251,0.68); font-size: 10px">夏季包装主视觉 · 昨天 21:14</small>
        </div>
      </div>
      <div style="display: grid; min-width: 0; grid-template-rows: 38px repeat(3, minmax(0, 1fr)); gap: 7px">
        <div style="display: flex; align-items: center; gap: 7px; color: rgba(247,247,251,0.80)">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
            stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M7 4v16M17 4v16M2 12h20"/></svg>
          <strong style="font-size: 11px">最近项目</strong>
          <span style="margin-left: auto; color: rgba(247,247,251,0.68); font-size: 9px">共 18 个</span>
        </div>
        <div style="position: relative; overflow: hidden; border-radius: 7px;
          background: linear-gradient(150deg, #3c5a3a, #16221a)">
          <span style="position: absolute; bottom: 10px; left: 10px; color: rgba(247,247,251,0.68); font-size: 8px">02</span>
          <strong style="position: absolute; bottom: 10px; left: 37px; font-size: 9px">梅花</strong>
        </div>
        <div style="position: relative; overflow: hidden; border-radius: 7px;
          background: linear-gradient(150deg, #2f4a63, #141c26)">
          <span style="position: absolute; bottom: 10px; left: 10px; color: rgba(247,247,251,0.68); font-size: 8px">03</span>
          <strong style="position: absolute; bottom: 10px; left: 37px; font-size: 9px">绿帽子</strong>
        </div>
        <div style="position: relative; display: grid; place-items: center; overflow: hidden; border-radius: 7px;
          border: 1px dashed rgba(255,255,255,0.18); background: rgba(255,255,255,0.03)">
          <span style="display: flex; align-items: center; gap: 6px; color: rgba(247,247,251,0.68); font-size: 10px">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
              stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>新建项目
          </span>
        </div>
      </div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
