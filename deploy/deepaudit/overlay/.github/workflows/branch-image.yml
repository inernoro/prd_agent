name: Branch Image
on:
  push:
  workflow_dispatch:
  pull_request:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sh cds-release.sh check
  images:
    needs: contract
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.component }}
          file: ./${{ matrix.component }}/Dockerfile.cds
          load: true
          tags: deepaudit-cds-${{ matrix.component }}:test
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=AGPL-3.0-only
          cache-from: type=gha,scope=cds-${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=cds-${{ matrix.component }}
      - name: 验证平台迁移命令可执行
        if: matrix.component == 'backend'
        run: docker run --rm deepaudit-cds-backend:test sh -c 'command -v alembic && alembic --help >/dev/null'
      - name: 验证全新归属卷写入与运行时降权
        if: matrix.component == 'backend'
        run: |
          uploads="deepaudit-ci-uploads-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          data="deepaudit-ci-data-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          trap 'docker volume rm "$uploads" "$data" >/dev/null' EXIT
          docker volume create "$uploads" >/dev/null
          docker volume create "$data" >/dev/null
          docker run --rm --mount "type=volume,source=$uploads,target=/app/uploads,volume-nocopy" --mount "type=volume,source=$data,target=/app/data,volume-nocopy" deepaudit-cds-backend:test /app/cds-entrypoint.sh check-storage
      - name: 验证真实后端路由
        if: matrix.component == 'backend'
        run: >-
          docker run --rm -e SECRET_KEY=ci-only-validation-secret-01234567890123456789
          -e CDS_SERVICE_EMAIL=ci-review@example.com
          -e CDS_SERVICE_PASSWORD=ci-only-validation-password-0123456789
          -e DATABASE_URL=postgresql+asyncpg://ci:ci@127.0.0.1/ci
          -e LLM_MODEL=ci-model -e LLM_API_KEY=ci-validation-key
          -e PYTHONPATH=/app deepaudit-cds-backend:test
          .venv/bin/python tests/test_cds_runtime.py
      - name: 发布同提交不可变镜像
        if: github.event_name != 'pull_request'
        env:
          COMPONENT: ${{ matrix.component }}
          COMMIT_SHA: ${{ github.sha }}
          IMAGE_OWNER: ${{ github.repository_owner }}
        run: |
          image="ghcr.io/${IMAGE_OWNER,,}/deepaudit-cds-${COMPONENT}:sha-${COMMIT_SHA}"
          docker tag "deepaudit-cds-${COMPONENT}:test" "$image"
          docker push "$image"
