# Host overlay also applies when rolling back to a commit predating log limits.
x-production-logging: &production-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "3"

services:
  gateway:
    logging: *production-logging
  api:
    environment:
      LogArchive__EncryptionKey: ${LOG_ARCHIVE_ENCRYPTION_KEY:-}
      LogArchive__KeyBackedUp: ${LOG_ARCHIVE_KEY_BACKED_UP:-false}
    logging: *production-logging
  mongodb:
    # Temporary preservation guard until all historical log TTL indexes are migrated.
    command: ["mongod", "--setParameter", "ttlMonitorEnabled=false"]
    logging: *production-logging
  redis:
    logging: *production-logging
  llmgw:
    logging: *production-logging
  llmgw-web:
    logging: *production-logging
  llmgw-serve:
    environment:
      LlmGateway__Retention__ApplyChanges: "false"
      LlmGateway__Retention__EnableTtlIndexes: "false"
    logging: *production-logging
  llmgw-serve-b:
    environment:
      LlmGateway__Retention__ApplyChanges: "false"
      LlmGateway__Retention__EnableTtlIndexes: "false"
    logging: *production-logging
  design-opendesign:
    logging: *production-logging
