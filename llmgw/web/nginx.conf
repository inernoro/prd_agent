# llmgw/web 站点 nginx 配置：SPA 回退 + Console API 与四协议 Serving 入口反代。
# 监听 80（与 deploy/nginx/conf.d/branches/_standalone.conf 的 llmgw-web:80 反代约定一致）。
# rev: 2026-07-01 网关入口指向真实控制台（触碰 llmgw/web/** 触发 llmgw-web 镜像构建）
server {
    listen 80;
    server_name _;
    # vision 请求可能携带 base64 图片；与外层独立 GW server 保持同一上限，避免内层默认 1 MiB 返回 413。
    client_max_body_size 30m;
    root /usr/share/nginx/html;
    index index.html;

    # 四协议入口必须在 SPA fallback 和 Console /gw/* 之前转发到 serving。
    # 否则 POST 会被静态站点处理为 405，Quickstart 虽能生成 key 却无法完成第一条请求。
    location ^~ /gw/v1/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $llmgw_serving_upstream llmgw-serve;
        proxy_pass http://$llmgw_serving_upstream:8091;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_send_timeout 60s;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    location ^~ /v1/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $llmgw_serving_upstream llmgw-serve;
        proxy_pass http://$llmgw_serving_upstream:8091;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_send_timeout 60s;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    location ^~ /v1beta/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $llmgw_serving_upstream llmgw-serve;
        proxy_pass http://$llmgw_serving_upstream:8091;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_send_timeout 60s;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    location ^~ /gemini/v1beta/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $llmgw_serving_upstream llmgw-serve;
        proxy_pass http://$llmgw_serving_upstream:8091;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_send_timeout 60s;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # 网关控制台 API：/gw/* 反代到 llmgw 容器（SSE 关闭缓冲 + 长超时）。
    # 用 Docker 内嵌 DNS(127.0.0.11) + 变量 upstream 做「每请求解析」：literal upstream
    # (proxy_pass http://llmgw:8090) 会在 worker 启动时解析一次并永久缓存 —— CDS 逐分支网络
    # 隔离下 llmgw 别名此刻可能尚未注册(nginx 报 host not found in upstream 直接拒启动)，且
    # llmgw 重部署换 IP 后 console 会持续 502。改为 set 变量 + resolver：nginx 在请求时经
    # resolver 解析，NXDOMAIN 时只对该请求返 502(而非启动失败)，IP 变更 10s 内自动跟随。
    location ^~ /gw/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $llmgw_upstream llmgw;
        proxy_pass http://$llmgw_upstream:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    # 同一份前端有两个挂载点：独立子域上挂在根（/quickstart），经 MAP 主域进来时挂在
    # /llmgw 子路径（/llmgw/quickstart）。前端按 location.pathname 自行判断走哪个 API base
    # （runtimeBase.ts：/llmgw/* → /llmgw/gw，其余 → /gw），所以**两个 base 都得能落到
    # console-api**。此前只配了 /gw/：在独立子域上打开 /llmgw/quickstart（复制主域深链过来
    # 就是这个形状）时，前端去请求 /llmgw/gw/*，落进下面的 SPA fallback——GET 拿到一份
    # index.html、POST 直接 405，页面表现是「登录点了没反应，报请求失败 405」。
    # 这里把带前缀的那份 rewrite 掉前缀后转给同一个上游，两个挂载点行为一致。
    # 覆盖关系由 scripts/check-api-mounts.mjs 守着：前端能算出的每个 base 都必须有对应 location。
    # 但带前缀的 **/llmgw/gw/v1/** 不是控制台 API，是 serving 的四协议入口——
    # 它必须先被摘出来转给 8091。nginx 前缀匹配取最长者，所以这条比下面那条先胜出。
    # 漏了它，带前缀的 serving 流量会整批转给控制台 8090，而控制台根本没有 /gw/v1/*：
    # 生产发布冒烟探的正是 `/llmgw/gw/v1/healthz`（`exec_dep.sh` 的
    # `--llmgw-serving-health-path` 默认值），拿到 404 就挡住每一次发布。
    # 边缘那层是有意把它交下来的：`deploy/nginx/conf.d/branches/_standalone.conf`
    # 写着「/llmgw/gw/v1/* 在外层仍命中这个 location，内层才转到 Serving」——
    # 「内层」就是这里，此前这里没接，它一路落到 SPA 兜底拿了一份 index.html。
    location ^~ /llmgw/gw/v1/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $llmgw_serving_upstream llmgw-serve;
        rewrite ^/llmgw(/gw/v1/.*)$ $1 break;
        proxy_pass http://$llmgw_serving_upstream:8091;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_send_timeout 60s;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    location ^~ /llmgw/gw/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $llmgw_upstream llmgw;
        rewrite ^/llmgw(/gw/.*)$ $1 break;
        proxy_pass http://$llmgw_upstream:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    # SPA 回退：其余路由一律交给前端 React Router。
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存
    # CDS 独立预览会直接访问 llmgw-web 容器，浏览器仍按正式公开 base 请求
    # /llmgw/assets/*；alias 保证独立域名与 MAP 子路径使用同一份不可变产物。
    location ^~ /llmgw/assets/ {
        alias /usr/share/nginx/html/assets/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }
}
