<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CDS Agent Key 管理</title>
<style>
/* 原型：CDS 系统设置 · Agent Key。颜色取 FW-CDS-UI V3 的 tokens.json，主题由预览桥接脚本写 data-theme。 */
:root{
  --surface-base:hsl(30 28% 96%);--surface-raised:hsl(0 0% 100%);--surface-sunken:hsl(30 24% 91%);
  --hairline:hsl(30 15% 84%);--hairline-strong:hsl(30 12% 70%);
  --fg:hsl(24 20% 15%);--muted:hsl(24 10% 40%);
  --primary:hsl(24 90% 50%);--primary-ink:hsl(24 85% 38%);--primary-soft:hsl(30 80% 94%);--on-primary:hsl(222 24% 8%);
  --ok:hsl(161 94% 30%);--ok-soft:hsl(150 50% 92%);
  --warn:hsl(32 95% 44%);--warn-soft:hsl(38 90% 94%);
  --bad:hsl(0 74% 42%);--bad-soft:hsl(0 80% 96%);
  --info:hsl(201 98% 39%);--info-soft:hsl(199 85% 95%);
  --scrim:hsl(24 20% 10% / .45);
  --font:Inter,-apple-system,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --surface-base:hsl(222 14% 6%);--surface-raised:hsl(222 12% 13%);--surface-sunken:hsl(222 16% 4%);
  --hairline:hsl(222 10% 18%);--hairline-strong:hsl(222 10% 26%);
  --fg:hsl(240 6% 90%);--muted:hsl(240 4% 60%);
  --primary:hsl(24 100% 60%);--primary-ink:hsl(24 100% 64%);--primary-soft:hsl(24 60% 12%);--on-primary:hsl(222 24% 8%);
  --ok:hsl(158 64% 52%);--ok-soft:hsl(152 35% 11%);--warn:hsl(43 96% 56%);--warn-soft:hsl(38 45% 10%);
  --bad:hsl(0 91% 71%);--bad-soft:hsl(0 45% 12%);--info:hsl(199 95% 74%);--info-soft:hsl(199 45% 11%);
  --scrim:hsl(240 10% 2% / .65);color-scheme:dark}}
:root[data-theme="dark"]{
  --surface-base:hsl(222 14% 6%);--surface-raised:hsl(222 12% 13%);--surface-sunken:hsl(222 16% 4%);
  --hairline:hsl(222 10% 18%);--hairline-strong:hsl(222 10% 26%);
  --fg:hsl(240 6% 90%);--muted:hsl(240 4% 60%);
  --primary:hsl(24 100% 60%);--primary-ink:hsl(24 100% 64%);--primary-soft:hsl(24 60% 12%);--on-primary:hsl(222 24% 8%);
  --ok:hsl(158 64% 52%);--ok-soft:hsl(152 35% 11%);--warn:hsl(43 96% 56%);--warn-soft:hsl(38 45% 10%);
  --bad:hsl(0 91% 71%);--bad-soft:hsl(0 45% 12%);--info:hsl(199 95% 74%);--info-soft:hsl(199 45% 11%);
  --scrim:hsl(240 10% 2% / .65);color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--surface-base);color:var(--fg);font:13.6px/1.55 var(--font)}
button,input,select{font:inherit;color:inherit}
.mono{font-family:var(--mono);font-size:.85em}
.top{height:46px;display:flex;align-items:center;gap:10px;padding:0 14px;border-bottom:1px solid var(--hairline);background:var(--surface-raised)}
.top b{font-weight:600}
.top .crumb{color:var(--muted)}
.shell{display:grid;grid-template-columns:56px 216px minmax(0,1fr);height:calc(100% - 46px)}
.rail{border-right:1px solid var(--hairline);background:var(--surface-raised);display:flex;flex-direction:column;align-items:center;gap:14px;padding-top:12px;color:var(--muted);font-size:11px}
.rail span{display:grid;place-items:center;width:40px;height:40px;border-radius:8px}
.rail .on{background:var(--primary-soft);color:var(--primary-ink);font-weight:600}
.dir{border-right:1px solid var(--hairline);background:var(--surface-raised);padding:14px 10px;overflow:auto}
.dir h4{margin:12px 8px 4px;font-size:11px;color:var(--muted);font-weight:600}
.dir a{display:block;padding:6px 8px;border-radius:6px;color:inherit;text-decoration:none}
.dir a.on{background:var(--surface-sunken);font-weight:600}
.phone-dir{display:none;margin:0 0 12px;width:100%;min-height:44px;border:1px solid var(--hairline-strong);border-radius:8px;background:var(--surface-raised);padding:0 12px}
main{overflow:auto;padding:18px 22px 40px}
.head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;gap:12px}
.head h2{margin:0;font-size:16px;display:flex;align-items:center;gap:8px}
.head p{margin:4px 0 0;color:var(--muted);max-width:60ch}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.btn{display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:0 12px;border-radius:8px;border:1px solid var(--hairline-strong);background:var(--surface-raised);cursor:pointer;font-weight:500}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--on-primary);font-weight:600}
.btn.ghost{border-color:transparent;background:transparent}
.btn.danger{border-color:var(--bad);color:var(--bad);background:transparent}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn:focus-visible,.row:focus-visible,.choice:focus-visible,.pill-btn:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.note{margin-top:12px;font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.ask{margin-top:12px;padding:12px 14px;border:1px solid var(--hairline);border-radius:8px;background:var(--surface-sunken)}
.ask pre{margin:6px 0;white-space:pre-wrap;word-break:break-all;font-family:var(--mono);font-size:12px;background:var(--surface-raised);border:1px solid var(--hairline);border-radius:6px;padding:8px}
.ask p{margin:0;color:var(--muted)}
.tools{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:16px 0 6px}
.search{flex:1 1 220px;min-width:0;min-height:36px;border:1px solid var(--hairline-strong);border-radius:8px;background:var(--surface-raised);padding:0 10px}
.seg{display:inline-flex;flex-wrap:wrap;gap:2px;padding:2px;border:1px solid var(--hairline-strong);border-radius:8px}
.seg button{border:0;background:transparent;padding:4px 10px;border-radius:6px;color:var(--muted);cursor:pointer;min-height:30px}
.seg button[aria-pressed="true"]{background:var(--primary-soft);color:var(--primary-ink);font-weight:600}
select.st{min-height:36px;border:1px solid var(--hairline-strong);border-radius:8px;background:var(--surface-raised);padding:0 8px}
.group{display:flex;align-items:center;gap:8px;margin:16px 0 2px;font-size:11.5px;font-weight:600;color:var(--muted)}
.group::after{content:"";flex:1;height:1px;background:var(--hairline)}
article{border-bottom:1px solid var(--hairline);border-radius:6px}
article.fresh{background:var(--primary-soft)}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 14px;width:100%;text-align:left;border:0;background:transparent;padding:10px 8px;border-radius:6px;cursor:pointer}
.row:hover{background:var(--surface-sunken)}
.r1{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.r1 .name{font-weight:600;overflow-wrap:anywhere}
article.off .name{color:var(--muted)}
.r2{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;margin-top:3px;color:var(--muted);font-size:12.5px}
.side{display:flex;flex-direction:column;align-items:flex-end;gap:2px;font-size:11.5px;color:var(--muted);white-space:nowrap}
.pill{display:inline-flex;padding:0 8px;border-radius:999px;font-size:11.5px;font-weight:600;line-height:20px}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.off{background:var(--surface-sunken);color:var(--muted);border:1px solid var(--hairline)}
.pill.new{background:var(--primary);color:var(--on-primary)}
.src{display:inline-flex;align-items:center;gap:3px;padding:0 6px;border-radius:5px;font-size:11.5px;font-weight:500;line-height:20px}
.src.user{background:var(--surface-sunken);border:1px solid var(--hairline)}
.src.agent{background:var(--info-soft);color:var(--info)}
.src.unknown{border:1px dashed var(--hairline-strong)}
.detail{padding:4px 8px 14px;display:grid;gap:14px}
.risk{display:inline-flex;width:max-content;max-width:100%;gap:4px;padding:2px 8px;border-radius:5px;font-size:12px;font-weight:600}
.risk.low{background:var(--ok-soft);color:var(--ok)}.risk.mid{background:var(--warn-soft);color:var(--warn)}.risk.high{background:var(--bad-soft);color:var(--bad)}
.sum{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 18px}
.sum h5{margin:0 0 3px;font-size:11.5px;color:var(--muted);font-weight:600}
.sum p{margin:0}
.sum ul{margin:0;padding-left:18px}
.sum .yes li::marker{color:var(--ok)}.sum .no li::marker{color:var(--bad)}
.steps{margin:0;padding-left:20px}
dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 14px;margin:0}
dt{color:var(--muted)}dd{margin:0;overflow-wrap:anywhere}
.revoke{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;border-top:1px solid var(--hairline);padding-top:10px}
.revoke p{margin:0;flex:1 1 240px;color:var(--muted)}
.confirm{border:1px solid var(--bad);background:var(--bad-soft);border-radius:8px;padding:10px;display:grid;gap:8px}
.receipt{margin-top:14px;padding:14px;border:1px solid var(--warn);background:var(--warn-soft);border-radius:8px;display:grid;gap:10px}
.receipt h3{margin:0;font-size:14px}
.receipt textarea{width:100%;min-height:58px;font-family:var(--mono);font-size:12.5px;border:1px solid var(--hairline-strong);border-radius:8px;background:var(--surface-raised);padding:8px;resize:vertical}
.scrim{position:fixed;inset:0;background:var(--scrim);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.dialog{width:min(1000px,100%);max-height:calc(100% - 32px);display:flex;flex-direction:column;background:var(--surface-raised);border:1px solid var(--hairline);border-radius:12px;overflow:hidden}
.dh{padding:14px 18px;border-bottom:1px solid var(--hairline)}
.dh h3{margin:0;font-size:15px}.dh p{margin:3px 0 0;color:var(--muted)}
.db{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);overflow:hidden}
.form{overflow:auto;padding:14px 18px 22px;display:grid;gap:20px;align-content:start}
.panel{overflow:auto;background:var(--surface-sunken);border-left:1px solid var(--hairline);padding:14px 18px;display:grid;gap:12px;align-content:start}
.panel .sum{grid-template-columns:1fr}
.df{display:flex;flex-wrap:wrap;align-items:center;justify-content:flex-end;gap:10px;padding:10px 18px;border-top:1px solid var(--hairline)}
.df .why{flex:1 1 200px;color:var(--muted)}
label.f{display:grid;gap:6px;font-weight:600}
label.f input{min-height:38px;border:1px solid var(--hairline-strong);border-radius:8px;background:var(--surface-raised);padding:0 10px;font-weight:400}
.q{display:grid;gap:10px}
.qt{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px}
.qt .n{font-family:var(--mono);font-size:11.5px;color:var(--primary-ink)}
.qt b{font-size:13.5px}.qt span{font-size:12px;color:var(--muted)}
.choices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.choice{text-align:left;border:1px solid var(--hairline-strong);border-radius:8px;background:var(--surface-raised);padding:9px 11px;cursor:pointer;display:grid;gap:2px}
.choice b{font-size:13px}.choice span{font-size:11.5px;color:var(--muted)}
.choice[aria-checked="true"]{border-color:var(--primary);background:var(--primary-soft)}
.choice.danger[aria-checked="true"]{border-color:var(--bad);background:var(--bad-soft)}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill-btn{min-height:32px;border:1px solid var(--hairline-strong);border-radius:999px;background:var(--surface-raised);padding:0 12px;cursor:pointer}
.pill-btn[aria-checked="true"]{border-color:var(--primary);background:var(--primary-soft);color:var(--primary-ink);font-weight:600}
.perm{display:grid;gap:8px}
.perm .sub{font-size:11.5px;font-weight:600;color:var(--muted);margin-top:4px}
.box{border:1px solid var(--hairline);border-radius:8px;background:var(--surface-sunken);padding:10px;color:var(--muted)}
.hint{font-size:11.5px;color:var(--muted)}
.check{display:flex;gap:8px;align-items:flex-start}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--fg);color:var(--surface-raised);padding:8px 14px;border-radius:8px;z-index:60}
@media (max-width:820px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .rail,.dir{display:none}
  .phone-dir{display:block}
  main{padding:14px 16px 32px}
  .sum{grid-template-columns:1fr}
  .row{grid-template-columns:minmax(0,1fr)}
  .side{flex-direction:row;gap:10px;align-items:center}
  .btn{min-height:44px}
  .scrim{padding:0}
  .dialog{width:100%;max-height:100%;height:100%;border-radius:0}
  .db{grid-template-columns:1fr;overflow:auto}
  .form,.panel{overflow:visible}
  .panel{border-left:0;border-top:1px solid var(--hairline)}
  .choices{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:no-preference){.scrim .dialog{animation:rise .18s ease-out}@keyframes rise{from{transform:translateY(10px);opacity:.5}}}
</style>
</head>
<body>
<header class="top"><b>CDS</b><span class="crumb">/ 系统设置</span></header>
<div class="shell">
  <nav class="rail" aria-label="主导航"><span>项目</span><span>发布</span><span>报告</span><span>设计</span><span class="on">设置</span></nav>
  <nav class="dir" aria-label="CDS 系统设置目录">
    <h4>常用</h4><a href="#">CDS 更新</a><a href="#">概览</a>
    <h4>接入</h4><a href="#">登录与认证</a><a href="#">用户管理</a><a class="on" href="#/list" aria-current="page">Agent Key</a><a href="#">权限总览</a><a href="#">GitHub 集成</a>
    <h4>运行</h4><a href="#">调度器</a><a href="#">CDS 全局变量</a>
  </nav>
  <main id="main" data-screen-ready="0"></main>
</div>
<div id="overlay"></div>
<div id="toast" aria-live="polite"></div>
<script>
(function(){
  'use strict';
  var MIN=6e4,HOUR=36e5,DAY=864e5;
  var NOW=Date.parse('2026-11-25T10:00:00+08:00');
  var PROJECTS=[{id:'prd-agent',name:'prd-agent'},{id:'map-web',name:'map-web'},{id:'cds-self',name:'cds-self'},{id:'llmgw',name:'llmgw'},{id:'demo-shop',name:'demo-shop'}];
  var PERMS=[
    {v:'full',label:'项目完整读写',detail:'部署与重启分支、修改构建配置和项目环境变量、管理本项目的 Agent Key'},
    {v:'planning-read',label:'工程规划只读',detail:'只能读取本项目的工程规划与债务'},
    {v:'planning-propose',label:'工程规划提案',detail:'读取工程规划，并提交待人工处理的提案'},
    {v:'design-read',label:'设计稿只读',detail:'只能读取本项目的私有设计稿'},
    {v:'design-feedback',label:'设计实施反馈',detail:'读取设计稿，并提交实施反馈'},
    {v:'design-publish',label:'设计稿件发布',detail:'读取设计稿，并发布经 Git 校验的稿件'}];
  var CAN={
    full:['部署、重启、停止分支，查看部署记录与容器日志','修改构建配置与项目环境变量','为同一项目签发、吊销 Agent Key'],
    'planning-read':['读取工程规划与债务'],'planning-propose':['读取工程规划与债务','提交工程规划提案（由人处理后生效）'],
    'design-read':['读取私有设计稿'],'design-feedback':['读取私有设计稿','提交设计实施反馈'],
    'design-publish':['读取私有设计稿','提交设计实施反馈','发布经 Git 校验的设计稿件']};
  function P(id){return {id:id,name:id};}
  /* 演示数据：与 设计文档/演示数据.json 一致，人名与编号均为虚构 */
  var KEYS=[
    {id:'a91c40e2',kind:'project',label:'Claude Code · prd-agent',created:NOW-12*MIN,lastUsed:NOW-3*MIN,access:{scope:'project',projects:[P('prd-agent')],canCreate:false,permission:'full'},expiry:'never',source:{type:'agent',via:'access-request',agent:'Claude Code',approvedBy:'owner-alice',requestId:'req5e21a0'},status:'active'},
    {id:'5d07b3aa',kind:'project',label:'设计稿发布 · map-web',created:NOW-3*HOUR,lastUsed:NOW-40*MIN,access:{scope:'project',projects:[P('map-web')],canCreate:false,permission:'design-publish'},expiry:'sliding',expiresAt:NOW+2*DAY,source:{type:'agent',via:'self-service',agent:'Codex（li.wei 的工作站）',credential:'uc_3f9a1c'},status:'expiring'},
    {id:'e4410c9d',kind:'project',label:'建项目时签发 2026-11-24 08:50',created:NOW-26*HOUR,lastUsed:NOW-25*HOUR,access:{scope:'project',projects:[P('demo-shop')],canCreate:false,permission:'full'},expiry:'never',source:{type:'agent',via:'project-create',agent:'Claude Code',parentKey:'7b2e90f1'},status:'active'},
    {id:'7b2e90f1',kind:'global',label:'一次性新项目接入 (申请 9f00aa · Claude Code)',created:NOW-27*HOUR,access:{scope:'create',projects:[],canCreate:true,permission:'full',oneTime:true},expiry:'fixed',expiresAt:NOW-27*HOUR+5*MIN,source:{type:'agent',via:'access-request',agent:'Claude Code',approvedBy:'owner-alice',requestId:'9f00aa'},status:'revoked',revoked:NOW-26*HOUR},
    {id:'c3f8d215',kind:'global',label:'周报机器人',created:NOW-3*DAY,lastUsed:NOW-14*HOUR,access:{scope:'all',projects:[],canCreate:false,permission:'full'},expiry:'never',source:{type:'user',actor:'li.wei'},status:'active'},
    {id:'19aa6b70',kind:'project',label:'授权密钥 (申请 a1b2c3 · Codex)',created:NOW-6*DAY,access:{scope:'project',projects:[P('cds-self')],canCreate:false,permission:'full'},expiry:'never',source:{type:'agent',via:'access-request',agent:'Codex',approvedBy:'li.wei',requestId:'a1b2c3'},status:'revoked',revoked:NOW-5*DAY},
    {id:'2c6e11b8',kind:'project',label:'llmgw 灰度巡检',created:NOW-12*DAY,access:{scope:'project',projects:[P('llmgw')],canCreate:false,permission:'full'},expiry:'sliding',expiresAt:NOW+18*DAY,source:{type:'agent',via:'self-service',agent:'Cursor',credential:'uc_88d0e2'},status:'principal-disabled'},
    {id:'0f3d2a61',kind:'project',label:'签发于 2026-04-18 10:32',created:NOW-221*DAY,lastUsed:NOW-41*DAY,access:{scope:'project',projects:[P('prd-agent')],canCreate:false,permission:'full'},expiry:'never',source:{type:'unknown',recordedAccount:'li.wei',claimedBy:'li.wei'},status:'active'},
    {id:'8be7c4f0',kind:'global',label:'bootstrap for prd-agent Claude',created:NOW-230*DAY,lastUsed:NOW-2*DAY,access:{scope:'all',projects:[],canCreate:true,permission:'full',legacy:true},expiry:'never',source:{type:'unknown'},status:'active'}];
  var STATUS={active:['有效','ok'],expiring:['即将过期','warn'],expired:['已过期','off'],revoked:['已吊销','off'],'principal-disabled':['所属主体已停用','off'],'principal-missing':['所属主体不存在','off'],'grant-revoked':['项目授权已收回','off']};
  function usable(k){return k.status==='active'||k.status==='expiring';}
  function esc(t){return String(t).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function pad(n){return n<10?'0'+n:''+n;}
  function fmt(t){var d=new Date(t);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+' '+pad(d.getHours())+':'+pad(d.getMinutes());}
  function rel(t){var d=NOW-t;if(d<MIN)return '刚刚';if(d<HOUR)return Math.round(d/MIN)+' 分钟前';if(d<DAY)return Math.round(d/HOUR)+' 小时前';if(d<30*DAY)return Math.round(d/DAY)+' 天前';return fmt(t).slice(0,10);}

  /* 唯一说明函数：签发预览、回执、列表详情共用（实现对应 web/src/lib/agentKeyCatalog.ts 的 describeAgentKey） */
  function describe(a,expiry,expiresAt){
    var names=a.projects.map(function(p){return p.name;}),scope,can=[],cannot=[];
    if(a.scope==='project')scope=names.length?'只能访问 '+names.join('、'):'尚未选择项目';
    else if(a.scope==='all')scope='可访问全部现有项目（当前 '+PROJECTS.length+' 个），以后新建的项目也包括在内';
    else scope='不能访问任何现有项目，只能创建新项目。每建一个项目，CDS 会另发一把只能用于该项目的 Key';
    if(a.scope!=='create'&&a.canCreate)scope+='；也可以创建新项目';
    if(a.legacy)can.push('旧版全权：读写、配置并部署全部项目，也能创建项目（签发时还没有授权范围）');
    else if(a.scope==='create'){can.push('创建新项目');can.push('每建一个项目，拿到该项目的完整读写 Key');}
    else{can=can.concat(CAN[a.permission]);if(a.canCreate)can.push('创建新项目');}

  /* 画面路由：每个画面一个 hash，预览桥接按 design.json 的 route 打开 */
  function route(){
    var r=(location.hash||'#/list').slice(2);
    st.project='';st.open='';st.confirm=false;st.sign=false;st.receipt=null;st.fresh='';st.ask=false;
    st.draft={label:'',scope:'project',projectId:'',alsoCreate:false,permission:'full',expiry:'never',date:''};
    if(r==='project')st.project='prd-agent';
    if(r==='detail')st.open='0f3d2a61';
    if(r==='sign'){st.sign=true;st.draft.projectId='prd-agent';st.draft.label='Claude Code 部署调试';st.draft.expiry='7';}
    if(r==='sign-all'){st.sign=true;st.draft.scope='all';}
    render();renderSign();
    if(r==='receipt'){st.draft={label:'Claude Code 部署调试',scope:'project',projectId:'prd-agent',alsoCreate:false,permission:'full',expiry:'7',date:''};doSign();}
  }
  window.addEventListener('hashchange',route);
  route();
})();
</script>
</body>
</html>
