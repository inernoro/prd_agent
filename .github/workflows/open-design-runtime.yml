name: OpenDesign Runtime Image

on:
  push:
    branches: [main]
    paths:
      - "cds/open-design-runtime/**"
      - ".github/workflows/open-design-runtime.yml"
      # 销钉与能力探针都住在这里。不列进来的话，「只改销钉」的 PR 不会触发
      # 校验作业，而那恰恰是最容易引入漂移的那种改动。
      - "cds/src/services/agent-workspace-session-runtime.ts"
  pull_request:
    paths:
      - "cds/open-design-runtime/**"
      - ".github/workflows/open-design-runtime.yml"
      - "cds/src/services/agent-workspace-session-runtime.ts"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/opendesign-runtime

jobs:
  verify:
    name: Verify OpenDesign runtime build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build runtime without publishing
        uses: docker/build-push-action@v5
        with:
          context: ./cds/open-design-runtime
          file: ./cds/open-design-runtime/Dockerfile
          push: false
          provenance: false
          sbom: false
          platforms: linux/amd64
          cache-from: type=gha,scope=open-design-runtime

  build-and-push:
    name: Build and push OpenDesign runtime
    if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/codex/'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push commit-addressed runtime
        id: build
        uses: docker/build-push-action@v5
        with:
          context: ./cds/open-design-runtime
          file: ./cds/open-design-runtime/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          provenance: mode=max
          sbom: true
          platforms: linux/amd64
          cache-from: type=gha,scope=open-design-runtime
          cache-to: type=gha,mode=max,scope=open-design-runtime

      - name: Publish immutable digest
        shell: bash
        run: |
          {
            echo "## OpenDesign runtime"
            echo ""
            echo "- runtime: OpenDesign 0.21.1"
            echo "- agent: Codex CLI 0.143.0"
            echo "- digest: \`${{ steps.build.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  verify-pin:
    name: Verify pinned runtime satisfies the capability probe
    # 不依赖 build-and-push：它要校验的是「源码此刻钉住的那枚镜像」，
    # 无论这次有没有构建新镜像，钉住的那枚都必须当场可用。
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull the pinned image and run the runtime probe
        run: bash cds/open-design-runtime/verify-pinned-runtime.sh
