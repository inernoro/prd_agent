name: 正式版本方案链接链路验证
on:
  push:
    branches: [codex/map-production-readonly-diagnosis-20261119]
    paths: [.github/workflows/map-claim-plan-link-validation.yml]
permissions:
  contents: read
jobs:
  server:
    name: 方案链接识别保存快照和三种投递回归
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    services:
      mongodb:
        image: mongo:8.0
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      MONGODB_TEST_CONNECTION: mongodb://127.0.0.1:27017
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 658328f70e48fe160e4fd3cd55b4d94d91eceb3e
          persist-credentials: false
      - name: 装配本次产品方案链接修复并核对源码
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs'), path=require('path'), crypto=require('crypto');
            const files=[{"path":"prd-api/src/PrdAgent.Api/Controllers/Api/ProductAgentController.cs","sha":"ce83c90972ef5ae827fc697829ff9ea02bcbc525"},{"path":"prd-admin/src/pages/product-agent/ReleaseWorkflowDetail.tsx","sha":"f47ff7eb8e07389d28d4c19a2244baa5c6a85e9c"},{"path":"prd-api/tests/PrdAgent.Api.Tests/Services/ProductClaimWebhookTests.cs","sha":"ecc459f9ae53a3f4ea2384ef63ab5a6916159ec0"},{"path":"prd-admin/src/pages/product-agent/ReleaseNoticeAutofill.test.tsx","sha":"d5a3da14f782272f79cddc83c4c52e2d0cd3ef46"},{"path":"changelogs/2026-11-23_版本通知直接发送与逐条补发.md","sha":"2b3a8cdeb0cd77cd14a3b83da6e11f53158d5c8e"}];
            for (const item of files) {
              const {data}=await github.rest.git.getBlob({...context.repo,file_sha:item.sha});
              const bytes=Buffer.from(data.content,'base64');
              const digest=crypto.createHash('sha1').update(Buffer.from('blob '+bytes.length+'\0')).update(bytes).digest('hex');
              if(digest!==item.sha) throw new Error('候选文件校验不一致 '+item.path);
              fs.mkdirSync(path.dirname(item.path),{recursive:true});fs.writeFileSync(item.path,bytes);
            }
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: claim-plan-link-nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-
      - name: 完整解决方案编译
        working-directory: prd-api
        run: |
          dotnet restore PrdAgent.sln
          dotnet build PrdAgent.sln -c Release --no-restore
      - name: 方案链接全链路与既有T资料保护回归
        working-directory: prd-api
        run: >-
          dotnet test tests/PrdAgent.Api.Tests/PrdAgent.Api.Tests.csproj -c Release --no-build --no-restore
          --filter 'FullyQualifiedName~ProductClaimWebhookTests|FullyQualifiedName~ProductVersionClaimGuardTests|FullyQualifiedName~ProductVersionCopyTemplateTests'
          --logger 'console;verbosity=normal'
      - name: 保持完整出口守卫有效
        run: python3 scripts/check-map-model-egress.py
  frontend:
    name: 正式申领粘贴识别与请求参数验证
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 658328f70e48fe160e4fd3cd55b4d94d91eceb3e
          persist-credentials: false
      - name: 装配本次产品方案链接修复并核对源码
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs'), path=require('path'), crypto=require('crypto');
            const files=[{"path":"prd-api/src/PrdAgent.Api/Controllers/Api/ProductAgentController.cs","sha":"ce83c90972ef5ae827fc697829ff9ea02bcbc525"},{"path":"prd-admin/src/pages/product-agent/ReleaseWorkflowDetail.tsx","sha":"f47ff7eb8e07389d28d4c19a2244baa5c6a85e9c"},{"path":"prd-api/tests/PrdAgent.Api.Tests/Services/ProductClaimWebhookTests.cs","sha":"ecc459f9ae53a3f4ea2384ef63ab5a6916159ec0"},{"path":"prd-admin/src/pages/product-agent/ReleaseNoticeAutofill.test.tsx","sha":"d5a3da14f782272f79cddc83c4c52e2d0cd3ef46"},{"path":"changelogs/2026-11-23_版本通知直接发送与逐条补发.md","sha":"2b3a8cdeb0cd77cd14a3b83da6e11f53158d5c8e"}];
            for (const item of files) {
              const {data}=await github.rest.git.getBlob({...context.repo,file_sha:item.sha});
              const bytes=Buffer.from(data.content,'base64');
              const digest=crypto.createHash('sha1').update(Buffer.from('blob '+bytes.length+'\0')).update(bytes).digest('hex');
              if(digest!==item.sha) throw new Error('候选文件校验不一致 '+item.path);
              fs.mkdirSync(path.dirname(item.path),{recursive:true});fs.writeFileSync(item.path,bytes);
            }
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: prd-admin/pnpm-lock.yaml
      - name: 安装锁定依赖
        working-directory: prd-admin
        run: pnpm install --frozen-lockfile
      - name: 真实表单粘贴与申领请求回归
        working-directory: prd-admin
        run: pnpm test src/pages/product-agent/ReleaseNoticeAutofill.test.tsx src/pages/product-agent/ReleaseApplicationBasicOnly.test.tsx
      - name: 类型和代码检查
        working-directory: prd-admin
        run: |
          pnpm tsc --noEmit
          pnpm lint
          pnpm exec eslint src/pages/product-agent/ReleaseWorkflowDetail.tsx src/pages/product-agent/ReleaseNoticeAutofill.test.tsx --max-warnings=0
      - name: 完整前端回归
        working-directory: prd-admin
        run: pnpm test
      - name: 生产构建
        working-directory: prd-admin
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: pnpm build
  publish:
    needs: [server, frontend]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const branch='codex/product-claim-delivery-20261123', sha='20329b39b9f100391f4efc1f2ee221fc5e6a89ec', expected='658328f70e48fe160e4fd3cd55b4d94d91eceb3e';
            const {data}=await github.rest.git.getRef({...context.repo,ref:'heads/'+branch});
            if(data.object.sha!==sha && data.object.sha!==expected) throw new Error('分支已有其他更新，停止保护现有代码');
            if(data.object.sha===expected) await github.rest.git.updateRef({...context.repo,ref:'heads/'+branch,sha,force:false});
            for (const item of [
              {workflow_id:'ci.yml',inputs:{}},
              {workflow_id:'branch-image.yml',inputs:{}},
              {workflow_id:'web-latest-pages.yml',inputs:{publish_latest:'false'}}
            ]) await github.rest.actions.createWorkflowDispatch({...context.repo,...item,ref:branch});
            core.info('方案链接修复已推送 '+branch+' @ '+sha);
