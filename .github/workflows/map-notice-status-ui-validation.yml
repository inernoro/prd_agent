name: 版本通知状态界面校验
on:
  push:
    branches:
      - codex/map-production-readonly-diagnosis-20261119
    paths:
      - .github/workflows/map-notice-status-ui-validation.yml
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: eb31e4413e56b8ad03580983dc0b96788e131295
          persist-credentials: false
      - name: 装配仅产品管理界面的三个文件
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs'), path = require('path'), crypto = require('crypto');
            const files = [{"path":"prd-admin/src/pages/product-agent/ProductClaimWebhookPanel.tsx","sha":"18e04e22421c58105d8e4cfa9d3c142eb886d64d"},{"path":"prd-admin/src/pages/product-agent/ProductClaimWebhookPanel.test.tsx","sha":"8ee3d2a0aa0d64746828cc750b22f1214460c695"},{"path":"changelogs/2026-11-20_版本通知等待说明与自动刷新.md","sha":"3653457ee7f25316a7d101169b60fc98884e4da3"}];
            for (const item of files) {
              const {data} = await github.rest.git.getBlob({...context.repo, file_sha: item.sha});
              const bytes = Buffer.from(data.content, 'base64');
              const digest = crypto.createHash('sha1').update(Buffer.from('blob ' + bytes.length + '\0')).update(bytes).digest('hex');
              if (digest !== item.sha) throw new Error('文件校验不一致: ' + item.path);
              fs.mkdirSync(path.dirname(item.path), {recursive: true});
              fs.writeFileSync(item.path, bytes);
              core.info('已核对 ' + item.path);
            }
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: prd-admin/pnpm-lock.yaml
      - name: 安装锁定依赖
        working-directory: prd-admin
        run: pnpm install --frozen-lockfile
      - name: 通知等待说明与自动刷新的交互回归
        working-directory: prd-admin
        run: pnpm test src/pages/product-agent/ProductClaimWebhookPanel.test.tsx
      - name: 类型检查
        working-directory: prd-admin
        run: pnpm tsc --noEmit
      - name: 完整 lint 与改动文件零告警
        working-directory: prd-admin
        run: |
          pnpm lint
          pnpm exec eslint src/pages/product-agent/ProductClaimWebhookPanel.tsx src/pages/product-agent/ProductClaimWebhookPanel.test.tsx --max-warnings=0
      - name: 完整前端测试
        working-directory: prd-admin
        run: pnpm test
      - name: 完整生产构建
        working-directory: prd-admin
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: pnpm build
  publish:
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: write
    steps:
      - name: 校验通过后推送独立分支并调用现有产物构建
        uses: actions/github-script@v7
        with:
          script: |
            const branch = 'codex/product-claim-notice-status-20261120', sha = '78d0c05d5137338d6d8259d38941fc66bf3e8812';
            let found;
            try { found = await github.rest.git.getRef({...context.repo, ref: 'heads/' + branch}); }
            catch (error) { if (error.status !== 404) throw error; }
            if (found && found.data.object.sha !== sha) throw new Error('分支已有其他提交，停止保护现有代码');
            if (!found) await github.rest.git.createRef({...context.repo, ref: 'refs/heads/' + branch, sha});
            for (const item of [
              {workflow_id: 'ci.yml', inputs: {}},
              {workflow_id: 'branch-image.yml', inputs: {}},
              {workflow_id: 'web-latest-pages.yml', inputs: {publish_latest: 'false'}}
            ]) await github.rest.actions.createWorkflowDispatch({...context.repo, ...item, ref: branch});
            core.info('独立分支已推送：' + branch + ' @ ' + sha);
