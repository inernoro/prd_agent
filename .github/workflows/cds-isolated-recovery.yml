name: CDS Isolated Recovery

on:
  push:
    branches: [codex/cds-state-write-throttle-20261009]
    paths:
      - cds/src/**
      - cds/package.json
      - cds/pnpm-lock.yaml
      - cds/scripts/deployment-recovery-drill.ts
      - cds/scripts/replica-confirmation-drill.ts
      - cds/scripts/actual-stop-drill.ts
      - cds/scripts/json-write-overlap-drill.ts
      - cds/scripts/observation-isolation-drill.ts
      - cds/scripts/artifact-admission-drill.ts
      - cds/scripts/deployment-queue-drill.ts
      - cds/scripts/orphan-worktree-recheck-drill.ts
      - cds/scripts/filesystem-removal-drill.ts
      - cds/scripts/default-regression-drill.ts
      - cds/scripts/branch-claim-entry-drill.ts
      - cds/scripts/application-bootstrap-drill.ts
      - cds/scripts/application-docker-host-drill.ts
      - cds/scripts/application-docker-inner-drill.ts
      - cds/tests/helpers/**
      - cds/tests/routes/topology.test.ts
      - cds/tests/services/isolated-shell-executor.test.ts
      - cds/scripts/orphan-worktree-recheck-probe.ts
      - cds/scripts/orphan-worktree-ownership-probe.ts
      - cds/scripts/tsconfig.acceptance.json
      - .github/workflows/cds-isolated-recovery.yml

permissions:
  contents: read

concurrency:
  group: cds-isolated-recovery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application-docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: "9"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install original application and web dependencies
        run: |
          pnpm -C cds install --frozen-lockfile
          pnpm -C cds/web install --frozen-lockfile
      - name: Compile original full application and web
        run: |
          pnpm -C cds exec tsc --project scripts/tsconfig.acceptance.json
          pnpm -C cds build
          pnpm -C cds/web build
      - name: Original full application in owned Docker network namespace
        run: pnpm -C cds exec tsx scripts/application-docker-host-drill.ts
      - name: Preserve original application Docker prerequisite evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cds-application-docker-${{ github.sha }}
          path: cds/application-docker-output/
          if-no-files-found: error
          retention-days: 14

  application-bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mongo:
        image: mongo:7.0
        ports: ["127.0.0.1:27017:27017"]
        options: >-
          --cpus 1 --memory 1g
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1}).ok'"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: "9"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install original application and web dependencies
        run: |
          pnpm -C cds install --frozen-lockfile
          pnpm -C cds/web install --frozen-lockfile
      - name: Compile original full application and web
        run: |
          pnpm -C cds exec tsc --project scripts/tsconfig.acceptance.json
          pnpm -C cds build
          pnpm -C cds/web build
      - name: Original index durable bootstrap login and restart in private runtime
        run: pnpm -C cds exec tsx scripts/application-bootstrap-drill.ts --native --mongo-uri 'mongodb://127.0.0.1:27017/?directConnection=true'
      - name: Preserve full application bootstrap prerequisite evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cds-application-bootstrap-${{ github.sha }}
          path: cds/application-output/
          if-no-files-found: error
          retention-days: 14

  artifact-admission:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: "9"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install CDS dependencies
        run: pnpm -C cds install --frozen-lockfile
      - name: Type-check and compile artifact admission
        run: |
          pnpm -C cds exec tsc --project scripts/tsconfig.acceptance.json
          pnpm -C cds build
      - name: Real owned registry missing publish and durable wait recovery
        run: pnpm -C cds exec tsx scripts/artifact-admission-drill.ts
      - name: Preserve artifact admission evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cds-artifact-admission-${{ github.sha }}
          path: cds/artifact-output/report.json
          if-no-files-found: error
          retention-days: 14

  deployment-queue:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: "9"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install CDS dependencies
        run: pnpm -C cds install --frozen-lockfile
      - name: Type-check and compile branch deployment
        run: |
          pnpm -C cds exec tsc --project scripts/tsconfig.acceptance.json
          pnpm -C cds build
      - name: Real owned branch deployment dedup and service queue
        run: pnpm -C cds exec tsx scripts/deployment-queue-drill.ts
      - name: Preserve deployment queue evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cds-deployment-queue-${{ github.sha }}
          path: cds/queue-output/report.json
          if-no-files-found: error
          retention-days: 14

  observation-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: "9"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install CDS dependencies
        run: pnpm -C cds install --frozen-lockfile
      - name: Type-check and compile observation processes
        run: |
          pnpm -C cds exec tsc --project scripts/tsconfig.acceptance.json
          pnpm -C cds build
      - name: Real process cancellation and main-thread isolation regressions
        run: pnpm -C cds exec vitest run tests/services/isolated-shell-executor.test.ts tests/services/shell-executor.test.ts tests/services/janitor-observation.test.ts tests/services/observation-stream-executor.test.ts tests/services/docker-observation-event-stream.test.ts tests/services/container-log-stream.test.ts tests/services/self-status-cache.test.ts tests/services/system-log-monitor.test.ts tests/services/system-log-monitor-process.test.ts tests/services/operation-process-isolation.test.ts tests/services/container-operation-qualification.test.ts tests/services/container-managed-policy.test.ts tests/services/release-git-isolation.test.ts tests/services/release-commit-clock.test.ts tests/services/release-commit-meta.test.ts tests/services/release-commit-rail.test.ts tests/services/release-promotion-ancestor.test.ts tests/routes/cds-system-diagnostics.test.ts tests/services/nonurgent-git-process.test.ts tests/services/preview-instance.test.ts tests/services/async-stuck-deploy-reconciler.test.ts tests/services/async-stuck-deploy-process.test.ts tests/services/deploy-stuck-reconciler.test.ts tests/services/infra-oom-correlation.test.ts tests/routes/branches.test.ts tests/routes/executor-deploy.test.ts tests/services/artifact-commit-identity.test.ts tests/services/artifact-admission.test.ts tests/services/artifact-admission-wait.test.ts tests/services/deployment-run.test.ts
      - name: Real owned Docker reads through compiled observation processes
        run: pnpm -C cds exec tsx scripts/observation-isolation-drill.ts --compiled
      - name: Real private filesystem late claim comparison
        run: pnpm -C cds exec vitest run tests/services/janitor-orphan-worktree-recheck.test.ts tests/services/janitor-orphan-worktree-ownership.test.ts tests/services/worktree-path-activity.test.ts tests/services/deployment-source-concurrent.test.ts && pnpm -C cds exec tsx scripts/orphan-worktree-recheck-drill.ts
      - name: Compiled owned filesystem removal and actual Git claim handoff
        run: pnpm -C cds exec tsx scripts/filesystem-removal-drill.ts
      - name: Default regression fixtures with original assertions and native process evidence
        run: pnpm -C cds exec vitest run tests/routes/topology.test.ts && pnpm -C cds exec tsx scripts/default-regression-drill.ts --native
      - name: Real manual branch HTTP handoff and typed conflict
        run: pnpm -C cds exec tsx scripts/branch-claim-entry-drill.ts --native
      - name: Preserve manual branch HTTP evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cds-branch-claim-entry-${{ github.sha }}
          path: cds/branch-claim-entry-output/report.json
          if-no-files-found: error
          retention-days: 14
      - name: Preserve default regression fixture evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cds-default-regression-${{ github.sha }}
          path: cds/default-regression-output/report.json
          if-no-files-found: error
          retention-days: 14
      - name: Preserve compiled filesystem removal evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cds-filesystem-removal-${{ github.sha }}
          path: cds/filesystem-removal-output/
          if-no-files-found: error
          retention-days: 14
      - name: Preserve private filesystem recheck evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cds-orphan-recheck-${{ github.sha }}
          path: cds/orphan-recheck-output/report.json
          if-no-files-found: error
          retention-days: 14
      - name: Preserve observation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cds-observation-isolation-${{ github.sha }}
          path: cds/observation-output/report.json
          if-no-files-found: error
          retention-days: 14

  recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mongo:
        image: mongo:7.0
        ports: ["127.0.0.1:27017:27017"]
        options: >-
          --cpus 1 --memory 1g
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1}).ok'"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: "9"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install CDS dependencies
        run: pnpm -C cds install --frozen-lockfile
      - name: Type-check recovery drill
        run: pnpm -C cds exec tsc --project scripts/tsconfig.acceptance.json
      - name: Real Mongo persistence and SIGKILL recovery
        run: pnpm -C cds exec tsx scripts/deployment-recovery-drill.ts --mongo-uri 'mongodb://127.0.0.1:27017/?directConnection=true' --mongo-container-id '${{ job.services.mongo.id }}'
      - name: Preserve isolated evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cds-isolated-recovery-${{ github.sha }}
          path: cds/acceptance-output/report.json
          if-no-files-found: warn
          retention-days: 14

  replica-confirmation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: "9"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install CDS dependencies
        run: pnpm -C cds install --frozen-lockfile
      - name: Type-check isolated drills
        run: pnpm -C cds exec tsc --project scripts/tsconfig.acceptance.json
      - name: Replica readiness and ownership regressions
        run: pnpm -C cds exec vitest run tests/scripts/replica-confirmation-drill.test.ts
      - name: Real replica quorum loss and confirmation retry
        run: pnpm -C cds exec tsx scripts/replica-confirmation-drill.ts
      - name: Preserve replica evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cds-replica-confirmation-${{ github.sha }}
          path: cds/replica-output/report.json
          if-no-files-found: warn
          retention-days: 14

  actual-stop:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: "9"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install CDS dependencies
        run: pnpm -C cds install --frozen-lockfile
      - name: Type-check isolated drills
        run: pnpm -C cds exec tsc --project scripts/tsconfig.acceptance.json
      - name: Compile CDS for native JSON overlap verification
        run: pnpm -C cds build
      - name: Native JSON ownership confirmation and cold recovery
        run: pnpm -C cds exec tsx scripts/json-write-overlap-drill.ts
      - name: Native JSON source regressions
        run: pnpm -C cds exec vitest run tests/infra/json-backing-store-overlap.test.ts tests/infra/json-backing-store.test.ts
      - name: Real containers demonstrate old false stop confirmation
        run: pnpm -C cds exec tsx scripts/actual-stop-drill.ts --reference
      - name: Record original overlapping cold-load lifecycle diagnosis
        run: pnpm -C cds exec tsx scripts/actual-stop-drill.ts --cold-load-diagnostic
      - name: Real HTTP stop failure retry restart and supersession
        run: pnpm -C cds exec tsx scripts/actual-stop-drill.ts
      - name: Preserve actual stop evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cds-actual-stop-${{ github.sha }}
          path: |
            cds/stop-output/
            cds/json-write-output/
          if-no-files-found: warn
          retention-days: 14
