name: CDS CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '9'

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      cds: ${{ steps.filter.outputs.cds }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Path filter
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            cds:
              - 'cds/**'
              - '.github/workflows/cds.yml'
              # cds/tests 里有守卫在断言这份巡检工作流的接线（豁免开关挂没挂满四步、
              # 触发路径覆没覆盖登记与解析器）。不把被守文件登记进来，只改它的 PR
              # 会整个跳过测试 job——守卫从落地起就对它要防的场景不设防。
              - '.github/workflows/cds-external-port-audit.yml'

  build-and-test:
    name: Build & Test
    needs: changes
    if: needs.changes.outputs.cds == 'true' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cds

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Get pnpm store directory
        id: pnpm_store
        shell: bash
        run: |
          echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm_store.outputs.path }}
          key: ${{ runner.os }}-pnpm-bt-${{ hashFiles('cds/pnpm-lock.yaml', 'cds/package.json', 'cds/web/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-bt-

      - name: Install dependencies
        run: pnpm install

      # 同 ci.yml：渲染冒烟要用 cds/web/node_modules 里的 react。
      - name: Install web dependencies
        run: pnpm run install:web

      - name: Type check
        run: pnpm build

      - name: CDS UI regression audit
        run: pnpm run audit:ui

      - name: Run tests
        run: pnpm test

      # 上手向导的窄屏可达性只有真浏览器量得出来：源码守卫能证明主按钮写在
      # JSX 里，证明不了它在 390px 的手机上够不够得着。2026-09-03 那次
      # 「步骤 03 没有下一步、也滑不动」编译、类型、单测、源码守卫全绿。
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-cds-${{ hashFiles('cds/package.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-cds-

      - name: Install Chromium for layout probes
        run: pnpm exec playwright install --with-deps chromium

      - name: Agent starter mobile reachability
        run: pnpm run smoke:agent-starter-mobile

  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: [changes, build-and-test]
    if: needs.changes.outputs.cds == 'true' || (github.event_name == 'push' && github.ref == 'refs/heads/main')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            -f cds/Dockerfile \
            -t cds:ci-${{ github.sha }} \
            cds/

      - name: Verify image
        run: |
          docker run --rm cds:ci-${{ github.sha }} node --version
