name: CDS DTS Native Runtime

on:
  push:
    branches: ["**"]
    paths:
      - "cds/dts-runtime/**"
      - "cds/src/services/dts*.ts"
      - "cds/src/shared/dts.ts"
      - "cds/scripts/dts-*-drill.ts"
      - "cds/package.json"
      - "cds/pnpm-lock.yaml"
      - ".github/workflows/cds-dts-runtime.yml"
  workflow_dispatch:

jobs:
  build-test-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: cds/pnpm-lock.yaml
      - name: Install the locked control-plane clients
        working-directory: cds
        run: pnpm install --frozen-lockfile
      - name: Install MCP client dependencies
        working-directory: cds/mcp
        run: pnpm install --frozen-lockfile
      - name: Build browser assets
        working-directory: cds/web
        run: |
          pnpm install --frozen-lockfile
          pnpm exec tsc --noEmit
          pnpm build
      - name: Install the test browser
        working-directory: cds
        run: pnpm exec playwright install --with-deps chromium
      - name: Verify types and native adapter guards
        working-directory: cds
        run: |
          pnpm exec tsc --noEmit
          node --test dts-runtime/runtime.test.mjs
          pnpm exec vitest run tests/services/dts.test.ts tests/services/dts-connections.test.ts tests/services/dts-capacity.test.ts tests/services/dts-seatunnel.test.ts
      - uses: docker/setup-buildx-action@v3
      - name: Build pinned upstream runtime
        uses: docker/build-push-action@v6
        with:
          context: cds/dts-runtime
          load: true
          tags: cds-dts-runtime:test
          build-args: |
            SOURCE_REVISION=${{ github.sha }}
            SOURCE_URL=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=cds-dts-native
          cache-to: type=gha,mode=max,scope=cds-dts-native
      - name: Exercise five real services before publishing
        working-directory: cds
        env:
          DTS_RUNTIME_IMAGE: cds-dts-runtime:test
        run: bash dts-runtime/smoke.sh
      - name: Retain redacted native evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cds-dts-native-${{ github.sha }}
          path: |
            /tmp/cds-dts-image-smoke.*/**/*results*.json
            /tmp/cds-dts-image-smoke.*/**/*audit*.jsonl
            /tmp/cds-dts-image-smoke.*/engine.log
            /tmp/cds-dts-image-smoke.*/interface-*.png
          if-no-files-found: ignore
          retention-days: 14
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish only the tested image
        env:
          IMAGE: ghcr.io/${{ github.repository }}/cds-dts-runtime:sha-${{ github.sha }}
        run: |
          docker tag cds-dts-runtime:test "$IMAGE"
          docker push "$IMAGE"
          docker inspect "$IMAGE" --format '{{json .RepoDigests}}' >> "$GITHUB_STEP_SUMMARY"
