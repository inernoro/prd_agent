name: CI
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  import-static-check:
    name: T import exact-source static check
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 74b47f464025271e07d79de4d421f0366746e24d
      - uses: pnpm/action-setup@v4
        with:
          version: '9'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Assert immutable source
        run: test "$(git rev-parse HEAD)" = 74b47f464025271e07d79de4d421f0366746e24d
      - name: Install locked dependencies on CI only
        working-directory: prd-admin
        run: pnpm install --frozen-lockfile
      - name: Lint changed import parser and regressions
        working-directory: prd-admin
        run: pnpm exec eslint src/pages/product-agent/versionWorkflowImportParse.ts src/pages/product-agent/versionWorkflowImportParse.test.ts --max-warnings=0
