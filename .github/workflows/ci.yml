name: CI
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  SOURCE: e3920cc78edd80b670f9d94805fc00ea1000961b
  BASE: 6cf38b2497223a9044e77a0f6f2e1efc45cefd51
jobs:
  admin:
    name: Admin Dashboard Build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: e3920cc78edd80b670f9d94805fc00ea1000961b
          fetch-depth: 20
      - uses: pnpm/action-setup@v4
        with:
          version: '9'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Assert immutable source
        run: test "$(git rev-parse HEAD)" = "$SOURCE"
      - name: Locked remote dependencies only
        working-directory: prd-admin
        run: pnpm install --frozen-lockfile
      - name: Type check
        working-directory: prd-admin
        run: pnpm tsc --noEmit
      - name: Full frontend tests
        working-directory: prd-admin
        run: pnpm test
      - name: Changed file lint baseline
        working-directory: prd-admin
        run: |
          git worktree add "$RUNNER_TEMP/initiation-lint-base" "$BASE"
          ln -s "$GITHUB_WORKSPACE/prd-admin/node_modules" "$RUNNER_TEMP/initiation-lint-base/prd-admin/node_modules"
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { existsSync } from 'node:fs';
          import path from 'node:path';
          const current = process.cwd();
          const baseline = path.join(process.env.RUNNER_TEMP, 'initiation-lint-base/prd-admin');
          const files = execFileSync('git', ['diff', '--name-only', process.env.BASE, process.env.SOURCE, '--', 'src'], { cwd: current, encoding: 'utf8' }).trim().split('\n').filter(f => /\.tsx?$/.test(f));
          const eslint = path.join(current, 'node_modules/eslint/bin/eslint.js');
          function scan(cwd, paths) {
            let output;
            try { output = execFileSync(process.execPath, [eslint, ...paths, '--format', 'json'], { cwd, encoding: 'utf8' }); }
            catch (error) { if (!error.stdout) throw error; output = error.stdout; }
            const counts = new Map();
            for (const result of JSON.parse(output)) for (const m of result.messages) {
              const key = JSON.stringify([path.relative(cwd, result.filePath), m.ruleId, m.severity, m.message]);
              counts.set(key, (counts.get(key) ?? 0) + 1);
            }
            return counts;
          }
          const before = scan(baseline, files.filter(f => existsSync(path.join(baseline, f))));
          const after = scan(current, files);
          const added = [...after].filter(([key, count]) => count > (before.get(key) ?? 0));
          console.log(JSON.stringify({ files, added }));
          if (added.length) process.exit(1);
          NODE
  server:
    name: Server Build & Test
    runs-on: ubuntu-22.04
    services:
      mongodb:
        image: mongo:8.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      MONGODB_TEST_CONNECTION: mongodb://127.0.0.1:27017
    steps:
      - uses: actions/checkout@v4
        with:
          ref: e3920cc78edd80b670f9d94805fc00ea1000961b
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Video test dependencies on CI
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Assert immutable source
        run: test "$(git rev-parse HEAD)" = "$SOURCE"
      - name: Restore remote only
        working-directory: prd-api
        run: dotnet restore PrdAgent.sln
      - name: Build full solution
        working-directory: prd-api
        run: dotnet build PrdAgent.sln -c Release --no-restore
      - name: Non integration non manual tests
        working-directory: prd-api
        run: dotnet test PrdAgent.sln -c Release --no-build --filter 'Category!=Integration&Category!=Manual' --logger 'console;verbosity=normal'
