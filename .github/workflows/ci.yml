name: CI
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  SOURCE: 341b85cc54a772c432bbbc28ba4c6c0ab22c41a1
  BASE: 4b59d8f7560cb424f4bcf3a7a198209dc75172d2
jobs:
  admin:
    name: Admin Dashboard Build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 341b85cc54a772c432bbbc28ba4c6c0ab22c41a1
          fetch-depth: 20
      - uses: pnpm/action-setup@v4
        with:
          version: '9'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Assert immutable source
        run: test "$(git rev-parse HEAD)" = "$SOURCE"
      - name: Locked remote dependencies only
        working-directory: prd-admin
        run: pnpm install --frozen-lockfile
      - name: Automatic issue and modal regressions
        env:
          RELEASE_PANEL_SNAPSHOT_DIR: ${{ runner.temp }}/release-panel-snapshots
        working-directory: prd-admin
        run: pnpm exec vitest run src/pages/product-agent/VersionAnnouncementUpdate.test.tsx src/pages/product-agent/ReleaseApplicationBasicOnly.test.tsx src/pages/product-agent/ReleaseNoticeAutofill.test.tsx src/pages/product-agent/releaseMemberMatching.test.ts src/components/UserSearchSelect.test.tsx src/components/ItemSearchSelect.test.tsx src/pages/product-agent/ReleasePlanPicker.test.ts src/pages/product-agent/VersionNonBlockingLoading.test.ts src/pages/product-agent/InitiationSinglePage.test.tsx src/pages/product-agent/VersionWorkflowDeletion.test.tsx src/pages/product-agent/useVersionPlanName.test.tsx
      - name: Type check
        working-directory: prd-admin
        run: pnpm tsc --noEmit
      - name: Full frontend tests
        working-directory: prd-admin
        run: pnpm test
      - name: Changed file lint baseline
        working-directory: prd-admin
        run: |
          git worktree add "$RUNNER_TEMP/auto-issue-lint-base" "$BASE"
          ln -s "$GITHUB_WORKSPACE/prd-admin/node_modules" "$RUNNER_TEMP/auto-issue-lint-base/prd-admin/node_modules"
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { existsSync } from 'node:fs';
          import path from 'node:path';
          const current = process.cwd();
          const baseline = path.join(process.env.RUNNER_TEMP, 'auto-issue-lint-base/prd-admin');
          const files = execFileSync('git', ['diff', '--relative', '--name-only', process.env.BASE, process.env.SOURCE, '--', 'src'], { cwd: current, encoding: 'utf8' }).trim().split('\n').filter(f => /\.tsx?$/.test(f));
          if (!files.length) throw new Error('Expected changed frontend source files');
          const eslint = path.join(current, 'node_modules/eslint/bin/eslint.js');
          function scan(cwd, paths) {
            if (!paths.length) return new Map();
            let output;
            try { output = execFileSync(process.execPath, [eslint, ...paths, '--format', 'json'], { cwd, encoding: 'utf8' }); }
            catch (error) { if (!error.stdout) throw error; output = error.stdout; }
            const counts = new Map();
            for (const result of JSON.parse(output)) for (const m of result.messages) {
              const key = JSON.stringify([path.relative(cwd, result.filePath), m.ruleId, m.severity, m.message]);
              counts.set(key, (counts.get(key) ?? 0) + 1);
            }
            return counts;
          }
          const before = scan(baseline, files.filter(f => existsSync(path.join(baseline, f))));
          const after = scan(current, files);
          const added = [...after].filter(([key, count]) => count > (before.get(key) ?? 0));
          console.log(JSON.stringify({ files, added }));
          if (added.length) process.exit(1);
          NODE
      - name: Build frontend
        working-directory: prd-admin
        run: pnpm build
      - name: Capture rendered release panel with installed Chrome
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$chrome"
          "$chrome" --version
          capture="$RUNNER_TEMP/release-panel-snapshots"
          test -s "$capture/release-panel-dark.html"
          test -s "$capture/release-panel-light.html"
          cp -R prd-admin/dist/assets "$capture/assets"
          CAPTURE_DIR="$capture" python3 - <<'PY'
          import json, os
          from pathlib import Path
          folder=Path(os.environ['CAPTURE_DIR'])
          css=sorted((folder/'assets').glob('index-*.css'))
          assert css
          for path in folder.glob('release-panel-*.html'):
              html=path.read_text()
              links=''.join(f'<link rel="stylesheet" href="/assets/{item.name}">' for item in css)
              boot='<script>addEventListener("load",()=>{if(location.search.includes("bottom")){for(const el of document.querySelectorAll("[role=dialog] div")){if(getComputedStyle(el).overflowY==="auto")el.scrollTop=el.scrollHeight;}}});</script>'
              path.write_text('<!doctype html>'+html.replace('<head>','<head><meta charset="utf-8">',1).replace('</head>',links+'</head>').replace('</body>',boot+'</body>'))
          (folder/'source.json').write_text(json.dumps({'source':os.environ['SOURCE'],'kind':'actual React Dialog DOM after exact notice regression; static CSS browser capture, no production data'},indent=2))
          PY
          python3 -m http.server 8767 --bind 127.0.0.1 --directory "$capture" >"$RUNNER_TEMP/release-panel-http.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8767/source.json >/dev/null; then break; fi
            sleep 0.2
          done
          for theme in dark light; do
            for view in top bottom narrow; do
              size=1280,1000
              query=""
              if [ "$view" = bottom ]; then query='?bottom=1'; fi
              if [ "$view" = narrow ]; then size=390,844; fi
              "$chrome" --headless --no-sandbox --disable-dev-shm-usage --disable-gpu --no-first-run --no-default-browser-check --user-data-dir="$RUNNER_TEMP/panel-chrome-$theme-$view" --window-size="$size" --virtual-time-budget=2500 --screenshot="$capture/$theme-$view.png" "http://127.0.0.1:8767/release-panel-$theme.html$query" >"$RUNNER_TEMP/panel-chrome-$theme-$view.log" 2>&1
              test -s "$capture/$theme-$view.png"
            done
          done
      - uses: actions/upload-artifact@v4
        with:
          name: release-panel-visual
          path: |
            ${{ runner.temp }}/release-panel-snapshots/*.png
            ${{ runner.temp }}/release-panel-snapshots/source.json
          retention-days: 7

  server:
    name: Server Build & Test
    runs-on: ubuntu-22.04
    services:
      mongodb:
        image: mongo:8.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      MONGODB_TEST_CONNECTION: mongodb://127.0.0.1:27017
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 341b85cc54a772c432bbbc28ba4c6c0ab22c41a1
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Video test dependencies on CI
        run: |
          if command -v ffmpeg >/dev/null 2>&1; then
            ffmpeg -version
          else
            sudo apt-get update && sudo apt-get install -y ffmpeg
          fi
      - name: Assert immutable source
        run: test "$(git rev-parse HEAD)" = "$SOURCE"
      - name: Restore remote only
        working-directory: prd-api
        run: dotnet restore PrdAgent.sln
      - name: Build full solution
        working-directory: prd-api
        run: dotnet build PrdAgent.sln -c Release --no-restore
      - name: Automatic issuance database regressions
        working-directory: prd-api
        run: dotnet test tests/PrdAgent.Api.Tests -c Release --no-build --filter 'FullyQualifiedName~ProductAnnouncementSyncTests|FullyQualifiedName~ProductVersionClaimGuardTests|FullyQualifiedName~ProductVersionSourceLifecycleTests' --logger 'console;verbosity=normal'
      - name: Non integration non manual tests
        working-directory: prd-api
        run: dotnet test PrdAgent.sln -c Release --no-build --filter 'Category!=Integration&Category!=Manual' --logger 'console;verbosity=normal'
