name: CI
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dropdown-exact-source:
    runs-on: ubuntu-22.04
    env:
      SOURCE: 6cf38b2497223a9044e77a0f6f2e1efc45cefd51
      BASE: c0fab6db0da039972361d8217eed3c9a3c920944
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 10
      - name: Assert source files match pinned commit
        run: |
          test "$(git rev-parse HEAD^)" = "$SOURCE"
          test -z "$(git diff --name-only "$SOURCE" HEAD -- prd-admin/src prd-admin/package.json prd-admin/pnpm-lock.yaml)"
      - uses: pnpm/action-setup@v4
        with:
          version: '9'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install locked dependencies on CI only
        working-directory: prd-admin
        run: pnpm install --frozen-lockfile
      - name: Type check
        working-directory: prd-admin
        run: pnpm tsc --noEmit
      - name: Product and actual modal regression
        working-directory: prd-admin
        run: pnpm exec vitest run src/pages/product-agent src/components/ItemSearchSelect.test.tsx src/components/ui/__tests__/anchoredMenu.test.ts --reporter=dot
      - name: Compare changed-file lint against baseline
        working-directory: prd-admin
        run: |
          git worktree add "$RUNNER_TEMP/dropdown-lint-base" "$BASE"
          ln -s "$GITHUB_WORKSPACE/prd-admin/node_modules" "$RUNNER_TEMP/dropdown-lint-base/prd-admin/node_modules"
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          import path from 'node:path';
          const current = process.cwd();
          const baseline = path.join(process.env.RUNNER_TEMP, 'dropdown-lint-base/prd-admin');
          const files = ['src/components/ItemSearchSelect.tsx', 'src/components/ItemSearchSelect.test.tsx'];
          const eslint = path.join(current, 'node_modules/eslint/bin/eslint.js');
          function scan(cwd, paths) {
            let output;
            try { output = execFileSync(process.execPath, [eslint, ...paths, '--format', 'json'], { cwd, encoding: 'utf8' }); }
            catch (error) { if (!error.stdout) throw error; output = error.stdout; }
            const counts = new Map();
            for (const result of JSON.parse(output)) for (const message of result.messages) {
              const key = JSON.stringify([path.relative(cwd, result.filePath), message.ruleId, message.severity, message.message]);
              counts.set(key, (counts.get(key) ?? 0) + 1);
            }
            return counts;
          }
          const before = scan(baseline, files.slice(0, 1));
          const after = scan(current, files);
          const added = [...after].filter(([key, count]) => count > (before.get(key) ?? 0));
          console.log(JSON.stringify({ added }));
          if (added.length) process.exit(1);
          NODE
      - name: Build actual components and system styles fixture
        working-directory: prd-admin
        run: pnpm exec vite build .dropdown-validation --config vite.config.ts --outDir ../../.dropdown-validation-dist
      - name: Install locked browser dependencies on CI only
        working-directory: e2e
        run: pnpm install --frozen-lockfile && pnpm exec playwright install --with-deps chromium
      - name: Real Chromium two-theme wheel regression
        working-directory: e2e
        run: node dropdown-scroll-validation.mjs
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dropdown-scroll-browser-evidence
          path: e2e/dropdown-evidence/
