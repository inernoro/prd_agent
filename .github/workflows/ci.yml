name: CI
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  SOURCE: ae906ace32e701017e10c627f9ae6bd479383520
  BASE: 9db0cc08cbb2816c3d26a9e80edc28f7b50fae0e
jobs:
  server:
    name: Server Build & Test
    runs-on: ubuntu-22.04
    services:
      mongodb:
        image: mongo:8.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      MONGODB_TEST_CONNECTION: mongodb://127.0.0.1:27017
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ae906ace32e701017e10c627f9ae6bd479383520
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Video test dependencies on CI
        run: |
          if command -v ffmpeg >/dev/null 2>&1; then
            ffmpeg -version
          else
            sudo apt-get update && sudo apt-get install -y ffmpeg
          fi
      - name: Assert immutable source
        run: test "$(git rev-parse HEAD)" = "$SOURCE"
      - name: Restore remote only
        working-directory: prd-api
        run: dotnet restore PrdAgent.sln
      - name: Build full solution
        working-directory: prd-api
        run: dotnet build PrdAgent.sln -c Release --no-restore
      - name: Automatic issuance database regressions
        working-directory: prd-api
        run: dotnet test tests/PrdAgent.Api.Tests -c Release --no-build --filter 'FullyQualifiedName~ProductVersionClaimGuardTests|FullyQualifiedName~ProductVersionSourceLifecycleTests' --logger 'console;verbosity=normal'
      - name: Non integration non manual tests
        working-directory: prd-api
        run: dotnet test PrdAgent.sln -c Release --no-build --filter 'Category!=Integration&Category!=Manual' --logger 'console;verbosity=normal'
