name: CI
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  SOURCE: 7aec8b1f032011367e7672a2e03bba7ad2c2d4ae
  BASE: 4b59d8f7560cb424f4bcf3a7a198209dc75172d2
jobs:
  admin:
    name: Admin Dashboard Build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 7aec8b1f032011367e7672a2e03bba7ad2c2d4ae
          fetch-depth: 20
      - uses: pnpm/action-setup@v4
        with:
          version: '9'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Assert immutable source
        run: test "$(git rev-parse HEAD)" = "$SOURCE"
      - name: Locked remote dependencies only
        working-directory: prd-admin
        run: pnpm install --frozen-lockfile
      - name: Automatic issue and modal regressions
        working-directory: prd-admin
        run: pnpm exec vitest run src/pages/product-agent/ReleaseApplicationBasicOnly.test.tsx src/pages/product-agent/ReleaseNoticeAutofill.test.tsx src/pages/product-agent/releaseMemberMatching.test.ts src/components/UserSearchSelect.test.tsx src/pages/product-agent/InitiationSinglePage.test.tsx src/pages/product-agent/VersionWorkflowDeletion.test.tsx src/pages/product-agent/useVersionPlanName.test.tsx
      - name: Type check
        working-directory: prd-admin
        run: pnpm tsc --noEmit
      - name: Full frontend tests
        working-directory: prd-admin
        run: pnpm test
      - name: Changed file lint baseline
        working-directory: prd-admin
        run: |
          git worktree add "$RUNNER_TEMP/auto-issue-lint-base" "$BASE"
          ln -s "$GITHUB_WORKSPACE/prd-admin/node_modules" "$RUNNER_TEMP/auto-issue-lint-base/prd-admin/node_modules"
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { existsSync } from 'node:fs';
          import path from 'node:path';
          const current = process.cwd();
          const baseline = path.join(process.env.RUNNER_TEMP, 'auto-issue-lint-base/prd-admin');
          const files = execFileSync('git', ['diff', '--relative', '--name-only', process.env.BASE, process.env.SOURCE, '--', 'src'], { cwd: current, encoding: 'utf8' }).trim().split('\n').filter(f => /\.tsx?$/.test(f));
          if (!files.length) throw new Error('Expected changed frontend source files');
          const eslint = path.join(current, 'node_modules/eslint/bin/eslint.js');
          function scan(cwd, paths) {
            if (!paths.length) return new Map();
            let output;
            try { output = execFileSync(process.execPath, [eslint, ...paths, '--format', 'json'], { cwd, encoding: 'utf8' }); }
            catch (error) { if (!error.stdout) throw error; output = error.stdout; }
            const counts = new Map();
            for (const result of JSON.parse(output)) for (const m of result.messages) {
              const key = JSON.stringify([path.relative(cwd, result.filePath), m.ruleId, m.severity, m.message]);
              counts.set(key, (counts.get(key) ?? 0) + 1);
            }
            return counts;
          }
          const before = scan(baseline, files.filter(f => existsSync(path.join(baseline, f))));
          const after = scan(current, files);
          const added = [...after].filter(([key, count]) => count > (before.get(key) ?? 0));
          console.log(JSON.stringify({ files, added }));
          if (added.length) process.exit(1);
          NODE
