name: CI
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dropdown-full-prepush:
    runs-on: ubuntu-22.04
    env:
      SOURCE: 6cf38b2497223a9044e77a0f6f2e1efc45cefd51
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 6cf38b2497223a9044e77a0f6f2e1efc45cefd51
          fetch-depth: 2
      - uses: pnpm/action-setup@v4
        with:
          version: '9'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Assert immutable source
        run: test "$(git rev-parse HEAD)" = "$SOURCE"
      - name: Install locked dependencies on CI only
        working-directory: prd-admin
        run: pnpm install --frozen-lockfile
      - name: Full front-end module tests
        working-directory: prd-admin
        run: pnpm test
