name: CI
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  SOURCE: b4372668c7ec9f8034a58506f95dfbe703bf6252
  BASE: 8198a9085a9c753d7fc230649422ae33171d2db0
jobs:
  server:
    name: Server Build & Test
    runs-on: ubuntu-22.04
    services:
      mongodb:
        image: mongo:8.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      MONGODB_TEST_CONNECTION: mongodb://127.0.0.1:27017
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b4372668c7ec9f8034a58506f95dfbe703bf6252
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Video test dependencies on CI
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            if [ -f /etc/apt/apt-mirrors.txt ]; then
              sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
            fi
            sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update
            sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y ffmpeg
          fi
          ffmpeg -version
      - name: Assert immutable source
        run: test "$(git rev-parse HEAD)" = "$SOURCE"
      - name: Restore remote only
        working-directory: prd-api
        run: dotnet restore PrdAgent.sln
      - name: Build full solution
        working-directory: prd-api
        run: dotnet build PrdAgent.sln -c Release --no-restore
      - name: Automatic issuance database regressions
        working-directory: prd-api
        run: dotnet test tests/PrdAgent.Api.Tests -c Release --no-build --filter 'FullyQualifiedName~ProductVersionClaimGuardTests' --logger 'console;verbosity=normal'
      - name: Non integration non manual tests
        working-directory: prd-api
        run: dotnet test PrdAgent.sln -c Release --no-build --filter 'Category!=Integration&Category!=Manual' --logger 'console;verbosity=normal'
