name: CI
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  initiation-exact-source:
    runs-on: ubuntu-22.04
    env:
      SOURCE: c0fab6db0da039972361d8217eed3c9a3c920944
      BASE: 63919944a66c16a7462b0b9c19ce34faa4334218
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c0fab6db0da039972361d8217eed3c9a3c920944
          fetch-depth: 10
      - uses: pnpm/action-setup@v4
        with:
          version: '9'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Assert immutable source
        run: test "$(git rev-parse HEAD)" = "$SOURCE"
      - name: Install locked dependencies on CI only
        working-directory: prd-admin
        run: pnpm install --frozen-lockfile
      - name: Type check
        working-directory: prd-admin
        run: pnpm tsc --noEmit
      - name: Product UI regression
        working-directory: prd-admin
        run: pnpm exec vitest run src/pages/product-agent --reporter=dot
      - name: Compare lint against production baseline
        working-directory: prd-admin
        shell: bash
        run: |
          set -eu
          git worktree add "$RUNNER_TEMP/initiation-lint-base" "$BASE"
          ln -s "$GITHUB_WORKSPACE/prd-admin/node_modules" "$RUNNER_TEMP/initiation-lint-base/prd-admin/node_modules"
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          import path from 'node:path';
          const current = process.cwd();
          const baseline = path.join(process.env.RUNNER_TEMP, 'initiation-lint-base/prd-admin');
          const files = ['src/pages/product-agent/VersionWorkflowTab.tsx', 'src/pages/product-agent/InitiationApplicationFlow.test.ts', 'src/pages/product-agent/InitiationSinglePage.test.tsx', 'src/pages/product-agent/versionClaimScope.test.ts', 'src/services/real/productAgent.ts'];
          const eslint = path.join(current, 'node_modules/eslint/bin/eslint.js');
          function scan(cwd, paths) {
            let output;
            try { output = execFileSync(process.execPath, [eslint, ...paths, '--format', 'json'], { cwd, encoding: 'utf8' }); }
            catch (error) { if (!error.stdout) throw error; output = error.stdout; }
            const counts = new Map();
            for (const result of JSON.parse(output)) for (const message of result.messages) {
              const file = path.relative(cwd, result.filePath);
              const key = JSON.stringify([file, message.ruleId, message.severity, message.message]);
              counts.set(key, (counts.get(key) ?? 0) + 1);
            }
            return counts;
          }
          const before = scan(baseline, files.filter(file => !file.endsWith('InitiationSinglePage.test.tsx')));
          const after = scan(current, files);
          const added = [...after].filter(([key, count]) => count > (before.get(key) ?? 0));
          console.log(JSON.stringify({ baseline: [...before.values()].reduce((a,b) => a+b,0), current: [...after.values()].reduce((a,b) => a+b,0), added }));
          if (added.length) process.exit(1);
          NODE
