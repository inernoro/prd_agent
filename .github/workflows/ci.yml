name: CI
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  DOTNET_VERSION: '8.0.x'
  NODE_VERSION: '20'
  PNPM_VERSION: '9'
jobs:
  cds-build:
    name: CDS Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cds

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: 34af9d3e8fc4c804347f27f59064eb581b592b31

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Get pnpm store directory
        id: pnpm_store
        shell: bash
        run: |
          echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm_store.outputs.path }}
          key: ${{ runner.os }}-pnpm-cds-${{ hashFiles('cds/pnpm-lock.yaml', 'cds/package.json', 'cds/web/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-cds-

      - name: Install dependencies
        run: pnpm install

      # 前端依赖装在 cds/web/node_modules。tests/ 里的渲染冒烟直接 import 前端组件，
      # vitest.config.ts 把 react / react-dom 别名指向那里；这一步缺了别名就解析不到，
      # 整个测试文件加载失败。守卫见 tests/lint/ci-installs-web-deps.test.ts。
      - name: Install web dependencies
        run: pnpm run install:web

      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Assert immutable source
        run: test "$(git rev-parse HEAD)" = "34af9d3e8fc4c804347f27f59064eb581b592b31"

      - name: Run tests
        run: pnpm test

  # 设计执行服务（design-runtime/opendesign）—— tsc + vitest。
  # 镜像构建在 branch-image.yml 里，而镜像的构建阶段只跑 `pnpm run build`（不编译测试、不跑 vitest），
  # 所以测试只能在这里跑。
