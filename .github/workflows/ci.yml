name: CI
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  SOURCE: 88572a7aa840415d143ca05a3c7f6e2fb82cce31
  BASE: 9d9ab62e1aa99b82a876d822edcd34d6357fbde4
jobs:
  server:
    name: Server Build & Test
    runs-on: ubuntu-22.04
    services:
      mongodb:
        image: mongo:8.0
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      MONGODB_TEST_CONNECTION: mongodb://127.0.0.1:27017
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 88572a7aa840415d143ca05a3c7f6e2fb82cce31
          fetch-depth: 5
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Assert immutable source
        run: test "$(git rev-parse HEAD)" = "$SOURCE"
      - name: Restore remote only
        working-directory: prd-api
        run: dotnet restore PrdAgent.sln
      - name: Reproduce cross application baseline failures
        shell: bash
        run: |
          set -euo pipefail
          for file in prd-api/src/PrdAgent.Api/Controllers/Api/ProductAgentController.cs prd-api/src/PrdAgent.Infrastructure/Services/ProductInitiationIssuance.cs prd-api/src/PrdAgent.Infrastructure/Services/ProductVersionClaimGuard.cs; do
            git show "$BASE:$file" > "$file"
          done
          dotnet build prd-api/PrdAgent.sln -c Release --no-restore
          set +e
          dotnet test prd-api/tests/PrdAgent.Api.Tests -c Release --no-build --filter 'FullyQualifiedName~WorkflowNumberingActualTAndVRequestsUseApplicationBaseline' --logger 'trx;LogFileName=red.trx' --results-directory "$RUNNER_TEMP/numbering-red"
          result=$?
          set -e
          test "$result" -eq 1
          python3 - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          root = ET.parse(os.path.join(os.environ['RUNNER_TEMP'], 'numbering-red/red.trx')).getroot()
          results = [x for x in root.iter() if x.tag.endswith('UnitTestResult')]
          assert len(results) == 3 and all(x.attrib['outcome'] == 'Failed' for x in results)
          assert all('WorkflowNumberingActualTAndVRequestsUseApplicationBaseline' in x.attrib['testName'] for x in results)
          print('RED: minor, medium and major all reproduced cross-application baseline defect')
          PY
          for file in prd-api/src/PrdAgent.Api/Controllers/Api/ProductAgentController.cs prd-api/src/PrdAgent.Infrastructure/Services/ProductInitiationIssuance.cs prd-api/src/PrdAgent.Infrastructure/Services/ProductVersionClaimGuard.cs; do
            git show "$SOURCE:$file" > "$file"
          done
          git diff --exit-code -- prd-api
      - name: Build fixed full solution
        working-directory: prd-api
        run: dotnet build PrdAgent.sln -c Release --no-restore
      - name: Three segment matrix and real claim regressions
        working-directory: prd-api
        run: dotnet test PrdAgent.sln -c Release --no-build --filter 'FullyQualifiedName~ProductEntityNumberingTests|FullyQualifiedName~ProductVersionClaimGuardTests' --logger 'console;verbosity=normal'
