name: CI
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  DOTNET_VERSION: '8.0.x'
jobs:
  server-build:
    name: Server Build & Test
    # 临时兼容：Ubuntu 24.04 runner 的 Linux 6.19+ 内核被当前 Mongo 8.0 拒绝启动。
    runs-on: ubuntu-22.04
    services:
      mongodb:
        image: mongo:8.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      MONGODB_TEST_CONNECTION: mongodb://127.0.0.1:27017
    defaults:
      run:
        working-directory: prd-api

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: 34af9d3e8fc4c804347f27f59064eb581b592b31

      - name: MongoDB runtime versions
        run: |
          uname -r
          docker exec "${{ job.services.mongodb.id }}" mongosh --quiet --eval \
            'const v = db.version(); print("MongoDB " + v); if (!/^8[.]0[.]/.test(v) || db.adminCommand({ ping: 1 }).ok !== 1) quit(1);'

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install video test dependencies
        run: |
          # Azure 镜像源曾连续两轮卡在 deb 下载；使用官方 HTTPS 源，保留包签名与完整依赖校验。
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
          fi
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/**.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      # 官方技能目录是 EmbeddedResource：改了 .claude/skills 却忘了重新生成，
      # 后端会继续分发旧内容，而编译和单测都不会红（2026-07-28 真实踩过：
      # findmapskills 的更新命令在源文件已修，客户下载到的仍是静默不更新的旧版）。
      # 这条自测同时校验生成物新鲜度、分发产物完整性与零 emoji。
      - name: Official skill catalog freshness and bundle self-test
        working-directory: ${{ github.workspace }}
        run: node scripts/test-official-skill-bundles.mjs

      - name: Verify .NET test project discovery contract
        working-directory: ${{ github.workspace }}
        run: bash scripts/verify-dotnet-test-projects.sh

      - name: Restore dependencies
        run: dotnet restore PrdAgent.sln

      - name: Build
        run: dotnet build PrdAgent.sln -c Release --no-restore

      - name: Assert exact source and notification regressions
        run: |
          test "$(git rev-parse HEAD)" = "34af9d3e8fc4c804347f27f59064eb581b592b31"
          dotnet test tests/PrdAgent.Api.Tests -c Release --no-build --filter 'FullyQualifiedName~ProductVersionCopyTemplateTests|FullyQualifiedName~VersionRegistrationCopyTemplateTests' --logger 'console;verbosity=normal'

      - name: Run tests (exclude integration and manual tests)
        run: |
          set -o pipefail
          dotnet test PrdAgent.sln -c Release --no-build --verbosity detailed \
            --filter "Category!=Integration&Category!=Manual" \
            --logger "trx;LogFileName=test-results.trx" \
            --logger "console;verbosity=detailed" \
            --results-directory ./TestResults 2>&1 | tee dotnet-test.log
        shell: bash

      # 失败兜底诊断 —— xunit 失败默认不上 annotation panel,WebFetch 读 HTML 也看不到 raw log,
      # 用 grep 提取 [FAIL] 行并显式 ::error:: 上 annotation,annotation 是公开 HTML 可读的.
      - name: Surface test failures (on failure)
        if: failure()
        run: |
          echo "===== ALWAYS-ON DIAGNOSTIC RAN ====="
          ls -la
          echo "----- find trx -----"
          find . -name "*.trx" -mmin -30 2>/dev/null || echo "(no trx)"
          if [ ! -f dotnet-test.log ]; then
            echo "::warning::dotnet-test.log not found - Build step likely failed BEFORE test step ran"
            exit 0
          fi
          echo "----- last 300 lines of dotnet-test.log -----"
          tail -300 dotnet-test.log
          echo "----- grep [FAIL] / Assert / error markers -----"
          grep -nE "\[FAIL\]|Assert\.|error CS|Failed!|Build FAILED" dotnet-test.log | head -80 || true

          # xunit detailed verbosity 会输出形如:
          #   [xUnit.net 00:00:00.05]   PrdAgent.Api.Tests.Services.ReportImportMarkdownTests.X [FAIL]
          # 把这些行直接转成 annotation,人眼+WebFetch 都能看见.
          echo "----- emitting [FAIL] annotations -----"
          grep -E "\[FAIL\]" dotnet-test.log | sed 's/^[[:space:]]*//' | while IFS= read -r line; do
            echo "::error title=Test FAIL::${line}"
          done || true

          # trx 路线作为补充
          echo "----- emitting trx annotations -----"
          for trx in $(find . -name "test-results.trx" 2>/dev/null); do
            python3 -c "
          import re, sys, xml.etree.ElementTree as ET
          ns = {'t': 'http://microsoft.com/schemas/VisualStudio/TeamTest/2010'}
          root = ET.parse(sys.argv[1]).getroot()
          for r in root.findall('.//t:UnitTestResult[@outcome=\"Failed\"]', ns):
              name = r.get('testName', '?')
              msg_el = r.find('./t:Output/t:ErrorInfo/t:Message', ns)
              msg = (msg_el.text or '').strip() if msg_el is not None else ''
              msg_one = re.sub(r'\s+', ' ', msg)[:500]
              print(f'::error title=Test FAIL: {name}::{msg_one}')
          " "$trx" || echo "(failed to parse $trx)"
          done
        shell: bash

  # Web 管理后台构建
