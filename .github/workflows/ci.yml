name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  DOTNET_VERSION: '8.0.x'
  NODE_VERSION: '20'
  PNPM_VERSION: '9'

jobs:
  # 检测变更的路径
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      server: ${{ steps.filter.outputs.server }}
      admin: ${{ steps.filter.outputs.admin }}
      desktop: ${{ steps.filter.outputs.desktop }}
      cds: ${{ steps.filter.outputs.cds }}
      docs: ${{ steps.filter.outputs.docs }}
      release_scripts: ${{ steps.filter.outputs.release_scripts }}
      acceptance_report: ${{ steps.filter.outputs.acceptance_report }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Path filter
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            server:
              - 'prd-api/**'
              # 用量口径守卫（AdoptionTokenGuardTests / navCoverage 里的 route token 套件）读的是
              # 周报底稿。不登记的话，「只写一份周报、标签写错一个字」的 PR 会整个跳过这道闸——
              # 而那正是它要防的场景（形状 7：守卫自己没接上线）。
              - 'doc/report.*.md'
              # GatewayDataDomainGuardTests 直接读取 llmgw/web 源码并校验跨模块产品契约。
              - 'llmgw/web/**'
              - 'llmgw/serving/**'
              # ProviderPresets 的「baseUrl 是否自带版本号」判据必须与 OpenAIGatewayAdapter 一致，
              # 守卫读的是 console-api 的源码。不登记的话，只改 console-api 的 PR 会跳过这道闸——
              # 而判据漂移正好就发生在只改一边的时候（形状 7：守卫自己没接上线）。
              - 'llmgw/console-api/**'
              # 官方技能目录新鲜度自测跑在 server-build 里，它的输入是这三处。
              # 不登记的话，「只改技能不改 prd-api」的 PR 会整个跳过这道闸 ——
              # 而那恰好就是这道闸要防的场景（改了技能忘重新生成，分发旧内容）。
              - '.claude/skills/**'
              - 'scripts/skill-bundles.json'
              - 'scripts/bundle-official-skills.mjs'
              - 'scripts/test-official-skill-bundles.mjs'
              - 'scripts/verify-dotnet-test-projects.sh'
              - '.github/workflows/ci.yml'
            admin:
              - 'prd-admin/**'
              # 用量口径守卫（AdoptionTokenGuardTests / navCoverage 里的 route token 套件）读的是
              # 周报底稿。不登记的话，「只写一份周报、标签写错一个字」的 PR 会整个跳过这道闸——
              # 而那正是它要防的场景（形状 7：守卫自己没接上线）。
              - 'doc/report.*.md'
              - 'e2e/**'
              - '.github/workflows/ci.yml'
            desktop:
              - 'prd-desktop/**'
              - '.github/workflows/ci.yml'
            cds:
              - 'cds/**'
              - '.github/workflows/ci.yml'
            docs:
              # 文档说人话闸门：判据 doc/rule.doc.readability.md。
              # 新增文档必须自带导读三行，否则棘轮欠账上升，这道闸会红。
              - 'doc/**'
              # 规则与技能同闸：规则要有导读两行，技能 frontmatter 要能说清触发时机
              - '.claude/rules/**'
              # Codex 侧规则同属这道闸：少扫一处，那一处就能绕开导读要求
              - '.Codex/rules/**'
              # 面包屑守卫扫的是全仓 git 跟踪的源码文件，所以这道闸的触发面也必须是全仓：
              # 列举根目录 = 列漏的那棵树里引入死引用时闸门照样跳过（形状 7）。
              # 代价是这个 job 每个 PR 都跑一次，十几秒，换的是「守卫扫到哪、闸门就管到哪」。
              - '**'
              - '.claude/skills/**/SKILL.md'
              # 守卫会读这几份汇报模板，断言「本周一句话 / 今日大事」还在。
              # 不登记进来的话，只改模板的 PR 会整个跳过这道闸——守卫等于没接上线。
              - '.claude/skills/weekly-update-summary/reference/**'
              - '.claude/skills/daily-report-summary/reference/**'
              - 'scripts/doc-readability-check.py'
              - 'scripts/fixtures/doc-readability-baseline.json'
              - 'scripts/tests/doc-readability-ratchet.test.py'
              # --skills-audit 的输出契约守卫（entropy-cleanup 的 D4 靠那些前缀决策）
              - 'scripts/tests/test_skills_audit_contract.py'
              - '.github/workflows/ci.yml'
            release_scripts:
              - 'exec_dep.sh'
              - 'scripts/lib/static-release.sh'
              - 'scripts/lib/gateway-bind-mount.sh'
              - 'scripts/prd-agent-public-surface-smoke.py'
              - 'scripts/prd-agent-release-evidence.py'
              - 'scripts/tests/static-release-*.test.sh'
              - 'scripts/tests/gateway-bind-mount-coherence.test.sh'
              - 'scripts/tests/public-surface-smoke.test.py'
              - 'scripts/tests/asset-storage-readiness-gate.test.py'
              - 'scripts/tests/release-evidence.test.py'
              - 'scripts/llmgw-prod-preflight.py'
              - 'scripts/tests/gateway-route-self-test-diagnosis.test.py'
              # 下面这批 test_*.py 曾经躺在 scripts/tests/ 里没有任何 workflow 引用，
              # 写了等于没写（predicate-and-wiring-discipline 形状 2 与形状 4 的合体）。
              # 它们守的是 gw-smoke / 发布双密钥 / rollout 账本 / ASR WebSocket 转发，
              # 所以连同各自的被测脚本一起登记进这道闸。
              - 'scripts/gw-smoke.py'
              - 'scripts/llmgw-rollout-ledger.py'
              - 'scripts/tests/test_*.py'
              # cdscli 的冒烟覆盖守卫盯的是这个脚本本身：不把它登记进来，
              # 只改 cdscli 的 PR 就完全跳过这道闸，而假绿恰恰是在那里回潮的
              # （形状 7：守卫自己没接上线）。
              - '.claude/skills/cds/cli/cdscli.py'
              # 守卫的**被测文件**也必须登记，否则这道闸只在「守卫自己被改」时开，
              # 而它要防的漂移恰恰发生在被测文件那边：只改模板/规则的 PR 一路全绿，
              # 守卫从头到尾没跑过（predicate-and-wiring-discipline 形状 2）。
              # cds/** 虽有自己的 filter，但那个 job 不跑这批 Python 守卫，不能顶替。
              - '.claude/rules/report-design-system.md'
              - '.claude/skills/daily-report-summary/reference/report-template-html.html'
              - '.claude/skills/weekly-update-summary/reference/report-template-html.html'
              - '.claude/skills/create-visual-test-to-kb/scripts/archive_report.py'
              - 'cds/src/scheduler/nginx-template.ts'
              - 'scripts/tests/validate-static-dist.test.sh'
              - 'scripts/validate-static-dist.sh'
              # 同一个坑的第二批：scripts/tests/ 下 14 个 *.test.mjs（稳定冒烟的编排、
              # 结果归并、视觉闸、通知分流，共 150 条断言）也从来没有任何 workflow 引用过。
              # 它们今天全绿，说明不是坏的——只是没人跑。连同各自的被测脚本一起登记。
              - 'scripts/tests/*.test.mjs'
              - 'scripts/stable-smoke*.mjs'
              - 'scripts/compose-stable-smoke-supervisor-report.mjs'
              - 'scripts/prepare-stable-smoke-archive-report.mjs'
              - 'scripts/split-stable-smoke-report.mjs'
              # 设计复刻工具里被守卫盯着的判据函数（样例数据键、档位导出与比对）
              - '.claude/skills/design-replication/scripts/fixtures.mjs'
              - '.claude/skills/design-replication/scripts/spec-export.mjs'
              - '.claude/skills/design-replication/scripts/spec-diff.mjs'
              # 切图的横向裁剪边界与漂移守卫的零比对判红。登记在这里是形状 7 的补课：
              # 守卫只在自己被改时才跑的话，真正会引入漂移的那种 PR（只改被守文件）一路全绿。
              - '.claude/skills/design-replication/scripts/extract-design.mjs'
              - '.claude/skills/design-replication/scripts/fixture-drift.mjs'
              - 'deploy/nginx/**'
              - '.github/workflows/ci.yml'
            acceptance_report:
              # 验收报告的归档门禁（结论语义分层 + 给你的一页结论 + HTML 模板契约）。
              # 这两个守卫此前躺在仓库里没有任何 workflow 引用，只有人手动跑才会红
              # （predicate-and-wiring-discipline 形状 7：守卫自己没接上线）。
              # 被守文件与守卫本身一起登记，只改规则/模板的 PR 也必须跑过这道闸。
              - 'scripts/test-acceptance-archive-report-gates.py'
              - 'scripts/check-acceptance-rule-ssot.py'
              - 'scripts/sync-acceptance-rule-snapshots.py'
              - '.claude/skills/create-visual-test-to-kb/scripts/archive_report.py'
              - '.claude/skills/create-visual-test-to-kb/scripts/test_archive_report_verdict_contract.py'
              - '.claude/skills/create-visual-test-to-kb/reference/**'
              - '.claude/skills/create-visual-test-to-kb/templates/**'
              - '.claude/skills/*/references/rules/**'
              - 'doc/rule.acceptance.*.md'
              - 'doc/guide.acceptance.*.md'
              - 'doc/design.acceptance.knowledge-governance.md'
              - '.github/workflows/ci.yml'

  docs-readability:
    name: Docs Readability Ratchet
    needs: changes
    if: needs.changes.outputs.docs == 'true' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # 要跟目标分支算「本次碰过哪些文档」，浅克隆没有共同祖先，算不出来
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch base branch baseline
        # 基线要跟目标分支比：不取 main 的话，本分支自己放宽的基线会拿来跟自己比
        # PR 比目标分支；push 到 main 时 base_ref 是空的，必须比这次推送之前的那个 commit，
        # 否则取到的就是刚推上去的自己，基线又变成跟自己比
        run: |
          if [ -n "${{ github.base_ref }}" ]; then
            # PR：跟目标分支比
            git fetch --no-tags origin "${{ github.base_ref }}:refs/remotes/origin/base"
          elif [ -n "${{ github.event.before }}" ] \
               && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            # push：跟这次推送之前的那个 commit 比
            git fetch --no-tags origin "${{ github.event.before }}"
            git update-ref refs/remotes/origin/base "${{ github.event.before }}"
          else
            # 手动 dispatch / 新分支首推：两个值都没有，退回默认分支。
            # 不能沿用 push 分支 —— 那会执行 update-ref 传空 SHA，直接报错。
            git fetch --no-tags origin "${{ github.event.repository.default_branch }}:refs/remotes/origin/base"
          fi

      - name: Doc reader-header ratchet
        run: python3 scripts/doc-readability-check.py --ratchet --baseline-ref origin/base

      - name: Doc readability checker guard test
        run: python3 scripts/tests/doc-readability-ratchet.test.py

      - name: Claude memory contract
        # 守的是 CLAUDE.md 与 .claude/rules/ 的加载契约：frontmatter 键必须是 `paths`
        # （写成 `globs` 会静默退化成全量加载）、每个 glob 必须命中真实文件（死 glob
        # 会让规则永不加载，比不写还差）、注入行数不超预算。这道闸挂在 docs 这里是因为
        # 它的 filter 已含 '**' 与 '.claude/rules/**'，每个 PR 都开——被测文件在哪
        # 一棵树里改动都跑得到（predicate-and-wiring-discipline 形状 7）。
        run: python3 scripts/tests/test_claude_memory_contract.py

      - name: Skills audit output contract
        # entropy-cleanup 的 D4 完全靠 --skills-audit 的输出前缀决策：
        # `AUTOFIX_NAME: ` 触发自动补 name，`BLOCK: ` 触发硬闸拦住自动合并。
        # 前缀改一个字、某种坏清单漏判、或退出码不对，熵减就会静默地要么不修、
        # 要么把不可发现的技能合进去，而全仓测试照样全绿——正是「删掉不会红」
        # 的那类接线，所以必须有守卫。同样挂在 docs 这道闸（filter 含 '**'）。
        run: python3 scripts/tests/test_skills_audit_contract.py

  release-script-test:
    name: Production Release Script Test
    needs: changes
    if: needs.changes.outputs.release_scripts == 'true' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Static release layout
        run: sh scripts/tests/static-release-layout.test.sh

      - name: Static release through nginx worker
        run: sh scripts/tests/static-release-nginx.test.sh

      - name: Gateway bind mount coherence
        run: sh scripts/tests/gateway-bind-mount-coherence.test.sh

      - name: Public surface smoke unit test
        run: python3 scripts/tests/public-surface-smoke.test.py

      - name: Asset storage readiness gate
        run: python3 scripts/tests/asset-storage-readiness-gate.test.py

      - name: Release evidence ledger
        run: python3 scripts/tests/release-evidence.test.py

      - name: Gateway route self-test failure diagnosis
        run: python3 scripts/tests/gateway-route-self-test-diagnosis.test.py

      - name: Static dist validation
        run: sh scripts/tests/validate-static-dist.test.sh

      - name: Release script source guards
        run: |
          set -e
          for t in scripts/tests/test_*.py; do
            echo "--- $t"
            python3 "$t"
          done

      # scripts/tests/ 下的 *.test.mjs 此前没有任何 workflow 引用（写了等于没写）。
      # 用 node --test 一次跑完；shopt -s nullglob 保证「一个都没有」时是空跑而不是
      # 把字面量 '*.test.mjs' 当文件名传进去炸掉。
      - name: Script guards (node --test)
        shell: bash
        run: |
          set -e
          shopt -s nullglob
          files=(scripts/tests/*.test.mjs)
          if [ ${#files[@]} -eq 0 ]; then
            echo "没有 *.test.mjs —— 这道步骤本该有东西可跑，请检查是不是被误删了"
            exit 1
          fi
          node --test "${files[@]}"

  acceptance-report-gate:
    name: Acceptance Report Gate
    needs: changes
    if: needs.changes.outputs.acceptance_report == 'true' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Acceptance rule SSOT wiring
        run: python3 scripts/check-acceptance-rule-ssot.py

      - name: Archive report gates
        run: python3 scripts/test-acceptance-archive-report-gates.py

      - name: Daily verdict and plain-summary contract
        run: python3 .claude/skills/create-visual-test-to-kb/scripts/test_archive_report_verdict_contract.py

  # 后端服务构建和测试
  server-build:
    name: Server Build & Test
    needs: changes
    if: needs.changes.outputs.server == 'true' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:8.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      MONGODB_TEST_CONNECTION: mongodb://127.0.0.1:27017
    defaults:
      run:
        working-directory: prd-api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install video test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/**.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      # 官方技能目录是 EmbeddedResource：改了 .claude/skills 却忘了重新生成，
      # 后端会继续分发旧内容，而编译和单测都不会红（2026-07-28 真实踩过：
      # findmapskills 的更新命令在源文件已修，客户下载到的仍是静默不更新的旧版）。
      # 这条自测同时校验生成物新鲜度、分发产物完整性与零 emoji。
      - name: Official skill catalog freshness and bundle self-test
        working-directory: ${{ github.workspace }}
        run: node scripts/test-official-skill-bundles.mjs

      - name: Verify .NET test project discovery contract
        working-directory: ${{ github.workspace }}
        run: bash scripts/verify-dotnet-test-projects.sh

      - name: Restore dependencies
        run: dotnet restore PrdAgent.sln

      - name: Build
        run: dotnet build PrdAgent.sln -c Release --no-restore

      - name: Run tests (exclude integration and manual tests)
        run: |
          set -o pipefail
          dotnet test PrdAgent.sln -c Release --no-build --verbosity detailed \
            --filter "Category!=Integration&Category!=Manual" \
            --logger "trx;LogFileName=test-results.trx" \
            --logger "console;verbosity=detailed" \
            --results-directory ./TestResults 2>&1 | tee dotnet-test.log
        shell: bash

      # 失败兜底诊断 —— xunit 失败默认不上 annotation panel,WebFetch 读 HTML 也看不到 raw log,
      # 用 grep 提取 [FAIL] 行并显式 ::error:: 上 annotation,annotation 是公开 HTML 可读的.
      - name: Surface test failures (on failure)
        if: failure()
        run: |
          echo "===== ALWAYS-ON DIAGNOSTIC RAN ====="
          ls -la
          echo "----- find trx -----"
          find . -name "*.trx" -mmin -30 2>/dev/null || echo "(no trx)"
          if [ ! -f dotnet-test.log ]; then
            echo "::warning::dotnet-test.log not found - Build step likely failed BEFORE test step ran"
            exit 0
          fi
          echo "----- last 300 lines of dotnet-test.log -----"
          tail -300 dotnet-test.log
          echo "----- grep [FAIL] / Assert / error markers -----"
          grep -nE "\[FAIL\]|Assert\.|error CS|Failed!|Build FAILED" dotnet-test.log | head -80 || true

          # xunit detailed verbosity 会输出形如:
          #   [xUnit.net 00:00:00.05]   PrdAgent.Api.Tests.Services.ReportImportMarkdownTests.X [FAIL]
          # 把这些行直接转成 annotation,人眼+WebFetch 都能看见.
          echo "----- emitting [FAIL] annotations -----"
          grep -E "\[FAIL\]" dotnet-test.log | sed 's/^[[:space:]]*//' | while IFS= read -r line; do
            echo "::error title=Test FAIL::${line}"
          done || true

          # trx 路线作为补充
          echo "----- emitting trx annotations -----"
          for trx in $(find . -name "test-results.trx" 2>/dev/null); do
            python3 -c "
          import re, sys, xml.etree.ElementTree as ET
          ns = {'t': 'http://microsoft.com/schemas/VisualStudio/TeamTest/2010'}
          root = ET.parse(sys.argv[1]).getroot()
          for r in root.findall('.//t:UnitTestResult[@outcome=\"Failed\"]', ns):
              name = r.get('testName', '?')
              msg_el = r.find('./t:Output/t:ErrorInfo/t:Message', ns)
              msg = (msg_el.text or '').strip() if msg_el is not None else ''
              msg_one = re.sub(r'\s+', ' ', msg)[:500]
              print(f'::error title=Test FAIL: {name}::{msg_one}')
          " "$trx" || echo "(failed to parse $trx)"
          done
        shell: bash

  # Web 管理后台构建
  admin-build:
    name: Admin Dashboard Build
    needs: changes
    # main 分支发布不能只依赖本次 push 的路径变更:
    # 如果上一轮某个模块构建失败,后续只改其他模块会导致失败模块永久 skipped。
    # PR/develop 仍按路径过滤节省资源。
    if: needs.changes.outputs.admin == 'true' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prd-admin

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Get pnpm store directory
        id: pnpm_store
        shell: bash
        run: |
          echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm_store.outputs.path }}
          key: ${{ runner.os }}-pnpm-admin-${{ hashFiles('prd-admin/pnpm-lock.yaml', 'prd-admin/package.json') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-admin-

      - name: Install dependencies
        run: pnpm install

      - name: Type check
        run: pnpm tsc --noEmit

      - name: Run tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Install recording acceptance dependencies
        working-directory: ${{ github.workspace }}/e2e
        run: pnpm install --frozen-lockfile

      - name: Type check recording acceptance
        working-directory: ${{ github.workspace }}/e2e
        run: pnpm typecheck

      - name: Install Chromium for recording acceptance
        working-directory: ${{ github.workspace }}/e2e
        run: pnpm exec playwright install --with-deps chromium

      - name: Run recording continuity acceptance
        working-directory: ${{ github.workspace }}/e2e
        env:
          E2E_LOCAL_SERVER: '1'
        run: pnpm exec playwright test specs/recording-continuity.spec.ts

      - name: Upload recording acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recording-continuity-acceptance-${{ github.run_id }}
          path: |
            e2e/playwright-report/
            e2e/results.json
          if-no-files-found: warn
          retention-days: 14

  # 桌面客户端构建检查（不打包）
  desktop-check:
    name: Desktop Client Check
    needs: changes
    if: needs.changes.outputs.desktop == 'true' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: prd-desktop

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Get pnpm store directory
        id: pnpm_store
        shell: bash
        run: |
          echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm_store.outputs.path }}
          key: ${{ runner.os }}-pnpm-desktop-${{ hashFiles('prd-desktop/pnpm-lock.yaml', 'prd-desktop/package.json') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-desktop-

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust toolchain fingerprint
        id: rustc
        run: |
          if command -v sha256sum >/dev/null 2>&1; then
            FP="$(rustc -Vv | sha256sum | awk '{print $1}')"
          else
            FP="$(rustc -Vv | shasum -a 256 | awk '{print $1}')"
          fi
          echo "fingerprint=$FP" >> "$GITHUB_OUTPUT"

      - name: glibc fingerprint (Linux)
        id: glibc
        run: |
          GLIBC_VER="$(getconf GNU_LIBC_VERSION 2>/dev/null || (ldd --version | head -n1))"
          GLIBC_FP="$(printf '%s' "$GLIBC_VER" | sha256sum | cut -d ' ' -f1)"
          echo "fingerprint=$GLIBC_FP" >> $GITHUB_OUTPUT

      - name: Cache Cargo registry/git
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/registry/src/
            ~/.cargo/git/db/
            ~/.cargo/git/checkouts/
          key: ${{ runner.os }}-cargo-registry-${{ steps.rustc.outputs.fingerprint }}-${{ hashFiles('prd-desktop/src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-${{ steps.rustc.outputs.fingerprint }}-
            ${{ runner.os }}-cargo-registry-

      - name: Cache Cargo target (platform specific)
        uses: actions/cache@v4
        with:
          path: |
            prd-desktop/src-tauri/target/
          key: ${{ runner.os }}-cargo-target-${{ steps.rustc.outputs.fingerprint }}-${{ steps.glibc.outputs.fingerprint }}-${{ hashFiles('prd-desktop/src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-target-${{ steps.rustc.outputs.fingerprint }}-${{ steps.glibc.outputs.fingerprint }}-
            ${{ runner.os }}-cargo-target-${{ steps.rustc.outputs.fingerprint }}-
            ${{ runner.os }}-cargo-target-

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.6
      
      - name: Enable sccache (best effort)
        shell: bash
        run: |
          set +e
          SCCACHE_GHA_ENABLED=true sccache --start-server
          if [ $? -eq 0 ]; then
            echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
            echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
          else
            echo "sccache unavailable (likely GH cache transient issue), fallback to plain rustc"
          fi
          set -e

      - name: Install system dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: pnpm install

      - name: Type check frontend
        run: pnpm tsc --noEmit

      - name: Build frontend
        run: pnpm build

      - name: Generate Tauri icons
        run: pnpm tauri:icons

      - name: Check Rust (dev)
        working-directory: prd-desktop/src-tauri
        run: cargo check

      - name: Check Rust (release)
        working-directory: prd-desktop/src-tauri
        run: cargo check --release

      - name: Rust format check
        working-directory: prd-desktop/src-tauri
        run: cargo fmt --check

      - name: Rust clippy
        working-directory: prd-desktop/src-tauri
        run: cargo clippy -- -D warnings

      - name: sccache stats
        if: always()
        shell: bash
        run: |
          if command -v sccache >/dev/null 2>&1; then
            sccache --show-stats || true
          fi

  # CDS dashboard (Node/Express) — tsc + vitest (738 tests baseline).
  # Mirrors the dedicated `cds.yml` workflow so every aggregate `ci.yml`
  # run reports a unified ci-status for branch protection, even though
  # cds.yml still exists for operator familiarity. The jobs are
  # path-filtered so a PR that only touches cds/** doesn't pay the
  # full admin+desktop+server price here.
  cds-build:
    name: CDS Build & Test
    needs: changes
    if: needs.changes.outputs.cds == 'true' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cds

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Get pnpm store directory
        id: pnpm_store
        shell: bash
        run: |
          echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm_store.outputs.path }}
          key: ${{ runner.os }}-pnpm-cds-${{ hashFiles('cds/pnpm-lock.yaml', 'cds/package.json', 'cds/web/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-cds-

      - name: Install dependencies
        run: pnpm install

      # 前端依赖装在 cds/web/node_modules。tests/ 里的渲染冒烟直接 import 前端组件，
      # vitest.config.ts 把 react / react-dom 别名指向那里；这一步缺了别名就解析不到，
      # 整个测试文件加载失败。守卫见 tests/lint/ci-installs-web-deps.test.ts。
      - name: Install web dependencies
        run: pnpm run install:web

      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Run tests
        run: pnpm test

  # CI 状态汇总（用于 branch protection）
  ci-status:
    name: CI Status
    runs-on: ubuntu-latest
    needs: [changes, server-build, admin-build, desktop-check, cds-build, docs-readability, acceptance-report-gate]
    if: always()
    steps:
      - name: Check CI status
        run: |
          echo "Changes detected:"
          echo "  Server: ${{ needs.changes.outputs.server }}"
          echo "  Admin: ${{ needs.changes.outputs.admin }}"
          echo "  Desktop: ${{ needs.changes.outputs.desktop }}"
          echo "  CDS: ${{ needs.changes.outputs.cds }}"
          echo "  Docs: ${{ needs.changes.outputs.docs }}"
          echo "  Acceptance report: ${{ needs.changes.outputs.acceptance_report }}"

          # main push 是发布线,所有关键 job 都必须成功。
          # PR/develop 仍只要求本次改动涉及的模块成功。
          main_push="${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}"
          server_required="${{ needs.changes.outputs.server == 'true' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}"
          admin_required="${{ needs.changes.outputs.admin == 'true' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}"
          desktop_required="${{ needs.changes.outputs.desktop == 'true' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}"
          cds_required="${{ needs.changes.outputs.cds == 'true' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}"
          docs_required="${{ needs.changes.outputs.docs == 'true' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}"
          acceptance_required="${{ needs.changes.outputs.acceptance_report == 'true' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}"

          echo "Main push: $main_push"
          echo "Required jobs:"
          echo "  Server: $server_required"
          echo "  Admin: $admin_required"
          echo "  Desktop: $desktop_required"
          echo "  CDS: $cds_required"
          echo "  Docs: $docs_required"
          echo "  Acceptance report: $acceptance_required"

          server_ok="$([[ "$server_required" != "true" || "${{ needs.server-build.result }}" == "success" ]] && echo true || echo false)"
          admin_ok="$([[ "$admin_required" != "true" || "${{ needs.admin-build.result }}" == "success" ]] && echo true || echo false)"
          desktop_ok="$([[ "$desktop_required" != "true" || "${{ needs.desktop-check.result }}" == "success" ]] && echo true || echo false)"
          cds_ok="$([[ "$cds_required" != "true" || "${{ needs.cds-build.result }}" == "success" ]] && echo true || echo false)"
          docs_ok="$([[ "$docs_required" != "true" || "${{ needs.docs-readability.result }}" == "success" ]] && echo true || echo false)"
          acceptance_ok="$([[ "$acceptance_required" != "true" || "${{ needs.acceptance-report-gate.result }}" == "success" ]] && echo true || echo false)"

          if [[ "$server_ok" == "true" && "$admin_ok" == "true" && "$desktop_ok" == "true" && "$cds_ok" == "true" && "$docs_ok" == "true" && "$acceptance_ok" == "true" ]]; then
            echo "All required checks passed!"
            exit 0
          else
            echo "Some checks failed"
            echo "  Server: ${{ needs.server-build.result }}"
            echo "  Admin: ${{ needs.admin-build.result }}"
            echo "  Desktop: ${{ needs.desktop-check.result }}"
            echo "  CDS: ${{ needs.cds-build.result }}"
            echo "  Docs: ${{ needs.docs-readability.result }}"
            echo "  Acceptance report: ${{ needs.acceptance-report-gate.result }}"
            exit 1
          fi
