name: Server Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      docker_platforms:
        description: "Docker platforms (default: linux/amd64). Use 'linux/amd64,linux/arm64' only if you really need multi-arch."
        required: false
        default: "linux/amd64"
      release_tag:
        description: "Optional immutable release tag, for example prod-20260702-1. The workflow always publishes sha-<commit>."
        required: false
        default: ""
      publish_latest:
        description: "Also publish mutable latest on manual dispatch. Pushes to main always publish latest."
        type: boolean
        required: false
        default: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/prdagent-server
  DOCKER_PLATFORMS: ${{ inputs.docker_platforms || 'linux/amd64' }}

jobs:
  # 构建并推送 Docker 镜像
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
      image_digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate publication inputs
        shell: bash
        env:
          RELEASE_TAG_INPUT: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if [[ -n "$RELEASE_TAG_INPUT" && ! "$RELEASE_TAG_INPUT" =~ ^[A-Za-z0-9_][A-Za-z0-9._-]{0,127}$ ]]; then
            echo "Invalid release tag" >&2; exit 1
          fi
          case "$DOCKER_PLATFORMS" in
            linux/amd64|linux/arm64|linux/amd64,linux/arm64) ;;
            *) echo "Unsupported platforms" >&2; exit 1 ;;
          esac

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      # 仅在需要 arm64 时启用 QEMU（否则会额外耗时）
      - name: Setup QEMU
        if: ${{ contains(env.DOCKER_PLATFORMS, 'arm64') }}
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # push main 兼容现有一键部署路径；手动热修默认只产出不可变 ref，避免污染 latest。
            type=raw,value=latest,enable=${{ github.event_name == 'push' || inputs.publish_latest == true }}
            type=raw,value=sha-${{ github.sha }}
            type=raw,value=${{ inputs.release_tag }},enable=${{ github.event_name == 'workflow_dispatch' && inputs.release_tag != '' }}

      - name: Build metadata
        id: build_meta
        shell: bash
        run: |
          echo "build_time_utc=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: build
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: ./prd-api
          file: ./prd-api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_COMMIT=${{ github.sha }}
            BUILD_TIME_UTC=${{ steps.build_meta.outputs.build_time_utc }}
          # 关闭额外产物生成可减少构建与上传时间
          provenance: false
          sbom: false
          # 更稳定的缓存隔离，避免不同 workflow/镜像互相挤占 cache
          cache-from: type=gha,scope=prd-api
          cache-to: type=gha,mode=max,scope=prd-api
          platforms: ${{ env.DOCKER_PLATFORMS }}
