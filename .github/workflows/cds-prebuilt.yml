name: CDS Prebuilt (self-update express)

# CDS 自更新「极速版」—— push 修改 CDS 或镜像内技能时，在 GitHub Actions 上把 CDS 编译好
# （esbuild 后端 + vite 前端 + tsc 类型门），打成 ghcr OCI 产物镜像 cds-dist:sha-<40hex>，
# 供 CDS 自更新直接 docker pull + 解出，跳过本机编译（tsc 52s + vite 1.6min 卸到 CI）。
# 自更新逻辑找不到对应 SHA 的预构建产物时，回退到现有「本机现编」路径——故本 workflow
# 纯增量、不影响存量自更新。SSOT 约定：tag = sha-${github.sha}（完整 40 hex，不可变，
# 与项目极速版 branch-image.yml 同公式）。

on:
  push:
    branches: ["**"]
    paths:
      - "cds/**"
      - "cds-instances.json"
      - ".github/workflows/cds-prebuilt.yml"
      - ".claude/skills/cds/**"
      - ".claude/skills/cds-design/**"
      - ".claude/skills/cds-project-scan/**"
      - ".claude/skills/cds-deploy-pipeline/**"
      - ".claude/skills/cds-release/**"
      - ".claude/skills/preview-url/**"
  workflow_dispatch:
    inputs:
      capacity_standard_runtime:
        description: "发布供隔离持久化验收的标准CDS运行镜像"
        required: false
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/${{ github.event.repository.name }}/cds-dist

jobs:
  build-and-push:
    name: Build & Push CDS Prebuilt
    # 浏览器验收与管理端使用同一受支持LTS，避免新runner字体依赖安装超时。
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "9"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install CDS deps
        timeout-minutes: 10
        run: |
          pnpm -C cds install --frozen-lockfile
          pnpm -C cds/web install --frozen-lockfile
          pnpm -C cds exec playwright install --with-deps chromium

      - name: Install design runtime test dependencies
        run: pnpm -C design-runtime/opendesign install --frozen-lockfile

      # 类型门：把 self-update 现有的 tsc --noEmit 校验挪到 CI。两端都过才出产物，
      # 等于「预构建产物天生已通过类型检查」，本机自更新不必再花 52s 跑 tsc。
      - name: Type-check gate (cds + web)
        run: |
          pnpm -C cds exec tsc --noEmit
          pnpm -C cds/web exec tsc --noEmit

      - name: Test CDS before publishing executable artifacts
        run: pnpm -C cds test

      - name: Build backend (esbuild → cds/dist)
        run: |
          cd cds
          OUT_DIR=dist node scripts/build-dist-esbuild.mjs

      - name: Verify backend imports without source checkout
        run: pnpm -C cds exec vitest run tests/services/prebuilt-source-free-import.test.ts

      - name: Build web (vite → cds/web/dist)
        run: pnpm -C cds/web build

      - name: Verify loading continuity in a real browser
        timeout-minutes: 10
        run: |
          pnpm -C cds/web exec vite preview --host 127.0.0.1 --port 8870 --strictPort > "$RUNNER_TEMP/cds-loading-preview.log" 2>&1 &
          CDS_LOADING_PREVIEW_PID=$!
          trap 'kill "$CDS_LOADING_PREVIEW_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8870/ > /dev/null; then break; fi
            sleep 1
          done
          pnpm -C cds exec node scripts/notification-classification-smoke.mjs http://127.0.0.1:8870
          pnpm -C cds smoke:branch-picker-motion http://127.0.0.1:8870
          pnpm -C cds smoke:loading http://127.0.0.1:8870 --out "$RUNNER_TEMP/cds-loading-continuity"
          CDS_LOADING_EVIDENCE="$RUNNER_TEMP/cds-loading-neighbors" node cds/scripts/loading-coverage-smoke.mjs http://127.0.0.1:8870
          CDS_SKELETON_EVIDENCE="$RUNNER_TEMP/cds-loading-lists" node cds/scripts/list-loading-smoke.mjs http://127.0.0.1:8870

      - name: Archive loading acceptance failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cds-loading-failure-${{ github.sha }}
          path: ${{ runner.temp }}/cds-loading-*
          retention-days: 7

      - name: Write prebuilt manifest
        run: |
          cat > cds/cds-prebuilt-manifest.json <<JSON
          {
            "sha": "${{ github.sha }}",
            "ref": "${{ github.ref_name }}",
            "builtAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "runId": "${{ github.run_id }}",
            "schema": 1
          }
          JSON

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # 不可变全 SHA tag（自更新按它精确认领），外加每分支移动 tag 便于排查。
          tags: |
            type=raw,value=sha-${{ github.sha }}
            type=ref,event=branch,prefix=branch-

      - name: Build isolated design cover renderer
        uses: docker/build-push-action@v5
        with:
          context: ./cds
          file: ./cds/Dockerfile.design-cover
          load: true
          push: false
          tags: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}/cds-design-cover:sha-${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Verify isolated design cover capture
        run: node cds/scripts/verify-design-cover-container.mjs ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}/cds-design-cover:sha-${{ github.sha }}

      - name: Verify design handoff counterexamples in Chromium
        run: node cds/scripts/verify-design-handoff-browser.mjs

      - name: Publish verified design cover renderer
        run: docker push ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}/cds-design-cover:sha-${{ github.sha }}

      - name: Build & push CDS prebuilt image
        uses: docker/build-push-action@v5
        with:
          context: ./cds
          file: ./cds/Dockerfile.dist
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Stage canonical CDS onboarding skills
        run: |
          mkdir -p cds/agent-skills
          for skill in cds cds-design cds-project-scan cds-deploy-pipeline cds-release preview-url; do
            cp -R ".claude/skills/$skill" "cds/agent-skills/$skill"
          done

      # 验收前只加载到 runner，部署端不能拉到未通过冒烟的 SHA 产物。
      - name: Build & load CDS preview runtime
        uses: docker/build-push-action@v5
        with:
          context: ./cds
          file: ./cds/Dockerfile.preview
          push: false
          load: true
          tags: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}/cds-preview:sha-${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Smoke CDS preview runtime
        run: |
          docker run --pull=never --rm -i --entrypoint sh \
            ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}/cds-preview:sha-${{ github.sha }} -e <<'OPENSSL_SMOKE'
          set -eu
          git --version
          openssl_smoke_dir="$(mktemp -d)"
          trap 'rm -rf "$openssl_smoke_dir"' EXIT
          openssl req -x509 -newkey rsa:2048 -nodes -days 2 \
            -subj '/CN=CDS runtime smoke' -addext 'subjectAltName=IP:127.0.0.1' \
            -keyout "$openssl_smoke_dir/key.pem" -out "$openssl_smoke_dir/cert.pem" >/dev/null 2>&1
          openssl x509 -in "$openssl_smoke_dir/cert.pem" -noout -checkend 86400
          OPENSSL_SMOKE
          docker run --pull=never -d --name cds-preview-smoke --memory 768m --cpus 1 \
            -p 127.0.0.1:19900:9900 \
            ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}/cds-preview:sha-${{ github.sha }}
          python3 cds/scripts/smoke-preview-runtime.py http://127.0.0.1:19900

      - name: Publish verified CDS preview runtime
        if: success()
        run: docker push ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}/cds-preview:sha-${{ github.sha }}

      - name: Preview smoke logs
        if: failure()
        run: docker logs cds-preview-smoke 2>&1 || true

      - name: Remove preview smoke container
        if: always()
        run: docker rm -f cds-preview-smoke 2>/dev/null || true

      # 标准运行镜像保留仓库既有用户与工作目录；仅显式验收时发布。
      # 不改变预览实例的环境隔离，也不在部署端绕过提交一致性门禁。
      - name: Build & load opt-in standard CDS runtime
        if: github.event_name == 'workflow_dispatch' && inputs.capacity_standard_runtime
        uses: docker/build-push-action@v5
        with:
          context: ./cds
          file: ./cds/Dockerfile
          push: false
          load: true
          tags: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}/cds-runtime:sha-${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Verify standard runtime assets and persistent volume across recreation
        if: github.event_name == 'workflow_dispatch' && inputs.capacity_standard_runtime
        env:
          CDS_ACCEPTANCE_IMAGE: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}/cds-runtime:sha-${{ github.sha }}
          CDS_ACCEPTANCE_SHA: ${{ github.sha }}
        run: |
          set -eu
          CDS_ACCEPTANCE_VOLUME="cds-capacity-acceptance-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker volume create --label cds.capacity-acceptance="$GITHUB_RUN_ID" "$CDS_ACCEPTANCE_VOLUME"
          trap 'docker volume rm "$CDS_ACCEPTANCE_VOLUME"' EXIT
          docker run --pull=never --rm --mount "type=volume,src=$CDS_ACCEPTANCE_VOLUME,dst=/app/.cds,volume-nocopy" \
            --env CDS_ACCEPTANCE_SHA --entrypoint node "$CDS_ACCEPTANCE_IMAGE" -e '
              const fs=require("fs"),assert=require("assert");
              assert.equal(JSON.parse(fs.readFileSync("cds-prebuilt-manifest.json")).sha,process.env.CDS_ACCEPTANCE_SHA);
              for(const p of ["dist/services/host-capacity-probe.py","dist/services/static-artifact-proof.py","web/dist/index.html"]) assert(fs.statSync(p).size>0,p);
              fs.writeFileSync(".cds/acceptance-state",process.env.CDS_ACCEPTANCE_SHA,{mode:0o600,flag:"wx"});
              assert.equal(fs.statSync(".cds/acceptance-state").mode&0o777,0o600);
            '
          docker run --pull=never --rm --mount "type=volume,src=$CDS_ACCEPTANCE_VOLUME,dst=/app/.cds,volume-nocopy" \
            --env CDS_ACCEPTANCE_SHA --entrypoint node "$CDS_ACCEPTANCE_IMAGE" -e '
              const fs=require("fs"),assert=require("assert");
              assert.equal(fs.readFileSync(".cds/acceptance-state","utf8"),process.env.CDS_ACCEPTANCE_SHA);
              assert.equal(fs.statSync(".cds/acceptance-state").mode&0o777,0o600);
            '
          docker run --pull=never --rm --entrypoint python3 "$CDS_ACCEPTANCE_IMAGE" dist/services/host-capacity-probe.py --help > /dev/null

      - name: Publish verified opt-in standard CDS runtime
        if: success() && github.event_name == 'workflow_dispatch' && inputs.capacity_standard_runtime
        run: docker push ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}/cds-runtime:sha-${{ github.sha }}
