name: CDS Prebuilt (self-update express)

# CDS 自更新「极速版」—— push 修改 CDS 或镜像内技能时，在 GitHub Actions 上把 CDS 编译好
# （esbuild 后端 + vite 前端 + tsc 类型门），打成 ghcr OCI 产物镜像 cds-dist:sha-<40hex>，
# 供 CDS 自更新直接 docker pull + 解出，跳过本机编译（tsc 52s + vite 1.6min 卸到 CI）。
# 自更新逻辑找不到对应 SHA 的预构建产物时，回退到现有「本机现编」路径——故本 workflow
# 纯增量、不影响存量自更新。SSOT 约定：tag = sha-${github.sha}（完整 40 hex，不可变，
# 与项目极速版 branch-image.yml 同公式）。

on:
  push:
    branches: ["**"]
    paths:
      - "cds/**"
      - ".github/workflows/cds-prebuilt.yml"
      - ".claude/skills/cds/**"
      - ".claude/skills/cds-project-scan/**"
      - ".claude/skills/cds-deploy-pipeline/**"
      - ".claude/skills/cds-release/**"
      - ".claude/skills/preview-url/**"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/${{ github.event.repository.name }}/cds-dist

jobs:
  build-and-push:
    name: Build & Push CDS Prebuilt
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "9"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install CDS deps
        run: |
          pnpm -C cds install --frozen-lockfile
          pnpm -C cds/web install --frozen-lockfile

      # 类型门：把 self-update 现有的 tsc --noEmit 校验挪到 CI。两端都过才出产物，
      # 等于「预构建产物天生已通过类型检查」，本机自更新不必再花 52s 跑 tsc。
      - name: Type-check gate (cds + web)
        run: |
          pnpm -C cds exec tsc --noEmit
          pnpm -C cds/web exec tsc --noEmit

      - name: Build backend (esbuild → cds/dist)
        run: |
          cd cds
          OUT_DIR=dist node scripts/build-dist-esbuild.mjs

      - name: Build web (vite → cds/web/dist)
        run: pnpm -C cds/web build

      - name: Write prebuilt manifest
        run: |
          cat > cds/cds-prebuilt-manifest.json <<JSON
          {
            "sha": "${{ github.sha }}",
            "ref": "${{ github.ref_name }}",
            "builtAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "runId": "${{ github.run_id }}",
            "schema": 1
          }
          JSON

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # 不可变全 SHA tag（自更新按它精确认领），外加每分支移动 tag 便于排查。
          tags: |
            type=raw,value=sha-${{ github.sha }}
            type=ref,event=branch,prefix=branch-

      - name: Build & push CDS prebuilt image
        uses: docker/build-push-action@v5
        with:
          context: ./cds
          file: ./cds/Dockerfile.dist
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Stage canonical CDS onboarding skills
        run: |
          mkdir -p cds/agent-skills
          for skill in cds cds-project-scan cds-deploy-pipeline cds-release preview-url; do
            cp -R ".claude/skills/$skill" "cds/agent-skills/$skill"
          done

      # 验收前只加载到 runner，部署端不能拉到未通过冒烟的 SHA 产物。
      - name: Build & load CDS preview runtime
        uses: docker/build-push-action@v5
        with:
          context: ./cds
          file: ./cds/Dockerfile.preview
          push: false
          load: true
          tags: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}/cds-preview:sha-${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Smoke CDS preview runtime
        run: |
          docker run --pull=never --rm -i --entrypoint sh \
            ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}/cds-preview:sha-${{ github.sha }} -e <<'OPENSSL_SMOKE'
          set -eu
          openssl_smoke_dir="$(mktemp -d)"
          trap 'rm -rf "$openssl_smoke_dir"' EXIT
          openssl req -x509 -newkey rsa:2048 -nodes -days 2 \
            -subj '/CN=CDS runtime smoke' -addext 'subjectAltName=IP:127.0.0.1' \
            -keyout "$openssl_smoke_dir/key.pem" -out "$openssl_smoke_dir/cert.pem" >/dev/null 2>&1
          openssl x509 -in "$openssl_smoke_dir/cert.pem" -noout -checkend 86400
          OPENSSL_SMOKE
          docker run --pull=never -d --name cds-preview-smoke --memory 768m --cpus 1 \
            -p 127.0.0.1:19900:9900 \
            ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}/cds-preview:sha-${{ github.sha }}
          python3 cds/scripts/smoke-preview-runtime.py http://127.0.0.1:19900

      - name: Publish verified CDS preview runtime
        if: success()
        run: docker push ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}/cds-preview:sha-${{ github.sha }}

      - name: Preview smoke logs
        if: failure()
        run: docker logs cds-preview-smoke 2>&1 || true

      - name: Remove preview smoke container
        if: always()
        run: docker rm -f cds-preview-smoke 2>/dev/null || true
