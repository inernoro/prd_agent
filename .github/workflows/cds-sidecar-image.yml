name: CDS Sidecar Image

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to publish. Defaults to the short commit SHA."
        required: false
        default: ""
      docker_platforms:
        description: "Docker platforms. Use linux/amd64,linux/arm64 only when the remote host needs multi-arch."
        required: false
        default: "linux/amd64"

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/${{ github.event.repository.name }}/claude-sidecar
  DOCKER_PLATFORMS: ${{ inputs.docker_platforms || 'linux/amd64' }}

jobs:
  build-and-push:
    name: Build & Push CDS Agent Sidecar
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      image: ${{ steps.image.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Resolve image tag
        id: image
        env:
          IMAGE_TAG_INPUT: ${{ inputs.image_tag }}
        shell: bash
        run: |
          set -euo pipefail
          tag="$IMAGE_TAG_INPUT"
          if [[ -z "$tag" ]]; then
            tag="$(git rev-parse --short=12 HEAD)"
          fi
          if [[ ! "$tag" =~ ^[A-Za-z0-9_][A-Za-z0-9._-]{0,127}$ ]]; then
            echo "Invalid image tag: $tag" >&2
            exit 1
          fi
          image="${REGISTRY}/${IMAGE_NAME}:${tag}"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "CDS_AGENT_SIDECAR_IMAGE=$image" >> "$GITHUB_STEP_SUMMARY"

      - name: Validate publication inputs
        shell: bash
        env:
          RELEASE_TAG_INPUT: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          if [[ -n "$RELEASE_TAG_INPUT" && ! "$RELEASE_TAG_INPUT" =~ ^[A-Za-z0-9_][A-Za-z0-9._-]{0,127}$ ]]; then
            echo "Invalid release tag" >&2; exit 1
          fi
          case "$DOCKER_PLATFORMS" in
            linux/amd64|linux/arm64|linux/amd64,linux/arm64) ;;
            *) echo "Unsupported platforms" >&2; exit 1 ;;
          esac

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Setup QEMU
        if: ${{ contains(env.DOCKER_PLATFORMS, 'arm64') }}
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push sidecar image
        id: build
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: ./claude-sdk-sidecar
          file: ./claude-sdk-sidecar/Dockerfile
          push: true
          tags: ${{ steps.image.outputs.image }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: false
          sbom: false
          cache-from: type=gha,scope=cds-agent-sidecar
          cache-to: type=gha,mode=max,scope=cds-agent-sidecar
          platforms: ${{ env.DOCKER_PLATFORMS }}

      - name: Publish result
        shell: bash
        run: |
          {
            echo "## CDS Agent sidecar image"
            echo ""
            echo "- image: \`${{ steps.image.outputs.image }}\`"
            echo "- digest: \`${{ steps.build.outputs.digest }}\`"
            echo ""
            echo "Use this as \`CDS_AGENT_SIDECAR_IMAGE\` only after the target remote host can pull it."
          } >> "$GITHUB_STEP_SUMMARY"
