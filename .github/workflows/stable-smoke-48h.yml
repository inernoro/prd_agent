name: 稳定冒烟测试

on:
  schedule:
    - cron: '17 18 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: '忽略 48 小时节拍并立即执行'
        required: false
        default: true
        type: boolean
  pull_request:
    paths:
      - 'prd-api/src/**'
      - 'prd-admin/src/**'
      - 'prd-desktop/**'
      - 'prd-video/**'
      - 'llmgw/**'
      - 'cds/src/**'
      - '.github/workflows/**'
      - '.claude/skills/stable-smoke/**'
      - 'scripts/stable-smoke-*'
      - 'e2e/specs/stable-smoke.spec.ts'

permissions:
  contents: read

concurrency:
  group: stable-smoke-48h-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'scheduled' }}
  cancel-in-progress: false

jobs:
  cadence:
    name: 校验 48 小时节拍
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.cadence.outputs.should_run }}
      plan_mode: ${{ steps.cadence.outputs.plan_mode }}
    steps:
      - name: 计算执行日
        id: cadence
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "plan_mode=changed" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "plan_mode=scheduled" >> "$GITHUB_OUTPUT"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          epoch_day=$(( $(date -u +%s) / 86400 ))
          if (( epoch_day % 2 == 0 )); then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

  catalog-plan:
    name: 业务功能台账与自动纳入
    needs: cadence
    if: needs.cadence.outputs.should_run == 'true' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      verdict: ${{ steps.plan.outputs.verdict }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 校验台账并生成固定版本计划
        id: plan
        shell: bash
        run: |
          mkdir -p stable-smoke-plan
          if [[ "${{ needs.cadence.outputs.plan_mode }}" == "changed" ]]; then
            node scripts/stable-smoke-plan.mjs \
              --mode changed \
              --base "${{ github.event.pull_request.base.sha }}" \
              --head "${{ github.event.pull_request.head.sha }}" \
              --strict \
              --output-json stable-smoke-plan/plan.json \
              --output-md stable-smoke-plan/plan.md
          else
            node scripts/stable-smoke-plan.mjs \
              --mode scheduled \
              --output-json stable-smoke-plan/plan.json \
              --output-md stable-smoke-plan/plan.md
          fi
          verdict=$(node -e "const p=require('./stable-smoke-plan/plan.json'); process.stdout.write(p.verdict)")
          echo "verdict=$verdict" >> "$GITHUB_OUTPUT"
          cat stable-smoke-plan/plan.md >> "$GITHUB_STEP_SUMMARY"
      - name: 执行台账、变更映射与通知契约测试
        run: node --test scripts/tests/stable-smoke-plan.test.mjs scripts/tests/stable-smoke-notify.test.mjs
      - name: 上传固定版本测试计划
        uses: actions/upload-artifact@v4
        with:
          name: stable-smoke-plan-${{ github.run_id }}
          path: stable-smoke-plan
          retention-days: 90

  contract-tests:
    name: 协议与回归测试
    needs: [cadence, catalog-plan]
    if: needs.cadence.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: 执行登录、多图与模型协议回归
        run: >-
          dotnet test prd-api/tests/PrdAgent.Api.Tests/PrdAgent.Api.Tests.csproj
          --filter "FullyQualifiedName~SyntheticLoginControllerTests|FullyQualifiedName~JwtServiceTests|FullyQualifiedName~MultiImageDomainServiceTests|FullyQualifiedName~ImageRefAndMessagePersistenceTests|FullyQualifiedName~AdminNotificationSourceCatalogTests"
          --configuration Release
          --logger "console;verbosity=minimal"
      - name: 执行多图视觉创作回归
        run: >-
          dotnet test prd-api/tests/PrdAgent.Tests/PrdAgent.Tests.csproj
          --filter "FullyQualifiedName~GatewayAdapterProtocolAliasTests|FullyQualifiedName~ImageGenAdapterConfigTests|FullyQualifiedName~VisionResponseImageExtractionTests"
          --configuration Release
          --logger "console;verbosity=minimal"

  environment-smoke:
    name: 测试后正式环境入口冒烟
    needs: [cadence, catalog-plan, contract-tests]
    if: needs.cadence.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 下载固定版本测试计划
        uses: actions/download-artifact@v4
        with:
          name: stable-smoke-plan-${{ github.run_id }}
          path: stable-smoke-plan
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: e2e/pnpm-lock.yaml
      - name: 安装浏览器测试依赖
        id: install
        working-directory: e2e
        run: pnpm install --frozen-lockfile
      - name: 安装 Chromium
        working-directory: e2e
        run: pnpm exec playwright install --with-deps chromium
      - name: 检查测试环境密钥
        env:
          E2E_BASE_URL: ${{ vars.STABLE_SMOKE_TEST_BASE_URL }}
          STABLE_SMOKE_AI_ACCESS_KEY: ${{ secrets.STABLE_SMOKE_TEST_AI_ACCESS_KEY || secrets.AI_ACCESS_KEY }}
          STABLE_SMOKE_USER: ${{ vars.STABLE_SMOKE_TEST_USER || secrets.E2E_USER }}
        run: |
          test -n "$E2E_BASE_URL"
          test -n "$STABLE_SMOKE_AI_ACCESS_KEY"
          test -n "$STABLE_SMOKE_USER"
      - name: 执行测试环境合成登录与模块入口冒烟
        id: test_environment
        working-directory: e2e
        env:
          CI: 'true'
          E2E_BASE_URL: ${{ vars.STABLE_SMOKE_TEST_BASE_URL }}
          STABLE_SMOKE_AI_ACCESS_KEY: ${{ secrets.STABLE_SMOKE_TEST_AI_ACCESS_KEY || secrets.AI_ACCESS_KEY }}
          STABLE_SMOKE_USER: ${{ vars.STABLE_SMOKE_TEST_USER || secrets.E2E_USER }}
        run: pnpm exec playwright test specs/stable-smoke.spec.ts
      - name: 生成测试环境模块验收报告
        if: always()
        env:
          E2E_BASE_URL: ${{ vars.STABLE_SMOKE_TEST_BASE_URL }}
        run: |
          node scripts/render-stable-smoke-report.mjs \
            --input e2e/results.json \
            --plan stable-smoke-plan/plan.json \
            --output e2e/stable-smoke-report.md \
            --environment "测试" \
            --run-id "stsmk-${{ github.run_id }}-${{ github.run_attempt }}" \
            --base-url-configured "$([[ -n "$E2E_BASE_URL" ]] && echo true || echo false)"
          cat e2e/stable-smoke-report.md >> "$GITHUB_STEP_SUMMARY"
      - name: 固定测试环境证据文件
        if: always()
        shell: bash
        run: |
          if [[ -f e2e/results.json ]]; then mv e2e/results.json e2e/results-test.json; fi
          if [[ -d e2e/playwright-report ]]; then mv e2e/playwright-report e2e/playwright-report-test; fi
          if [[ -d e2e/test-results ]]; then mv e2e/test-results e2e/test-results-test; fi
      - name: 上传测试环境验收证据
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stable-smoke-测试-${{ github.run_id }}
          path: |
            e2e/playwright-report-test
            e2e/test-results-test
            e2e/results-test.json
            e2e/stable-smoke-report.md
          if-no-files-found: warn
          retention-days: 90
      - name: 检查正式环境密钥
        if: always() && steps.install.outcome == 'success'
        env:
          E2E_BASE_URL: ${{ vars.STABLE_SMOKE_PROD_BASE_URL || vars.PRD_AGENT_PROD_BASE }}
          STABLE_SMOKE_AI_ACCESS_KEY: ${{ secrets.STABLE_SMOKE_PROD_AI_ACCESS_KEY || secrets.AI_ACCESS_KEY }}
          STABLE_SMOKE_USER: ${{ vars.STABLE_SMOKE_PROD_USER || secrets.E2E_USER }}
        run: |
          test -n "$E2E_BASE_URL"
          test -n "$STABLE_SMOKE_AI_ACCESS_KEY"
          test -n "$STABLE_SMOKE_USER"
      - name: 执行正式环境只读入口冒烟
        if: always() && steps.install.outcome == 'success'
        working-directory: e2e
        env:
          CI: 'true'
          E2E_BASE_URL: ${{ vars.STABLE_SMOKE_PROD_BASE_URL || vars.PRD_AGENT_PROD_BASE }}
          STABLE_SMOKE_AI_ACCESS_KEY: ${{ secrets.STABLE_SMOKE_PROD_AI_ACCESS_KEY || secrets.AI_ACCESS_KEY }}
          STABLE_SMOKE_USER: ${{ vars.STABLE_SMOKE_PROD_USER || secrets.E2E_USER }}
        run: pnpm exec playwright test specs/stable-smoke.spec.ts
      - name: 生成正式环境模块验收报告
        if: always()
        env:
          E2E_BASE_URL: ${{ vars.STABLE_SMOKE_PROD_BASE_URL || vars.PRD_AGENT_PROD_BASE }}
        run: |
          node scripts/render-stable-smoke-report.mjs \
            --input e2e/results.json \
            --plan stable-smoke-plan/plan.json \
            --output e2e/stable-smoke-report.md \
            --environment "正式" \
            --run-id "stsmk-${{ github.run_id }}-${{ github.run_attempt }}" \
            --base-url-configured "$([[ -n "$E2E_BASE_URL" ]] && echo true || echo false)"
          cat e2e/stable-smoke-report.md >> "$GITHUB_STEP_SUMMARY"
      - name: 上传正式环境验收证据
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stable-smoke-正式-${{ github.run_id }}
          path: |
            e2e/playwright-report
            e2e/test-results
            e2e/results.json
            e2e/stable-smoke-report.md
          if-no-files-found: warn
          retention-days: 90

  summary:
    name: 汇总验收结论并通知 MAP
    needs: [cadence, catalog-plan, contract-tests, environment-smoke]
    if: always() && needs.cadence.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 生成整轮摘要
        id: summary
        shell: bash
        run: |
          mkdir -p stable-smoke-summary
          verdict=pass
          if [[ "${{ needs.contract-tests.result }}" != "success" || "${{ needs.environment-smoke.result }}" != "success" ]]; then
            verdict=fail
          elif [[ "${{ needs.catalog-plan.outputs.verdict }}" != "pass" ]]; then
            verdict=conditional
          fi
          echo "verdict=$verdict" >> "$GITHUB_OUTPUT"
          cat > stable-smoke-summary/report.md <<EOF
          # 稳定冒烟整轮摘要 · stsmk-${{ github.run_id }}-${{ github.run_attempt }}

          Verdict: $verdict

          | 阶段 | 结果 |
          |---|---|
          | 业务功能台账与固定版本计划 | ${{ needs.catalog-plan.result }} / ${{ needs.catalog-plan.outputs.verdict }} |
          | 登录与图像协议回归 | ${{ needs.contract-tests.result }} |
          | 测试及正式环境入口冒烟 | ${{ needs.environment-smoke.result }} |

          详细功能线、面包屑、模块结果、截图、trace、视频和恢复动作位于同一轮 artifact。任一功能线未形成真实旅程自动化或任一分环境未执行时，整轮不得解释为完整通过。
          EOF
          cat stable-smoke-summary/report.md >> "$GITHUB_STEP_SUMMARY"
      - name: 上传整轮摘要
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stable-smoke-summary-${{ github.run_id }}
          path: stable-smoke-summary/report.md
          retention-days: 90
      - name: 条件通过或失败时发送 MAP 站内通知
        if: steps.summary.outputs.verdict != 'pass'
        env:
          STABLE_SMOKE_NOTIFY_BASE_URL: ${{ vars.STABLE_SMOKE_NOTIFY_BASE_URL || 'https://map.ebcone.net' }}
          STABLE_SMOKE_NOTIFY_AI_ACCESS_KEY: ${{ secrets.STABLE_SMOKE_NOTIFY_AI_ACCESS_KEY || secrets.AI_ACCESS_KEY }}
          STABLE_SMOKE_NOTIFY_USER: ${{ vars.STABLE_SMOKE_NOTIFY_USER || secrets.E2E_USER }}
          STABLE_SMOKE_NOTIFY_TARGET_USER_ID: ${{ vars.STABLE_SMOKE_NOTIFY_TARGET_USER_ID }}
        run: >-
          node scripts/stable-smoke-notify.mjs
          --verdict "${{ steps.summary.outputs.verdict }}"
          --run-id "stsmk-${{ github.run_id }}-${{ github.run_attempt }}"
          --environment "测试及正式"
          --module "整轮"
          --source "${{ vars.STABLE_SMOKE_NOTIFY_SOURCE || 'system-alert' }}"
          --recovery "打开验收证据，按失败模块暂停写入；P0 或数据污染时通过 CDS 回滚 previous 版本并复测。"
          --report-url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
