name: Entry Motion Cloud Acceptance
on:
  workflow_dispatch:
    inputs:
      phase:
        type: choice
        options: [visual]
        default: visual
permissions:
  contents: read
jobs:
  ubuntu-dependency-source:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            suite: jammy
          - runner: ubuntu-24.04
            suite: noble
    timeout-minutes: 6
    env:
      UBUNTU_SUITE: ${{ matrix.suite }}
    steps:
      - name: Measure verified Ubuntu archive sources on the actual runner
        run: |
          python3 - <<'PY'
          import concurrent.futures as cf
          import os
          from pathlib import Path
          import subprocess
          import tempfile

          suite = os.environ['UBUNTU_SUITE']
          mirrors = {
              'canonical': 'https://archive.ubuntu.com/ubuntu',
              'kernel': 'https://mirrors.kernel.org/ubuntu',
              'princeton': 'https://mirror.math.princeton.edu/pub/ubuntu',
              'mit': 'https://mirrors.mit.edu/ubuntu',
              'berkeley': 'https://mirrors.ocf.berkeley.edu/ubuntu',
              'waterloo': 'https://mirror.csclub.uwaterloo.ca/ubuntu',
              'hetzner': 'https://mirror.hetzner.com/ubuntu/packages',
              'leaseweb': 'https://mirror.us.leaseweb.net/ubuntu',
              'umich': 'https://mirrors.lug.mtu.edu/ubuntu',
          }
          suites = [suite, suite + '-security', suite + '-updates']

          def check(item):
              label, base = item
              with tempfile.TemporaryDirectory() as d:
                  for name in suites:
                      target = Path(d) / name
                      url = f'{base}/dists/{name}/InRelease'
                      download = subprocess.run(['curl', '-fsSL', '--connect-timeout', '4', '--max-time', '9', url, '-o', str(target)], capture_output=True)
                      if download.returncode:
                          return label, name, download.stderr.decode().strip()
                      verify = subprocess.run(['gpgv', '--keyring', '/usr/share/keyrings/ubuntu-archive-keyring.gpg', str(target)], capture_output=True)
                      if verify.returncode:
                          return label, name, f'archive signature rejected ({verify.returncode})'
                      release = target.read_text()
                      if f'Suite: {name}\n' not in release:
                          return label, name, 'suite mismatch'
                  return label, suite, 'verified HTTPS and Ubuntu signatures'
          with cf.ThreadPoolExecutor(max_workers=len(mirrors)) as pool:
              for result in pool.map(check, mirrors.items()):
                  print(*result, sep=' | ')
          PY
