name: Entry Motion Cloud Acceptance
on:
  workflow_dispatch:
    inputs:
      phase:
        type: choice
        options: [visual]
        default: visual
permissions:
  contents: read
jobs:
  preview-playback:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 12
      - uses: pnpm/action-setup@v4
        with:
          version: '10.28.2'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify the same Gateway product code and build
        run: |
          git diff --exit-code ccf3c05eba9e41abf112481bd8d590718462171f HEAD -- llmgw/web e2e/fixtures
          pnpm -C llmgw/web install --frozen-lockfile
          pnpm -C llmgw/web build
          pnpm -C e2e install --frozen-lockfile
          pnpm -C e2e exec playwright install chromium
          mkdir -p "$HOME/.local/share/fonts"
          curl --fail --silent --show-error --retry 2 --max-time 90 --location 'https://raw.githubusercontent.com/notofonts/noto-cjk/main/Sans/OTF/SimplifiedChinese/NotoSansCJKsc-Regular.otf' --output "$HOME/.local/share/fonts/NotoSansCJKsc-Regular.otf"
          fc-cache -f "$HOME/.local/share/fonts"
          fc-match -f '%{family}\n' :lang=zh-cn | grep '^Noto Sans CJK SC'
          python3 -m pip install --disable-pip-version-check --target "$RUNNER_TEMP/entry-media" pillow==11.3.0 imageio-ffmpeg==0.6.0
      - name: Run the real UI with isolated login on desktop and mobile
        run: |
          pnpm -C llmgw/web preview --host 127.0.0.1 --strictPort --port 8200 &
          for attempt in $(seq 1 30); do
            if curl -fsS -o /dev/null http://127.0.0.1:8200/llmgw/; then break; fi
            sleep 1
          done
          node e2e/entry-recut-fastcheck.mjs
          PYTHONPATH="$RUNNER_TEMP/entry-media" python3 e2e/entry-recut-fastcheck-media.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gateway-daylight-recut-fastcheck
          path: work/entry-recut-headless/
          if-no-files-found: error
          retention-days: 14
