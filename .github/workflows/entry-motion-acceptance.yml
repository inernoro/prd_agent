name: Entry Motion Cloud Acceptance
on:
  workflow_dispatch:
    inputs:
      phase:
        type: choice
        options: [visual]
        default: visual
permissions:
  contents: read
jobs:
  intent-options:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 6
      - uses: pnpm/action-setup@v4
        with:
          version: '10.28.2'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build the previous and updated Gateway
        run: |
          git diff --exit-code HEAD^ HEAD -- llmgw/web e2e/fixtures
          git worktree add --detach "$RUNNER_TEMP/before" b3fd673ba8ed0b661bbc00f7cdf9fd3ccf9636df
          pnpm -C llmgw/web install --frozen-lockfile
          pnpm -C llmgw/web build
          pnpm -C "$RUNNER_TEMP/before/llmgw/web" install --frozen-lockfile
          pnpm -C "$RUNNER_TEMP/before/llmgw/web" build
          pnpm -C e2e install --frozen-lockfile
          pnpm -C e2e exec playwright install chromium
          mkdir -p "$HOME/.local/share/fonts"
          curl --fail --silent --show-error --retry 2 --max-time 40 --location 'https://raw.githubusercontent.com/notofonts/noto-cjk/main/Sans/OTF/SimplifiedChinese/NotoSansCJKsc-Regular.otf' --output "$HOME/.local/share/fonts/NotoSansCJKsc-Regular.otf"
          fc-cache -f "$HOME/.local/share/fonts"
      - name: Inspect both themes and open manual setup
        run: |
          pnpm -C llmgw/web preview --host 127.0.0.1 --strictPort --port 8200 &
          pnpm -C "$RUNNER_TEMP/before/llmgw/web" preview --host 127.0.0.1 --strictPort --port 8210 &
          for port in 8200 8210; do
            for attempt in $(seq 1 30); do
              if curl -fsS -o /dev/null "http://127.0.0.1:$port/llmgw/"; then break; fi
              sleep 1
            done
          done
          node e2e/check-intent-options.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gateway-intent-options
          path: work/gateway-intent-options/
          if-no-files-found: error
          retention-days: 14
