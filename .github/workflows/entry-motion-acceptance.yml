name: Entry Motion Cloud Acceptance
on:
  workflow_dispatch:
    inputs:
      phase:
        type: choice
        options: [visual]
        default: visual
permissions:
  contents: read
env:
  VITE_ENTRY_MEDIA_CDN_ORIGIN: ${{ vars.VITE_ENTRY_MEDIA_CDN_ORIGIN }}
jobs:
  full-browser-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 7c82dd337e57c9f40814dfd2eaac1326e083242b
      - uses: pnpm/action-setup@v4
        with:
          version: '10.28.2'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare bundles with frozen dependencies
        run: |
          pnpm -C cds/web install --frozen-lockfile
          pnpm -C llmgw/web install --frozen-lockfile
          pnpm -C e2e install --frozen-lockfile
          pnpm -C cds/web typecheck
          pnpm -C cds/web build
          pnpm -C llmgw/web build
          pnpm -C e2e typecheck
      - name: Recheck affected paths with a working system sound device
        env:
          SELECTED_ENTRY_BROWSER: ${{ matrix.browser }}
        run: |
          pnpm -C e2e exec playwright install --with-deps "$SELECTED_ENTRY_BROWSER"
          sudo apt-get update
          sudo apt-get install -y pulseaudio pulseaudio-utils
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/entry-audio-runtime"
          install -d -m 700 "$XDG_RUNTIME_DIR"
          mkdir -p work/compat/audio-system
          pulseaudio --start --exit-idle-time=-1 --log-level=info --log-target="file:$GITHUB_WORKSPACE/work/compat/audio-system/pulseaudio.log"
          export PULSE_SERVER="unix:$XDG_RUNTIME_DIR/pulse/native"
          pactl load-module module-null-sink sink_name=gateway_acceptance rate=48000 channels=2
          pactl set-default-sink gateway_acceptance
          pactl set-sink-mute gateway_acceptance 0
          pactl set-sink-volume gateway_acceptance 100%
          pactl info > work/compat/audio-system/server.txt
          pnpm -C e2e exec playwright test -c admin-operations.config.ts --project "$SELECTED_ENTRY_BROWSER" --grep '原生音频|电影式接入全流程|慢加载日景' --workers=1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: entry-browser-device-${{ matrix.browser }}
          path: work/compat/
          retention-days: 14
