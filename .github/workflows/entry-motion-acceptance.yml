name: Entry Motion Cloud Acceptance
on:
  workflow_dispatch:
    inputs:
      phase:
        type: choice
        options: [visual]
        default: visual
permissions:
  contents: read
env:
  VITE_ENTRY_MEDIA_CDN_ORIGIN: ${{ vars.VITE_ENTRY_MEDIA_CDN_ORIGIN }}
jobs:
  entry-browser-regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-noble@sha256:b0ab6f3cb99aa7803adbc14d9027ec1785fc6e433b97e134e0f8fe61683b6b53
      options: --init --shm-size=1g
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '10.28.2'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build the unchanged product bundle and type-check the browser tests
        run: |
          pnpm -C llmgw/web install --frozen-lockfile
          pnpm -C llmgw/web build
          pnpm -C e2e install --frozen-lockfile
          pnpm -C e2e typecheck
      - name: Check navigation timing and the original mobile paths in three browsers
        run: |
          mkdir -p work/entry-browser
          test "$(id -u)" -eq 0
          test "$HOME" = /github/home
          chown 0:0 /github/home
          pnpm -C e2e exec playwright test -c entry-browser-proof.config.ts --project firefox
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gateway-entry-browser-proof
          path: work/entry-browser/
          if-no-files-found: error
          retention-days: 14
