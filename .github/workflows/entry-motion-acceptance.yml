name: Entry Motion Cloud Acceptance
on:
  workflow_dispatch:
    inputs:
      phase:
        type: choice
        options: [visual]
        default: visual
permissions:
  contents: read
jobs:
  login-baseline:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-noble@sha256:b0ab6f3cb99aa7803adbc14d9027ec1785fc6e433b97e134e0f8fe61683b6b53
      options: --init --shm-size=1g
    timeout-minutes: 8
    env:
      VITE_ENTRY_MEDIA_CDN_ORIGIN: ${{ vars.VITE_ENTRY_MEDIA_CDN_ORIGIN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: e9d4faf27d1b43c5aa362911b89f0dba0afa7b6f
      - uses: pnpm/action-setup@v4
        with:
          version: '10.28.2'
      - name: Capture live login layouts and measure the existing successful handoff
        run: |
          pnpm -C llmgw/web install --frozen-lockfile
          pnpm -C e2e install --frozen-lockfile
          pnpm -C llmgw/web build
          pnpm -C llmgw/web preview --host 127.0.0.1 --strictPort --port 8200 &
          for attempt in $(seq 1 25); do
            if curl -fsS -o /dev/null http://127.0.0.1:8200/llmgw/login; then break; fi
            sleep 1
          done
          mkdir -p evidence
          cd e2e
          node --input-type=module <<'JS'
          import { chromium } from '@playwright/test';
          import { installOperationsFixtures } from './fixtures/admin-operations.mjs';
          const browser = await chromium.launch();
          for (const [app,url] of [['gateway','https://map.ebcone.net/llmgw/login'],['map','https://map.ebcone.net/login']]) {
            for (const [width,height] of [[1440,900],[390,744]]) {
              const page = await browser.newPage({ viewport:{width,height},colorScheme:'dark' });
              try {
                const response=await page.goto(url,{waitUntil:'domcontentloaded',timeout:20000});
                await page.waitForTimeout(1100);
                await page.screenshot({path:`../evidence/${app}-${width}.png`});
                console.log(app,width,response?.status(),await page.title());
              } finally { await page.close(); }
            }
          }
          const page = await browser.newPage({viewport:{width:1440,height:900},colorScheme:'light'});
          try {
            await installOperationsFixtures(page,{quickstart:true});
            await page.goto('http://127.0.0.1:8200/llmgw/login');
            await page.locator('#llmgw-username').fill('demo');
            await page.locator('#llmgw-password').fill('demo');
            const start=Date.now();
            await page.getByRole('button',{name:'开始身份确认'}).click();
            await page.waitForURL(/quickstart$/);
            const routeMs=Date.now()-start;
            await page.getByLabel('打开用户菜单',{exact:true}).waitFor({timeout:16000});
            console.log('baseline routing ms',routeMs,'account menu visible ms',Date.now()-start);
          } finally { await browser.close(); }
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fast-login-baseline
          path: evidence
