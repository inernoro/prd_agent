name: Entry Motion Cloud Acceptance
on:
  workflow_dispatch:
    inputs:
      phase:
        type: choice
        options: [visual]
        default: visual
permissions:
  contents: read
env:
  VITE_ENTRY_MEDIA_CDN_ORIGIN: ${{ vars.VITE_ENTRY_MEDIA_CDN_ORIGIN }}
jobs:
  entry-regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: '10.28.2'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and exercise the real media cancellation
        run: |
          pnpm -C llmgw/web install --frozen-lockfile
          pnpm -C llmgw/web build
          pnpm -C e2e install --frozen-lockfile
          pnpm -C e2e exec playwright install chromium
          mkdir -p work/entry-review
          export PLAYWRIGHT_JSON_OUTPUT_FILE="$GITHUB_WORKSPACE/work/entry-review/media-abort.json"
          ENTRY_APP="$GITHUB_WORKSPACE/llmgw/web" pnpm -C e2e exec playwright test -c entry-regression.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gateway-entry-review
          path: work/entry-review/
          retention-days: 14
