name: Entry Motion Cloud Acceptance
on:
  workflow_dispatch:
    inputs:
      phase:
        type: choice
        options: [visual]
        default: visual
permissions:
  contents: read
jobs:
  entry-regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 12
      - uses: pnpm/action-setup@v4
        with:
          version: '10.28.2'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build the candidate and the currently deployed Gateway
        run: |
          git diff --exit-code HEAD^ HEAD -- llmgw/web e2e/specs
          git worktree add --detach "$RUNNER_TEMP/entry-before" 1218cd3707e4fa7b5591e78653e32f77bd79b5fb
          pnpm -C llmgw/web install --frozen-lockfile
          pnpm -C llmgw/web build
          pnpm -C "$RUNNER_TEMP/entry-before/llmgw/web" install --frozen-lockfile
          pnpm -C "$RUNNER_TEMP/entry-before/llmgw/web" build
          pnpm -C e2e install --frozen-lockfile
          pnpm -C e2e typecheck
          pnpm -C e2e exec playwright install chromium
      - name: Confirm the two regressions fail before and pass after
        run: |
          mkdir -p work/entry-review
          export PLAYWRIGHT_JSON_OUTPUT_FILE="$GITHUB_WORKSPACE/work/entry-review/before.json"
          if ENTRY_APP="$RUNNER_TEMP/entry-before/llmgw/web" pnpm -C e2e exec playwright test -c entry-regression.config.ts; then
            exit 1
          fi
          export PLAYWRIGHT_JSON_OUTPUT_FILE="$GITHUB_WORKSPACE/work/entry-review/after.json"
          ENTRY_APP="$GITHUB_WORKSPACE/llmgw/web" pnpm -C e2e exec playwright test -c entry-regression.config.ts
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path('work/entry-review')
          before = (root / 'before.json').read_text()
          assert json.loads(before)['stats']['unexpected'] == 2
          assert 'toHaveCSS' in before and '64px' in before and 'data-entry-arriving' in before
          assert json.loads((root / 'after.json').read_text())['stats']['expected'] == 2
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gateway-entry-review
          path: work/entry-review/
          retention-days: 14
