name: Entry Motion Cloud Acceptance
on:
  workflow_dispatch:
    inputs:
      phase:
        type: choice
        options: [visual, public, map, trim]
        default: visual
      candidate:
        required: true
        type: string
permissions:
  contents: read
jobs:
  fast-login-browser:
    if: inputs.phase == 'visual'
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-noble@sha256:b0ab6f3cb99aa7803adbc14d9027ec1785fc6e433b97e134e0f8fe61683b6b53
      options: --init --shm-size=1g
    timeout-minutes: 8
    env:
      VITE_ENTRY_MEDIA_CDN_ORIGIN: ${{ vars.VITE_ENTRY_MEDIA_CDN_ORIGIN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate }}
      - uses: pnpm/action-setup@v4
        with:
          version: '10.28.2'
      - name: Exercise login retry, immediate navigation, and usable controls while artwork is held
        run: |
          chown "$(id -u):$(id -g)" /github/home
          pnpm -C llmgw/web install --frozen-lockfile
          pnpm -C e2e install --frozen-lockfile
          pnpm -C llmgw/web build
          pnpm -C llmgw/web preview --host 127.0.0.1 --strictPort --port 8200 &
          for attempt in $(seq 1 25); do
            if curl -fsS -o /dev/null http://127.0.0.1:8200/llmgw/login; then break; fi
            sleep 1
          done
          mkdir -p evidence
          cd e2e
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { chromium, firefox, webkit, expect } from '@playwright/test';
          import { readFile, writeFile } from 'node:fs/promises';
          import { installOperationsFixtures } from './fixtures/admin-operations.mjs';
          const assets = JSON.parse(await readFile('fixtures/media/gateway-portrait-cdn.json','utf8'));
          const results=[];
          for (const [engine,browserType] of Object.entries({chromium,firefox,webkit})) {
            const browser = await browserType.launch();
            try {
              for (const [theme, width, height] of [['light',1440,900],['dark',390,744]]) {
                const page = await browser.newPage({viewport:{width,height}, colorScheme:theme});
                const errors=[];
                page.on('pageerror', error => errors.push(error.message));
                let releaseArtwork;
                let releaseLogin;
                let loginCount=0;
                const artwork = new Promise(resolve => { releaseArtwork=resolve; });
                const secondLogin = new Promise(resolve => { releaseLogin=resolve; });
                const photo = assets[theme].open.url;
                try {
                  await installOperationsFixtures(page,{quickstart:true});
                  await page.route(photo,async route=>{await artwork; await route.continue().catch(()=>{});});
                  await page.route(/\/gw\/auth\/login$/, async route=>{
                    if (++loginCount===1) {
                      await route.fulfill({json:{success:false,error:{message:'账号或密码不正确，请重试'}}});
                    } else {
                      await secondLogin;
                      await route.fallback();
                    }
                  });
                  await page.goto('http://127.0.0.1:8200/llmgw/login',{waitUntil:'domcontentloaded'});
                  await expect(page.getByRole('heading',{name:'登录模型网关',exact:true})).toBeVisible();
                  await expect(page.locator('.identity-scanner,video')).toHaveCount(0);
                  assert.ok(await page.evaluate(()=>document.documentElement.scrollWidth <= innerWidth),'login overflows horizontally');
                  await expect.poll(()=>page.locator('.gateway-login-backdrop img').evaluate(img=>img.naturalWidth)).toBeGreaterThan(0);
                  if(engine==='chromium') await page.screenshot({path:`../evidence/login-${theme}-${width}.png`});
                  await page.locator('#llmgw-username').fill('demo');
                  const password=page.locator('#llmgw-password');
                  await password.fill('demo');
                  await password.press('Enter');
                  await expect(page.getByRole('alert')).toContainText('账号或密码不正确');
                  await expect(password).toHaveValue('demo');
                  await expect(page.getByRole('button',{name:'开始身份确认',exact:true})).toBeEnabled();
                  await password.press('Enter');
                  await expect(page.getByRole('button',{name:'正在验证账号…',exact:true})).toBeDisabled();
                  await expect(password).toBeFocused();
                  await expect(page.getByRole('heading',{name:'登录模型网关',exact:true})).toBeVisible();
                  const start=Date.now();
                  const route=page.waitForURL(/quickstart$/);
                  releaseLogin();
                  await route;
                  const consoleButton=page.getByLabel('打开用户菜单',{exact:true});
                  const composer=page.getByRole('textbox',{name:'我想做什么',exact:true});
                  await Promise.all([composer.waitFor({timeout:1600}),consoleButton.waitFor({timeout:1600})]);
                  const readyMs=Date.now()-start;
                  await composer.fill('接入知识库');
                  await consoleButton.click();
                  await expect(page.locator('details.lg-user-menu')).toHaveAttribute('open','');
                  await expect(page.locator('html')).not.toHaveAttribute('data-entry-arriving','');
                  await expect(page.locator('video')).toHaveCount(0);
                  await expect(page.locator('.gateway-quickstart-stage .consciousness-art')).toHaveJSProperty('complete',false);
                  await consoleButton.click();
                  releaseArtwork();
                  await expect.poll(()=>page.locator('.gateway-quickstart-stage .consciousness-art').evaluate(img=>img.naturalWidth)).toBeGreaterThan(0);
                  await expect(composer).toHaveValue('接入知识库');
                  assert.deepEqual(errors,[]);
                  if(engine==='chromium') await page.screenshot({path:`../evidence/dialogue-${theme}-${width}.png`});
                  results.push({engine,theme,width,height,readyMs,failedLoginRecovered:true,typedWhileArtworkPending:true,menuOpened:true,errors});
                  console.log(JSON.stringify(results.at(-1)));
                } finally { releaseArtwork(); releaseLogin(); await page.close(); }
              }
            } finally { await browser.close(); }
          }
          await writeFile('../evidence/result.json',JSON.stringify(results,null,2));
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fast-login-browser-proof
          path: evidence
  fast-map-login:
    if: inputs.phase == 'map'
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-noble@sha256:b0ab6f3cb99aa7803adbc14d9027ec1785fc6e433b97e134e0f8fe61683b6b53
      options: --init --shm-size=1g
    timeout-minutes: 12
    env:
      VITE_ENTRY_MEDIA_CDN_ORIGIN: ${{ vars.VITE_ENTRY_MEDIA_CDN_ORIGIN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate }}
      - uses: pnpm/action-setup@v4
        with:
          version: '10.28.2'
      - name: Verify authored MAP login with both skins and test permission handoff
        run: |
          pnpm -C e2e install --frozen-lockfile
          mkdir -p evidence
          cd e2e
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { chromium, expect } from '@playwright/test';
          import { writeFile } from 'node:fs/promises';
          const browser = await chromium.launch();
          const rows = [];
          try {
            for (const [skin, width, height] of [['standard',390,744],['companion',390,744],['companion',1440,900]]) {
              const page = await browser.newPage({viewport:{width,height},colorScheme:'dark'});
              page.on('pageerror', error => console.log('MAP browser exception:', error.stack));
              try {
                await page.addInitScript(value => {
                  localStorage.setItem('map-entry-skin',JSON.stringify({state:{skin:value},version:0}));
                },skin);
                let releasePermission;
                const permission = new Promise(resolve => {releasePermission=resolve;});
                let permissionRequested=false;
                await page.route('**/api/**',async route=>{
                  const path = new URL(route.request().url()).pathname;
                  const fulfill = data => route.fulfill({json:{success:true,data,error:null}});
                  if(path.endsWith('/auth/miduo-planet/options')) return fulfill({items:[],passwordLoginDisabled:false});
                  if(path.endsWith('/auth/login')){
                    return fulfill({accessToken:'isolated-map-token',refreshToken:'isolated-map-refresh',sessionKey:'isolated-map-session',user:{userId:'isolated-user',username:'demo',displayName:'验收用户',role:'ADMIN',status:'Active'}});
                  }
                  if(path.endsWith('/authz/me')){
                    permissionRequested=true;
                    await permission;
                    return fulfill({userId:'isolated-user',displayName:'验收用户',role:'ADMIN',effectivePermissions:['access','admin.access']});
                  }
                  if(path.endsWith('/authz/menu-catalog')) return fulfill({items:[]});
                  return route.fulfill({status:503,json:{success:false,data:null,error:{code:'FIXTURE_OFFLINE',message:'fixture endpoint omitted'}}});
                });
                try {
                  await page.goto('https://fast-login-entry-codex-prd-agent.miduo.org/login',{waitUntil:'domcontentloaded'});
                  const pass=page.locator('input[autocomplete="current-password"]');
                  await expect(pass).toBeVisible();
                  await expect(page.locator('.identity-scanner, .consciousness-scene video')).toHaveCount(0);
                  await expect(page.locator('.consciousness-scene')).toHaveCount(skin==='companion'?1:0);
                  assert.ok(await page.evaluate(()=>document.documentElement.scrollWidth<=innerWidth));
                  await page.screenshot({path:`../evidence/map-login-${skin}-${width}.png`});
                  await pass.fill('fixture-only');
                  await page.getByRole('button',{name:'开始身份确认',exact:true}).click();
                  await expect.poll(()=>permissionRequested).toBe(true);
                  await expect(pass).toBeVisible();
                  await expect(page.getByRole('status').filter({hasText:/正在/})).toBeVisible();
                  const start=Date.now();
                  releasePermission();
                  await page.waitForURL(url=>url.pathname==='/',{timeout:2500});
                  if(skin==='companion'){
                    const landing=page.locator('section.consciousness-home');
                    await expect(landing).toBeVisible();
                    await expect(landing.getByRole('searchbox')).toBeEditable();
                    await landing.getByRole('searchbox').fill('知识库');
                    await expect(landing.locator('video')).toHaveCount(0);
                    await expect(page.locator('html')).not.toHaveAttribute('data-entry-arriving','');
                    await page.screenshot({path:`../evidence/map-workspace-${skin}-${width}.png`});
                  }
                  rows.push({skin,width,height,loginStableDuringPermission:true,routeMs:Date.now()-start});
                } catch (error) {
                  await page.screenshot({path:`../evidence/map-failure-${skin}-${width}.png`});
                  throw error;
                } finally { releasePermission(); }
              } finally { await page.close(); }
            }
          } finally { await browser.close(); }
          console.log(JSON.stringify(rows));
          await writeFile('../evidence/map-result.json',JSON.stringify(rows,null,2));
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fast-map-browser-proof
          path: evidence
  public-login:
    if: inputs.phase == 'public'
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-noble@sha256:b0ab6f3cb99aa7803adbc14d9027ec1785fc6e433b97e134e0f8fe61683b6b53
      options: --init --shm-size=1g
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate }}
      - uses: pnpm/action-setup@v4
        with:
          version: '10.28.2'
      - name: Verify both public preview login entry points
        run: |
          pnpm -C e2e install --frozen-lockfile
          mkdir -p evidence
          cd e2e
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { chromium, expect } from '@playwright/test';
          import { writeFile } from 'node:fs/promises';
          const links = {
            map: 'https://fast-login-entry-codex-prd-agent.miduo.org/login',
            gateway: 'https://fast-login-entry-codex-prd-agent-llmgw.miduo.org/login',
          };
          const browser = await chromium.launch();
          const checks=[];
          try {
            for (const [surface,url] of Object.entries(links)) {
              for (const [theme,width,height] of [['light',1440,900],['dark',390,744]]) {
                const page=await browser.newPage({viewport:{width,height},colorScheme:theme});
                try {
                  const errors=[];
                  page.on('pageerror', e=>errors.push(e.message));
                  const response=await page.goto(url,{waitUntil:'domcontentloaded'});
                  assert.equal(response.status(),200);
                  await expect(page.getByRole('heading',{name:surface==='map'?'登录 MAP':'登录模型网关',exact:true})).toBeVisible({timeout:15000});
                  const pass=page.locator('input[autocomplete="current-password"]');
                  await expect(pass).toBeEditable();
                  await expect(page.locator('.identity-scanner,.consciousness-scene video')).toHaveCount(0);
                  if(surface==='gateway') await expect.poll(()=>page.locator('.gateway-login-backdrop img').evaluate(el=>el.naturalWidth),{timeout:12000}).toBeGreaterThan(0);
                  assert.equal(await page.evaluate(()=>document.documentElement.scrollWidth>innerWidth),false);
                  assert.deepEqual(errors,[]);
                  await page.screenshot({path:`../evidence/public-${surface}-${width}.png`});
                  checks.push({surface,theme,width,height,status:response.status(),errors});
                } finally { await page.close(); }
              }
            }
          } finally { await browser.close(); }
          console.log(JSON.stringify(checks));
          await writeFile('../evidence/public-result.json',JSON.stringify(checks,null,2));
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: published-fast-login
          path: evidence
  short-entry-media:
    if: inputs.phase == 'trim'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate }}
      - name: Render short day and night entries from the approved CDN masters
        run: |
          command -v ffmpeg
          mkdir -p work/short-entry
          python3 - <<'PY'
          import hashlib, json, subprocess
          from pathlib import Path
          media = json.loads(Path('e2e/fixtures/media/gateway-portrait-cdn.json').read_text())
          work = Path('work/short-entry')
          report = {}
          for theme, split in [('dark', 3.3), ('light', 5.1)]:
              source = Path(f'/tmp/{theme}-long.mp4')
              entry = media[theme]['motion']
              subprocess.run(['curl', '-fsS', '--retry', '2', entry['url'], '-o', str(source)], check=True)
              assert hashlib.sha256(source.read_bytes()).hexdigest() == entry['sha256']
              actual = subprocess.check_output(['ffprobe', '-v','error','-select_streams','v:0','-show_entries','stream=duration','-of','csv=p=0',str(source)], text=True).strip()
              length = float(actual)
              timing = f"setpts='if(lt(T,{split}),T*{0.82/split},0.82+(T-{split})*{0.78/(length-split)})/TB'"
              output = work / f'{theme}-arrival-v1.mp4'
              subprocess.run(['ffmpeg','-hide_banner','-loglevel','error','-y','-i',str(source),
                  '-an','-vf',f'{timing},fps=60,scale=1280:-2:flags=lanczos','-c:v','libx264','-preset','medium',
                  '-crf','24','-pix_fmt','yuv420p','-movflags','+faststart',str(output)], check=True)
              duration = float(subprocess.check_output(['ffprobe','-v','error','-show_entries','format=duration','-of','csv=p=0',str(output)], text=True))
              assert 1.5 <= duration <= 1.7
              report[theme] = dict(duration=duration, source=length, bytes=output.stat().st_size, sha256=hashlib.sha256(output.read_bytes()).hexdigest())
              subprocess.run(['ffmpeg','-hide_banner','-loglevel','error','-y','-i',str(output),'-vf','fps=4,scale=320:-2,tile=4x2','-frames:v','1',str(work / f'{theme}-quarter-seconds.jpg')],check=True)
          print(json.dumps(report,indent=2))
          (work / 'manifest.json').write_text(json.dumps(report,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: short-entry-media
          path: work/short-entry
          if-no-files-found: error
