name: Entry Motion Cloud Acceptance
on:
  workflow_dispatch:
    inputs:
      phase:
        type: choice
        options: [visual]
        default: visual
      release_environment:
        type: choice
        options: [test, production]
        required: true
      release_commit:
        type: string
        required: true
permissions:
  contents: read
jobs:
  released-entry-surfaces:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      RELEASE_ENVIRONMENT: ${{ inputs.release_environment }}
      RELEASE_COMMIT: ${{ inputs.release_commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_commit }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate public HTML, static assets, health and media
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
          mkdir -p work/entry-release-readback
          case "$RELEASE_ENVIRONMENT" in
            test)
              export MAP_ENTRY=https://main-prd-agent.miduo.org
              export GATEWAY_ENTRY=https://main-prd-agent-llmgw.miduo.org
              python3 scripts/prd-agent-public-surface-smoke.py --base "$MAP_ENTRY" \
                --llmgw-page-path "$GATEWAY_ENTRY/" --llmgw-console-health-path "$GATEWAY_ENTRY/gw/healthz" \
                --llmgw-serving-health-path "$GATEWAY_ENTRY/gw/v1/healthz" \
                --json-out work/entry-release-readback/map.json
              ;;
            production)
              export MAP_ENTRY=https://map.ebcone.net
              export GATEWAY_ENTRY=https://map.ebcone.net/llmgw
              python3 scripts/prd-agent-public-surface-smoke.py --base "$MAP_ENTRY" \
                --expect-commit "$RELEASE_COMMIT" --json-out work/entry-release-readback/map.json
              ;;
            *) exit 2 ;;
          esac
          python3 scripts/prd-agent-public-surface-smoke.py --base "$GATEWAY_ENTRY" --surface gateway \
            --expect-commit "$RELEASE_COMMIT" --json-out work/entry-release-readback/gateway.json
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          import { readFile, writeFile } from 'node:fs/promises';
          import { waitForEntryPreviews } from './e2e/entry-preview-readiness.mjs';
          const { MAP_ENTRY, GATEWAY_ENTRY, RELEASE_COMMIT, RELEASE_ENVIRONMENT } = process.env;
          const gatewayAssets = JSON.parse(await readFile('e2e/fixtures/media/gateway-portrait-cdn.json'));
          const assets = Object.values(gatewayAssets).flatMap(theme => Object.values(theme));
          const headers = { 'User-Agent': 'Mozilla/5.0', 'Cache-Control': 'no-cache' };
          const get = url => fetch(url, { headers, signal: AbortSignal.timeout(30_000) });
          const meta = await get(MAP_ENTRY + '/api/version');
          assert.ok(meta.ok);
          const version = await meta.json();
          assert.equal(version.commit ?? version.data?.commit, RELEASE_COMMIT);
          const conversation = await get(GATEWAY_ENTRY + '/quickstart');
          assert.ok(conversation.ok);
          assert.match(await conversation.text(), /LLM Gateway/);
          const media = await Promise.all(assets.map(async asset => {
            const response = await get(asset.url);
            assert.ok(response.ok);
            assert.equal(response.url, asset.url);
            const sha256 = createHash('sha256').update(new Uint8Array(await response.arrayBuffer())).digest('hex');
            assert.equal(sha256, asset.sha256);
            return { url: asset.url, sha256 };
          }));
          const previews = RELEASE_ENVIRONMENT === 'test' ? await waitForEntryPreviews({
            map: MAP_ENTRY, gateway: GATEWAY_ENTRY, gatewayAssets, expectedCommit: RELEASE_COMMIT,
            timeoutMs: 90_000, retryMs: 5000
          }) : null;
          await writeFile('work/entry-release-readback/entry.json', JSON.stringify({
            environment: RELEASE_ENVIRONMENT, commit: RELEASE_COMMIT, quickstart: conversation.url, media, previews
          }, null, 2));
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: entry-release-readback-${{ inputs.release_environment }}
          path: work/entry-release-readback/
          if-no-files-found: error
