name: Entry Motion Cloud Acceptance
on:
  workflow_dispatch:
    inputs:
      phase:
        type: choice
        options: [visual]
        default: visual
permissions:
  contents: read
jobs:
  handoff:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 12
      - uses: pnpm/action-setup@v4
        with:
          version: '10.28.2'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build both deployed and candidate sources
        run: |
          git diff --exit-code HEAD^ HEAD -- llmgw/web e2e/fixtures
          git worktree add --detach "$RUNNER_TEMP/before" ccf3c05eba9e41abf112481bd8d590718462171f
          pnpm -C llmgw/web install --frozen-lockfile
          pnpm -C llmgw/web build
          pnpm -C "$RUNNER_TEMP/before/llmgw/web" install --frozen-lockfile
          pnpm -C "$RUNNER_TEMP/before/llmgw/web" build
          pnpm -C e2e install --frozen-lockfile
          pnpm -C e2e typecheck
          pnpm -C e2e exec playwright install chromium
          mkdir -p "$HOME/.local/share/fonts"
          curl --fail --silent --show-error --retry 2 --max-time 90 --location 'https://raw.githubusercontent.com/notofonts/noto-cjk/main/Sans/OTF/SimplifiedChinese/NotoSansCJKsc-Regular.otf' --output "$HOME/.local/share/fonts/NotoSansCJKsc-Regular.otf"
          fc-cache -f "$HOME/.local/share/fonts"
          python3 -m pip install --disable-pip-version-check --target "$RUNNER_TEMP/entry-media" pillow==11.3.0 imageio-ffmpeg==0.6.0
      - name: Record both login handoffs and verify the pixels before the first stroke
        env:
          MEDIA_PYTHON_PATH: ${{ runner.temp }}/entry-media
        run: |
          pnpm -C llmgw/web preview --host 127.0.0.1 --strictPort --port 8200 &
          pnpm -C "$RUNNER_TEMP/before/llmgw/web" preview --host 127.0.0.1 --strictPort --port 8210 &
          for port in 8200 8210; do
            for attempt in $(seq 1 30); do
              if curl -fsS -o /dev/null "http://127.0.0.1:$port/llmgw/"; then break; fi
              sleep 1
            done
          done
          node e2e/entry-handoff-check.mjs
          PYTHONPATH="$MEDIA_PYTHON_PATH" python3 e2e/entry-handoff-evidence.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gateway-daylight-handoff
          path: work/entry-handoff/
          if-no-files-found: error
          retention-days: 14
