name: Entry Motion Cloud Acceptance
on:
  workflow_dispatch:
    inputs:
      phase:
        type: choice
        options: [visual]
        default: visual
permissions:
  contents: read
env:
  VITE_ENTRY_MEDIA_CDN_ORIGIN: ${{ vars.VITE_ENTRY_MEDIA_CDN_ORIGIN }}
jobs:
  full-browser-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-noble@sha256:b0ab6f3cb99aa7803adbc14d9027ec1785fc6e433b97e134e0f8fe61683b6b53
      options: --init --shm-size=1g
    strategy:
      fail-fast: false
      matrix:
        browser: [webkit]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 098a3dea0a2c5a31b78eddb1b9c0c006e1307d03
      - uses: pnpm/action-setup@v4
        with:
          version: '10.28.2'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare bundles with frozen dependencies
        run: |
          pnpm -C cds/web install --frozen-lockfile
          pnpm -C llmgw/web install --frozen-lockfile
          pnpm -C e2e install --frozen-lockfile
          pnpm -C cds/web typecheck
          pnpm -C cds/web build
          pnpm -C llmgw/web build
          pnpm -C e2e typecheck
      - name: Verify organization before and after reload in WebKit
        env:
          SELECTED_ENTRY_BROWSER: ${{ matrix.browser }}
        run: |
          test "$(id -u)" -eq 0
          test "$HOME" = /github/home
          chown 0:0 /github/home
          pnpm -C e2e exec playwright test -c admin-operations.config.ts --project "$SELECTED_ENTRY_BROWSER" --grep '电影式接入全流程' --repeat-each=2 --workers=1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: entry-organization-recheck-${{ matrix.browser }}
          path: work/compat/
          retention-days: 14
