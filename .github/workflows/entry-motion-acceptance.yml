name: Entry Motion Cloud Acceptance
on:
  workflow_dispatch:
    inputs:
      phase:
        type: choice
        options: [visual]
        default: visual
permissions:
  contents: read
jobs:
  public-media-readback:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 15bd9950f5516f3b174f1096c085d96546ac560c
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify public preview revision, HTML, bundles, and media hashes
        run: |
          node --input-type=module <<'JS'
          import { readFile, writeFile } from 'node:fs/promises';
          import { waitForEntryPreviews } from './e2e/entry-preview-readiness.mjs';
          const json = async path => JSON.parse(await readFile(path, 'utf8'));
          const target = await json('e2e/fixtures/entry-preview.json');
          const gatewayAssets = await json('e2e/fixtures/media/gateway-portrait-cdn.json');
          const ready = await waitForEntryPreviews({
            map: target.mapUrl, gateway: target.gatewayUrl, gatewayAssets,
            expectedCommit: '15bd9950f5516f3b174f1096c085d96546ac560c',
            timeoutMs: 400_000, retryMs: 5_000,
          });
          await writeFile('preview-readiness.json', JSON.stringify(ready, null, 2));
          for (const app of ready.apps) console.log(app.app, app.commit, app.media.length, app.bundle);
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: entry-public-media-readback
          path: preview-readiness.json
          if-no-files-found: error
