name: Preview Acceptance

on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'prd-api/**'
      - 'prd-admin/**'
      - 'e2e/performance/**'
      - '.github/workflows/preview-acceptance.yml'
  workflow_dispatch:
    inputs:
      smoke_host:
        description: '冒烟测试目标 URL；留空则跳过 smoke'
        required: false
        default: ''
      smoke_skip:
        description: '跳过的冒烟项, 逗号分隔, 例如 report,defect'
        required: false
        default: ''
      e2e_base_url:
        description: 'Playwright E2E 目标 URL；留空则跳过 e2e'
        required: false
        default: ''
      perf_ref:
        description: '隔离性能回归的候选提交或 ref；留空跳过，不接受 URL'
        required: false
        default: ''
      perf_base_ref:
        description: '同机三次校准的基准提交'
        required: false
        default: 'origin/main'
      perf_profile:
        description: 'normal 为回归门禁；all 另含并发增长和持续运行'
        type: choice
        options: [normal, all]
        default: normal

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '9'

jobs:
  performance-isolated:
    name: MAP Performance (Isolated)
    if: github.event_name == 'pull_request' || github.event.inputs.perf_ref != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    env:
      PERF_REF: ${{ github.event.inputs.perf_ref || github.event.pull_request.head.sha }}
      PERF_BASE_REF: ${{ github.event.inputs.perf_base_ref || github.event.pull_request.base.sha || 'origin/main' }}
      PERF_PROFILE: ${{ github.event.inputs.perf_profile || 'normal' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.428'
      - name: Install existing E2E dependencies and browser
        run: |
          pnpm -C e2e install --frozen-lockfile
          pnpm -C e2e exec playwright install --with-deps chromium
      - name: Verify regression judge and server timing probe
        run: |
          node --test e2e/performance/*.test.mjs
          dotnet run --project e2e/performance/probe-tests -c Release
      - name: Calibrate on three clean environments
        run: |
          for attempt in 1 2 3; do
            node e2e/performance/run.mjs --ref "$PERF_BASE_REF" --profile normal --out "work/performance/base-$attempt"
          done
          node e2e/performance/calibrate.mjs work/performance/base-{1,2,3}/result.json --out work/performance/baseline.json
      - name: Compare candidate commit
        run: node e2e/performance/run.mjs --ref "$PERF_REF" --profile "$PERF_PROFILE" --baseline work/performance/baseline.json --out work/performance/candidate
      - name: Verify actual core write workload and raw accounting
        run: node e2e/performance/prove-write.mjs work/performance/candidate
      - name: Prove injected application regression is rejected
        run: |
          set +e
          node e2e/performance/run.mjs --ref "$PERF_BASE_REF" --profile normal --inject-ms 350 --baseline work/performance/baseline.json --out work/performance/injected
          status=$?
          set -e
          test "$status" -eq 1
          node e2e/performance/prove.mjs work/performance/injected/result.json
      - name: Prove user-visible homepage regression is rejected with healthy API
        run: |
          set +e
          node e2e/performance/run.mjs --ref "$PERF_BASE_REF" --profile normal --inject-browser-ms 10000 --baseline work/performance/baseline.json --out work/performance/injected-browser
          status=$?
          set -e
          test "$status" -eq 1
          node e2e/performance/prove-browser.mjs work/performance/injected-browser/result.json
      - name: Verify recovery without injected delay in a clean environment
        run: node e2e/performance/run.mjs --ref "$PERF_BASE_REF" --profile normal --baseline work/performance/baseline.json --out work/performance/recovered
      - name: Upload performance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: map-performance-${{ github.run_id }}
          retention-days: 14
          path: |
            work/performance/baseline.json
            work/performance/*/result.json
            work/performance/*/requests.ndjson
            work/performance/*/fixture.json
            work/performance/*/browser-*.png
            work/performance/*/*-build.log

  smoke-preview:
    name: Smoke (Preview Branch)
    if: github.event.inputs.smoke_host != ''
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install jq
        run: |
          if ! command -v jq >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y jq
          fi

      - name: Run smoke-all.sh against preview
        env:
          SMOKE_TEST_HOST: ${{ github.event.inputs.smoke_host }}
          AI_ACCESS_KEY: ${{ secrets.AI_ACCESS_KEY }}
          SMOKE_USER: ${{ vars.SMOKE_USER || 'admin' }}
          SMOKE_SKIP: ${{ github.event.inputs.smoke_skip }}
          SMOKE_FAIL_FAST: '1'
        run: |
          if [[ -z "$AI_ACCESS_KEY" ]]; then
            echo "::error::缺少 repo secret AI_ACCESS_KEY, 无法跑冒烟"
            echo "请在 Settings -> Secrets and variables -> Actions 添加 AI_ACCESS_KEY"
            exit 2
          fi
          bash scripts/smoke-all.sh

  e2e-preview:
    name: Playwright E2E (Preview)
    if: github.event.inputs.e2e_base_url != ''
    # e2e 锁定的 Playwright 1.59 不支持 Ubuntu 26.04，固定受支持的 LTS。
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: e2e

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install deps
        run: pnpm install

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('e2e/package.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browsers (Chromium)
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright tests
        env:
          E2E_BASE_URL: ${{ github.event.inputs.e2e_base_url }}
          E2E_USER: ${{ secrets.E2E_USER }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
        run: pnpm test

      - name: Upload HTML report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 14

      - name: Upload JSON results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-json
          path: e2e/results.json
          retention-days: 14
