name: LLM Gateway Production Preflight

# GitHub only exposes workflow_dispatch entries from the default branch.
# Merge this workflow to the default branch before treating it as a clickable production gate.
#
# 业务只读预检：发布前确认 MAP 与网关可达、凭据可用、commit 符合预期、MAP 没有绕过网关的直连调用。
# 不部署；默认不改业务数据。只有显式 speech_check=run 会创建短语音任务和自有预设。
# speech_check_mcp_contract 默认关闭，显式开启只创建并撤销临时凭据、调用只读MCP工具。
# speech_prepare_access 默认关闭，显式开启时只为 stsmk_prod 自身补齐三项语音权限。
# RSA 认证会创建短会话并对齐专用巡检身份权限。
# 正式发布仍是 fast.sh --commit X && exec_dep.sh --commit X。

on:
  workflow_dispatch:
    inputs:
      map_base:
        description: "MAP/API base URL. Defaults to vars.PRD_AGENT_PROD_BASE."
        required: false
        default: ""
      gw_base:
        description: "Gateway serving base URL, for example https://host/gw/v1. Defaults to vars.LLMGW_PROD_GATE_BASE."
        required: false
        default: ""
      expect_commit:
        description: "Production commit to verify. Defaults to vars.LLMGW_PROD_EXPECT_COMMIT; empty skips the commit comparison."
        required: false
        default: ""
      speech_check:
        description: "Optional production speech check. readiness is read-only; run explicitly creates one short task and a temporary scoped key."
        type: choice
        required: false
        default: "off"
        options:
          - "off"
          - "readiness"
          - "run"
      speech_check_mcp_contract:
        description: "Explicit temporary one-day speech key plus read-only MCP discovery/capabilities/history checks; always revoked. Never generates or saves presets."
        type: boolean
        required: false
        default: false
      speech_prepare_access:
        description: "Explicitly allow preparing only stsmk_prod's own three speech permissions; never removes denies or changes roles. Requires readiness or run."
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: llmgw-prod-preflight
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      INPUT_MAP_BASE: ${{ github.event.inputs.map_base || '' }}
      DEFAULT_MAP_BASE: ${{ vars.PRD_AGENT_PROD_BASE || '' }}
      INPUT_GW_BASE: ${{ github.event.inputs.gw_base || '' }}
      DEFAULT_GW_BASE: ${{ vars.LLMGW_PROD_GATE_BASE || '' }}
      INPUT_EXPECT_COMMIT: ${{ github.event.inputs.expect_commit || '' }}
      EXPECT_COMMIT: ${{ github.event.inputs.expect_commit || vars.LLMGW_PROD_EXPECT_COMMIT || '' }}
      PRD_AGENT_API_KEY: ${{ secrets.PRD_AGENT_PROD_API_KEY }}
      STABLE_SMOKE_SIGNING_KEY_ID: ${{ vars.STABLE_SMOKE_PROD_SIGNING_KEY_ID }}
      STABLE_SMOKE_SIGNING_PRIVATE_KEY: ${{ secrets.STABLE_SMOKE_PROD_SIGNING_PRIVATE_KEY }}
      STABLE_SMOKE_USER: ${{ vars.STABLE_SMOKE_PROD_USER }}
      LLMGW_GATE_KEY: ${{ secrets.LLMGW_PROD_GATE_KEY }}
      SPEECH_CHECK: ${{ github.event.inputs.speech_check || 'off' }}
      SPEECH_CHECK_MCP_CONTRACT: ${{ github.event.inputs.speech_check_mcp_contract || 'false' }}
      SPEECH_PREPARE_ACCESS: ${{ github.event.inputs.speech_prepare_access || 'false' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python for speech checks
        if: ${{ github.event.inputs.speech_check != '' && github.event.inputs.speech_check != 'off' }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify speech smoke safety contracts
        if: ${{ github.event.inputs.speech_check != '' && github.event.inputs.speech_check != 'off' }}
        run: python3 scripts/tests/mcp-speech-production-smoke.test.py

      - name: Install browser for speech checks
        timeout-minutes: 3
        if: ${{ github.event.inputs.speech_check != '' && github.event.inputs.speech_check != 'off' }}
        run: |
          python3 -m pip install --disable-pip-version-check --timeout 30 --retries 2 playwright==1.56.0
          python3 - <<'PY'
          import importlib.util
          import hashlib
          import subprocess
          import sys
          import urllib.request
          from pathlib import Path
          spec = importlib.util.spec_from_file_location("speech_browser_setup", "scripts/mcp-speech-production-smoke.py")
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          if module.system_browser_executable():
              print("Using the runner's preinstalled Chromium-compatible browser.")
          else:
              subprocess.run([sys.executable, "-m", "playwright", "install", "chromium", "--only-shell"], check=True, timeout=120)
          # Pin a CJK font because the hosted Chrome image has no Chinese glyphs.
          font_url = "https://raw.githubusercontent.com/notofonts/noto-cjk/f8d157532fbfaeda587e826d4cd5b21a49186f7c/Sans/OTF/SimplifiedChinese/NotoSansCJKsc-Regular.otf"
          with urllib.request.urlopen(font_url, timeout=45) as response:
              font_bytes = response.read(20 * 1024 * 1024 + 1)
          if hashlib.sha256(font_bytes).hexdigest() != "2c76254f6fc379fddfce0a7e84fb5385bb135d3e399294f6eeb6680d0365b74b":
              raise SystemExit("Pinned CJK font integrity check failed.")
          font_directory = Path.home() / ".local/share/fonts"
          font_directory.mkdir(parents=True, exist_ok=True)
          (font_directory / "NotoSansCJKsc-Regular.otf").write_bytes(font_bytes)
          subprocess.run(["fc-cache", "-f", str(font_directory)], check=True, timeout=30)
          print("Pinned CJK font installed for readable Chinese evidence.")
          PY

      - name: Run production preflight
        shell: bash
        run: |
          set -euo pipefail

          map_base="$(printf '%s' "${INPUT_MAP_BASE:-$DEFAULT_MAP_BASE}" | xargs)"
          gw_base="$(printf '%s' "${INPUT_GW_BASE:-$DEFAULT_GW_BASE}" | xargs)"
          expect_commit="$(printf '%s' "${INPUT_EXPECT_COMMIT:-$EXPECT_COMMIT}" | xargs)"

          if { [ "$SPEECH_PREPARE_ACCESS" = true ] || [ "$SPEECH_CHECK_MCP_CONTRACT" = true ]; } && [ "$SPEECH_CHECK" = off ]; then
            echo "ERROR: Speech access preparation and MCP contract checks require explicit readiness or run mode." >&2
            exit 1
          fi

          # Validate the trusted production origin before either check signs a request.
          if [ "$SPEECH_CHECK" != off ]; then
            python3 scripts/mcp-speech-production-smoke.py \
              --map-base "$map_base" --expect-commit "$expect_commit" \
              --validate-only \
              --json-out artifacts/llmgw-prod-preflight/speech-target-validation.json
          fi

          if [ -z "$map_base" ]; then
            echo "ERROR: missing MAP base URL. Set vars.PRD_AGENT_PROD_BASE or workflow_dispatch input map_base." >&2
            exit 1
          fi
          if [ -z "$gw_base" ]; then
            echo "ERROR: missing gateway base URL. Set vars.LLMGW_PROD_GATE_BASE or workflow_dispatch input gw_base." >&2
            exit 1
          fi
          has_signed_identity=false
          if [ -n "$(printf '%s' "${STABLE_SMOKE_SIGNING_KEY_ID:-}" | xargs)" ] \
            && [ -n "$(printf '%s' "${STABLE_SMOKE_SIGNING_PRIVATE_KEY:-}" | xargs)" ] \
            && [ -n "$(printf '%s' "${STABLE_SMOKE_USER:-}" | xargs)" ]; then
            has_signed_identity=true
          fi
          if [ "$has_signed_identity" != true ] \
            && [ -z "$(printf '%s' "${PRD_AGENT_API_KEY:-}" | xargs)" ]; then
            echo "ERROR: missing MAP automation identity. Configure Stable Smoke RSA credentials or the legacy API key." >&2
            exit 1
          fi
          if [ -z "$(printf '%s' "${LLMGW_GATE_KEY:-}" | xargs)" ]; then
            echo "ERROR: missing gateway key. Set secrets.LLMGW_PROD_GATE_KEY." >&2
            exit 1
          fi

          mkdir -p artifacts/llmgw-prod-preflight
          python3 scripts/llmgw-prod-preflight.py \
            --map-base "$map_base" \
            --gw-base "$gw_base" \
            --expect-commit "$expect_commit" \
            --json-out artifacts/llmgw-prod-preflight/prod-preflight.json

      - name: Check production speech
        if: ${{ !cancelled() && github.event.inputs.speech_check != '' && github.event.inputs.speech_check != 'off' && (github.event.inputs.speech_check == 'readiness' || success()) }}
        shell: bash
        run: |
          set -euo pipefail
          map_base="${INPUT_MAP_BASE:-$DEFAULT_MAP_BASE}"
          expect_commit="${INPUT_EXPECT_COMMIT:-$EXPECT_COMMIT}"
          speech_args=(--mode "$SPEECH_CHECK")
          if [ "$SPEECH_CHECK_MCP_CONTRACT" = true ]; then
            speech_args+=(--check-mcp-contract)
          fi
          if [ "$SPEECH_PREPARE_ACCESS" = true ]; then
            speech_args+=(--prepare-access)
          fi
          if [ "$SPEECH_CHECK" = run ]; then
            speech_args+=(--allow-production-run)
          elif [ "$SPEECH_CHECK" = readiness ]; then
            speech_args+=(--check-unconfigured-ui)
          fi
          python3 scripts/mcp-speech-production-smoke.py \
            --map-base "$map_base" \
            --expect-commit "$expect_commit" \
            --gateway-inventory \
            --json-out artifacts/llmgw-prod-preflight/speech-production-smoke.json \
            "${speech_args[@]}"

      - name: Upload production preflight report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: llmgw-prod-preflight-${{ github.run_id }}
          path: artifacts/llmgw-prod-preflight/
          if-no-files-found: ignore
