name: Web Latest (Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional fixed release tag; the commit bundle is always retained."
        required: false
        default: ""
      publish_latest:
        description: "Refresh mutable latest too. Main pushes always refresh latest."
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reuse an already published commit bundle
        id: restore
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/lib/release-artifacts.py restore --repo "$GITHUB_REPOSITORY" --ref "sha-$GITHUB_SHA" --commit "$GITHUB_SHA" --directory bundle --github-output "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@v4
        if: steps.restore.outputs.exists != 'true'
        with:
          version: "9"
      - uses: actions/setup-node@v4
        if: steps.restore.outputs.exists != 'true'
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: prd-admin/pnpm-lock.yaml
      - name: Build only an unpublished commit
        if: steps.restore.outputs.exists != 'true'
        working-directory: prd-admin
        env:
          VITE_API_BASE_URL: ""
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: Package fixed commit
        if: steps.restore.outputs.exists != 'true'
        run: python3 scripts/lib/release-artifacts.py bundle --repo "$GITHUB_REPOSITORY" --ref "sha-$GITHUB_SHA" --commit "$GITHUB_SHA" --dist prd-admin/dist --directory bundle
      - uses: actions/upload-artifact@v4
        with:
          name: web-bundle
          path: bundle/
          retention-days: 7

  retain:
    needs: build
    runs-on: ubuntu-latest
    # Only the storage writer has release-write access. No PAT or account grant.
    permissions:
      contents: write
    concurrency:
      group: web-bundle-${{ github.sha }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: web-bundle
          path: bundle
      - name: Publish once; validate and reuse on retry
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          python3 scripts/lib/release-artifacts.py publish --repo "$GITHUB_REPOSITORY" --ref "sha-$GITHUB_SHA" --directory bundle
          if [ -n "$RELEASE_TAG" ]; then
            python3 scripts/lib/release-artifacts.py fetch --repo "$GITHUB_REPOSITORY" --ref "sha-$GITHUB_SHA" --directory canonical
            python3 scripts/lib/release-artifacts.py alias --source-ref "sha-$GITHUB_SHA" --ref "$RELEASE_TAG" --directory canonical
            python3 scripts/lib/release-artifacts.py publish --repo "$GITHUB_REPOSITORY" --ref "$RELEASE_TAG" --directory canonical
          fi

  pages:
    needs: retain
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Pages from the retained bundle
        env:
          PUBLISH_LATEST: ${{ github.event_name == 'push' || inputs.publish_latest == true }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          python3 scripts/lib/release-artifacts.py fetch --repo "$GITHUB_REPOSITORY" --ref "sha-$GITHUB_SHA" --directory bundle
          python3 scripts/lib/release-artifacts.py pages --repo "$GITHUB_REPOSITORY" --ref "sha-$GITHUB_SHA" --directory bundle --dist site
          if [ -n "$RELEASE_TAG" ]; then
            python3 scripts/lib/release-artifacts.py fetch --repo "$GITHUB_REPOSITORY" --ref "$RELEASE_TAG" --commit "$GITHUB_SHA" --directory site
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
