name: Web Latest (Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional fixed release tag; the commit bundle is always retained."
        required: false
        default: ""
      publish_latest:
        description: "Refresh mutable latest too. Main pushes always refresh latest."
        type: boolean
        required: false
        default: false
      retain_from_run:
        description: "Optional one-time original Pages workflow artifact import (run ID). No rebuild."
        required: false
      retain_commit:
        description: "Full original commit; must match the successful source workflow."
        required: false
      retain_original_sha256:
        description: "Previously audited deployed ZIP SHA256, required for import."
        required: false
      retain_draft_id:
        description: "Optional exact unpublished draft ID to recover from the original artifact."
        required: false

permissions:
  contents: read

env:
  # Public asset-ID API reads the same retained bytes without browser/proxy
  # download redirects. No token is attached to these reads.
  PRD_AGENT_RELEASE_DOWNLOAD_TRANSPORT: github-api

jobs:
  retain-existing:
    if: inputs.retain_from_run != '' || inputs.retain_commit != '' || inputs.retain_original_sha256 != '' || inputs.retain_draft_id != ''
    runs-on: ubuntu-latest
    env:
      PRD_AGENT_ARTIFACT_AUDIT_PATH: /tmp/map-release-artifact-audit-${{ github.run_id }}-${{ github.run_attempt }}-retain-existing.jsonl
      PRD_AGENT_ARTIFACT_AUDIT_REQUEST_ID: ${{ github.run_id }}-${{ github.run_attempt }}-retain-existing
    permissions:
      contents: write
      actions: read
    concurrency:
      group: web-bundle-${{ inputs.retain_commit }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Verify the original successful workflow identity
        env:
          GH_TOKEN: ${{ github.token }}
          ORIGINAL_RUN: ${{ inputs.retain_from_run }}
          ORIGINAL_COMMIT: ${{ inputs.retain_commit }}
          ORIGINAL_SHA256: ${{ inputs.retain_original_sha256 }}
        run: |
          printf '%s' "$ORIGINAL_RUN" | grep -Eq '^[0-9]+$'
          printf '%s' "$ORIGINAL_COMMIT" | grep -Eq '^[0-9a-f]{40}$'
          printf '%s' "$ORIGINAL_SHA256" | grep -Eq '^[0-9a-f]{64}$'
          python3 - <<'PY'
          import importlib.util, json, os
          spec = importlib.util.spec_from_file_location('release_artifacts', 'scripts/lib/release-artifacts.py')
          artifacts = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(artifacts)
          artifacts._AUDIT_CONTEXT.update(repo=os.environ['GITHUB_REPOSITORY'],
              ref='sha-' + os.environ['ORIGINAL_COMMIT'], sourceCommit=os.environ['ORIGINAL_COMMIT'])
          states = {'sourceRunId': int(os.environ['ORIGINAL_RUN']),
              'sourceCommit': os.environ['ORIGINAL_COMMIT'], 'responseParsed': False}
          try:
              run = json.loads(artifacts.gh('api', f"repos/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['ORIGINAL_RUN']}"))
              states['responseParsed'] = True
              assert isinstance(run, dict)
              repository = run.get('repository')
              states.update(commitMatches=run.get('head_sha') == os.environ['ORIGINAL_COMMIT'],
                  runSucceeded=run.get('conclusion') == 'success' and run.get('status') == 'completed',
                  repositoryMatches=isinstance(repository, dict) and repository.get('full_name') == os.environ['GITHUB_REPOSITORY'],
                  workflowMatches=run.get('path') == '.github/workflows/web-latest-pages.yml')
              assert run['head_sha'] == os.environ['ORIGINAL_COMMIT']
              assert run['conclusion'] == 'success' and run['status'] == 'completed'
              assert run['repository']['full_name'] == os.environ['GITHUB_REPOSITORY']
              assert run['path'] == '.github/workflows/web-latest-pages.yml'
          except (artifacts.ArtifactError, AssertionError, KeyError, TypeError, ValueError):
              artifacts.audit_validation('original_workflow_identity', 'rejected', states)
              raise SystemExit('Original workflow identity rejected; see response audit') from None
          artifacts.audit_validation('original_workflow_identity', 'valid', states)
          PY
      - uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: original
          run-id: ${{ inputs.retain_from_run }}
          github-token: ${{ github.token }}
      - name: Retain the original bytes without rebuilding
        env:
          GH_TOKEN: ${{ github.token }}
          ORIGINAL_COMMIT: ${{ inputs.retain_commit }}
          ORIGINAL_SHA256: ${{ inputs.retain_original_sha256 }}
          DRAFT_ID: ${{ inputs.retain_draft_id }}
        run: |
          python3 scripts/lib/release-artifacts.py import-pages --archive original/artifact.tar --ref "sha-$ORIGINAL_COMMIT" --commit "$ORIGINAL_COMMIT" --original-sha256 "$ORIGINAL_SHA256" --directory inherited
          if [ -n "$DRAFT_ID" ]; then
            printf '%s' "$DRAFT_ID" | grep -Eq '^[0-9]+$'
            python3 scripts/lib/release-artifacts.py publish --repo "$GITHUB_REPOSITORY" --ref "sha-$ORIGINAL_COMMIT" --directory inherited --resume-draft-id "$DRAFT_ID" --original-sha256 "$ORIGINAL_SHA256"
          else
            python3 scripts/lib/release-artifacts.py publish --repo "$GITHUB_REPOSITORY" --ref "sha-$ORIGINAL_COMMIT" --directory inherited
          fi
      - name: Preserve safe third-party response audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-artifact-audit-${{ github.run_id }}-${{ github.run_attempt }}-retain-existing
          path: ${{ env.PRD_AGENT_ARTIFACT_AUDIT_PATH }}
          if-no-files-found: warn
          retention-days: 7

  build:
    needs: retain-existing
    if: always() && !cancelled() && (needs.retain-existing.result == 'success' || needs.retain-existing.result == 'skipped')
    runs-on: ubuntu-latest
    env:
      PRD_AGENT_ARTIFACT_AUDIT_PATH: /tmp/map-release-artifact-audit-${{ github.run_id }}-${{ github.run_attempt }}-build.jsonl
      PRD_AGENT_ARTIFACT_AUDIT_REQUEST_ID: ${{ github.run_id }}-${{ github.run_attempt }}-build
    steps:
      - uses: actions/checkout@v4
      - name: Reuse an already published commit bundle
        id: restore
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/lib/release-artifacts.py restore --repo "$GITHUB_REPOSITORY" --ref "sha-$GITHUB_SHA" --commit "$GITHUB_SHA" --directory bundle --github-output "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@v4
        if: steps.restore.outputs.exists != 'true'
        with:
          version: "9"
      - uses: actions/setup-node@v4
        if: steps.restore.outputs.exists != 'true'
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: prd-admin/pnpm-lock.yaml
      - name: Build only an unpublished commit
        if: steps.restore.outputs.exists != 'true'
        working-directory: prd-admin
        env:
          VITE_API_BASE_URL: ""
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: Package fixed commit
        if: steps.restore.outputs.exists != 'true'
        run: python3 scripts/lib/release-artifacts.py bundle --repo "$GITHUB_REPOSITORY" --ref "sha-$GITHUB_SHA" --commit "$GITHUB_SHA" --dist prd-admin/dist --directory bundle
      - uses: actions/upload-artifact@v4
        with:
          name: web-bundle
          path: bundle/
          retention-days: 7
      - name: Preserve safe third-party response audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-artifact-audit-${{ github.run_id }}-${{ github.run_attempt }}-build
          path: ${{ env.PRD_AGENT_ARTIFACT_AUDIT_PATH }}
          if-no-files-found: warn
          retention-days: 7

  retain:
    needs: build
    if: always() && !cancelled() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    env:
      PRD_AGENT_ARTIFACT_AUDIT_PATH: /tmp/map-release-artifact-audit-${{ github.run_id }}-${{ github.run_attempt }}-retain.jsonl
      PRD_AGENT_ARTIFACT_AUDIT_REQUEST_ID: ${{ github.run_id }}-${{ github.run_attempt }}-retain
    # Only the storage writer has release-write access. No PAT or account grant.
    permissions:
      contents: write
    concurrency:
      group: web-bundle-${{ github.sha }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: web-bundle
          path: bundle
      - name: Publish once; validate and reuse on retry
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          python3 scripts/lib/release-artifacts.py publish --repo "$GITHUB_REPOSITORY" --ref "sha-$GITHUB_SHA" --directory bundle
          if [ -n "$RELEASE_TAG" ]; then
            python3 scripts/lib/release-artifacts.py fetch --repo "$GITHUB_REPOSITORY" --ref "sha-$GITHUB_SHA" --directory canonical
            python3 scripts/lib/release-artifacts.py alias --source-ref "sha-$GITHUB_SHA" --ref "$RELEASE_TAG" --directory canonical
            python3 scripts/lib/release-artifacts.py publish --repo "$GITHUB_REPOSITORY" --ref "$RELEASE_TAG" --directory canonical
          fi
      - name: Preserve safe third-party response audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-artifact-audit-${{ github.run_id }}-${{ github.run_attempt }}-retain
          path: ${{ env.PRD_AGENT_ARTIFACT_AUDIT_PATH }}
          if-no-files-found: warn
          retention-days: 7

  pages:
    needs: retain
    # The protected environment permits main only. Feature runs publish the
    # retained bundle without requesting a Pages deployment.
    if: always() && !cancelled() && needs.retain.result == 'success' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      PRD_AGENT_ARTIFACT_AUDIT_PATH: /tmp/map-release-artifact-audit-${{ github.run_id }}-${{ github.run_attempt }}-pages.jsonl
      PRD_AGENT_ARTIFACT_AUDIT_REQUEST_ID: ${{ github.run_id }}-${{ github.run_attempt }}-pages
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Pages from the retained bundle
        env:
          PUBLISH_LATEST: ${{ github.event_name == 'push' || inputs.publish_latest == true }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          python3 scripts/lib/release-artifacts.py fetch --repo "$GITHUB_REPOSITORY" --ref "sha-$GITHUB_SHA" --directory bundle
          python3 scripts/lib/release-artifacts.py pages --repo "$GITHUB_REPOSITORY" --ref "sha-$GITHUB_SHA" --directory bundle --dist site
          if [ -n "$RELEASE_TAG" ]; then
            python3 scripts/lib/release-artifacts.py fetch --repo "$GITHUB_REPOSITORY" --ref "$RELEASE_TAG" --commit "$GITHUB_SHA" --directory site
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Preserve safe third-party response audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-artifact-audit-${{ github.run_id }}-${{ github.run_attempt }}-pages
          path: ${{ env.PRD_AGENT_ARTIFACT_AUDIT_PATH }}
          if-no-files-found: warn
          retention-days: 7
