name: Web Latest (Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional fixed release tag; the commit bundle is always retained."
        required: false
        default: ""
      publish_latest:
        description: "Refresh mutable latest too. Main pushes always refresh latest."
        type: boolean
        required: false
        default: false
      retain_from_run:
        description: "Optional one-time original Pages workflow artifact import (run ID). No rebuild."
        required: false
      retain_commit:
        description: "Full original commit; must match the successful source workflow."
        required: false
      retain_original_sha256:
        description: "Previously audited deployed ZIP SHA256, required for import."
        required: false
      retain_draft_id:
        description: "Optional exact unpublished draft ID to recover from the original artifact."
        required: false

permissions:
  contents: read

env:
  # Public asset-ID API reads the same retained bytes without browser/proxy
  # download redirects. No token is attached to these reads.
  PRD_AGENT_RELEASE_DOWNLOAD_TRANSPORT: github-api

jobs:
  retain-existing:
    if: inputs.retain_from_run != '' || inputs.retain_commit != '' || inputs.retain_original_sha256 != '' || inputs.retain_draft_id != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    concurrency:
      group: web-bundle-${{ inputs.retain_commit }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Verify the original successful workflow identity
        env:
          GH_TOKEN: ${{ github.token }}
          ORIGINAL_RUN: ${{ inputs.retain_from_run }}
          ORIGINAL_COMMIT: ${{ inputs.retain_commit }}
          ORIGINAL_SHA256: ${{ inputs.retain_original_sha256 }}
        run: |
          printf '%s' "$ORIGINAL_RUN" | grep -Eq '^[0-9]+$'
          printf '%s' "$ORIGINAL_COMMIT" | grep -Eq '^[0-9a-f]{40}$'
          printf '%s' "$ORIGINAL_SHA256" | grep -Eq '^[0-9a-f]{64}$'
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ORIGINAL_RUN" > original-run.json
          python3 - <<'PY'
          import json, os
          run = json.load(open('original-run.json'))
          assert run['head_sha'] == os.environ['ORIGINAL_COMMIT']
          assert run['conclusion'] == 'success' and run['status'] == 'completed'
          assert run['repository']['full_name'] == os.environ['GITHUB_REPOSITORY']
          assert run['path'] == '.github/workflows/web-latest-pages.yml'
          PY
      - uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: original
          run-id: ${{ inputs.retain_from_run }}
          github-token: ${{ github.token }}
      - name: Retain the original bytes without rebuilding
        env:
          GH_TOKEN: ${{ github.token }}
          ORIGINAL_COMMIT: ${{ inputs.retain_commit }}
          ORIGINAL_SHA256: ${{ inputs.retain_original_sha256 }}
          DRAFT_ID: ${{ inputs.retain_draft_id }}
        run: |
          python3 scripts/lib/release-artifacts.py import-pages --archive original/artifact.tar --ref "sha-$ORIGINAL_COMMIT" --commit "$ORIGINAL_COMMIT" --original-sha256 "$ORIGINAL_SHA256" --directory inherited
          if [ -n "$DRAFT_ID" ]; then
            printf '%s' "$DRAFT_ID" | grep -Eq '^[0-9]+$'
            python3 scripts/lib/release-artifacts.py publish --repo "$GITHUB_REPOSITORY" --ref "sha-$ORIGINAL_COMMIT" --directory inherited --resume-draft-id "$DRAFT_ID" --original-sha256 "$ORIGINAL_SHA256"
          else
            python3 scripts/lib/release-artifacts.py publish --repo "$GITHUB_REPOSITORY" --ref "sha-$ORIGINAL_COMMIT" --directory inherited
          fi

  build:
    needs: retain-existing
    if: always() && !cancelled() && (needs.retain-existing.result == 'success' || needs.retain-existing.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reuse an already published commit bundle
        id: restore
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/lib/release-artifacts.py restore --repo "$GITHUB_REPOSITORY" --ref "sha-$GITHUB_SHA" --commit "$GITHUB_SHA" --directory bundle --github-output "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@v4
        if: steps.restore.outputs.exists != 'true'
        with:
          version: "9"
      - uses: actions/setup-node@v4
        if: steps.restore.outputs.exists != 'true'
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: prd-admin/pnpm-lock.yaml
      - name: Build only an unpublished commit
        if: steps.restore.outputs.exists != 'true'
        working-directory: prd-admin
        env:
          VITE_API_BASE_URL: ""
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: Package fixed commit
        if: steps.restore.outputs.exists != 'true'
        run: python3 scripts/lib/release-artifacts.py bundle --repo "$GITHUB_REPOSITORY" --ref "sha-$GITHUB_SHA" --commit "$GITHUB_SHA" --dist prd-admin/dist --directory bundle
      - uses: actions/upload-artifact@v4
        with:
          name: web-bundle
          path: bundle/
          retention-days: 7

  retain:
    needs: build
    if: always() && !cancelled() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    # Only the storage writer has release-write access. No PAT or account grant.
    permissions:
      contents: write
    concurrency:
      group: web-bundle-${{ github.sha }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: web-bundle
          path: bundle
      - name: Publish once; validate and reuse on retry
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          python3 scripts/lib/release-artifacts.py publish --repo "$GITHUB_REPOSITORY" --ref "sha-$GITHUB_SHA" --directory bundle
          if [ -n "$RELEASE_TAG" ]; then
            python3 scripts/lib/release-artifacts.py fetch --repo "$GITHUB_REPOSITORY" --ref "sha-$GITHUB_SHA" --directory canonical
            python3 scripts/lib/release-artifacts.py alias --source-ref "sha-$GITHUB_SHA" --ref "$RELEASE_TAG" --directory canonical
            python3 scripts/lib/release-artifacts.py publish --repo "$GITHUB_REPOSITORY" --ref "$RELEASE_TAG" --directory canonical
          fi

  pages:
    needs: retain
    if: always() && !cancelled() && needs.retain.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Pages from the retained bundle
        env:
          PUBLISH_LATEST: ${{ github.event_name == 'push' || inputs.publish_latest == true }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          python3 scripts/lib/release-artifacts.py fetch --repo "$GITHUB_REPOSITORY" --ref "sha-$GITHUB_SHA" --directory bundle
          python3 scripts/lib/release-artifacts.py pages --repo "$GITHUB_REPOSITORY" --ref "sha-$GITHUB_SHA" --directory bundle --dist site
          if [ -n "$RELEASE_TAG" ]; then
            python3 scripts/lib/release-artifacts.py fetch --repo "$GITHUB_REPOSITORY" --ref "$RELEASE_TAG" --commit "$GITHUB_SHA" --directory site
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
