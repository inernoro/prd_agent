name: Product Management Candidate Lint
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  product-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 1b906c5954834a172cd290dac7a68c0ec7f54fce
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
          package_json_file: prd-admin/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: prd-admin/pnpm-lock.yaml
      - name: Install locked dependencies on CI only
        working-directory: prd-admin
        run: pnpm install --frozen-lockfile
      - name: Compare changed frontend files with production lint baseline
        working-directory: prd-admin
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import { execFileSync } from 'node:child_process';
          import { ESLint } from 'eslint';
          const base = '0dd78d40dc7f9c90e3b023fb04f81b1de95a04f8';
          const expected = '1b906c5954834a172cd290dac7a68c0ec7f54fce';
          const git = (...args) => execFileSync('git', args, {encoding: 'utf8'});
          if (git('rev-parse', 'HEAD').trim() !== expected) throw new Error('Candidate mismatch');
          const files = git('diff', '--name-only', '--diff-filter=ACMR', base, expected, '--', 'prd-admin/src').trim().split('\n').filter(p => /\.(ts|tsx)$/.test(p));
          const eslint = new ESLint();
          let introduced = 0, total = 0, baseline = 0;
          for (const file of files) {
            const local = path.resolve('..', file);
            const source = fs.readFileSync(local, 'utf8');
            let previous = '';
            try { previous = git('show', base + ':' + file); } catch {}
            const after = (await eslint.lintText(source, {filePath: local}))[0].messages;
            const before = previous ? (await eslint.lintText(previous, {filePath: local}))[0].messages : [];
            total += after.length; baseline += before.length;
            const key = (m, text) => JSON.stringify([m.ruleId, m.severity, m.message, text.split(/\r?\n/)[(m.line || 1) - 1]?.trim()]);
            const counts = new Map();
            for (const m of before) { const k = key(m, previous); counts.set(k, (counts.get(k) || 0) + 1); }
            for (const m of after) {
              const k = key(m, source);
              if (counts.get(k)) counts.set(k, counts.get(k) - 1);
              else {
                introduced++;
                console.log(JSON.stringify({file, line:m.line, severity:m.severity, rule:m.ruleId, message:m.message}));
              }
            }
          }
          console.log(JSON.stringify({candidate:expected, base, files:files.length, baseline, total, introduced}));
          if (introduced) process.exitCode = 1;
          NODE
