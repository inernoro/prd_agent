name: LLMGW Tutorial Drift

on:
  pull_request:
    paths:
      - 'llmgw/web/**'
      - 'llmgw/console-api/**'
      - 'llmgw/serving/**'
      - 'llmgw/tutorial/**'
      - 'prd-api/src/**'
      - '.github/workflows/llmgw-tutorial-drift.yml'
  workflow_dispatch:
    inputs:
      since:
        description: Git history window passed to the drift scanner
        required: false
        default: 1 day ago

permissions:
  contents: read

concurrency:
  group: llmgw-tutorial-drift-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tutorial-drift:
    name: Check tutorial drift
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate authoritative tutorial
        run: |
          python3 llmgw/tutorial/publisher.py check
          python3 -m unittest llmgw/tutorial/test_publisher.py llmgw/tutorial/test_maintenance.py

      - name: Generate drift report
        env:
          INPUT_SINCE: ${{ github.event.inputs.since || '1 day ago' }}
          BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$BASE_REF" ]; then
            python3 llmgw/tutorial/maintenance.py \
              --base-ref "$BASE_REF" \
              --json-out artifacts/llmgw-tutorial-drift/report.json \
              --markdown-out artifacts/llmgw-tutorial-drift/report.md \
              --fail-on-drift
          else
            python3 llmgw/tutorial/maintenance.py \
              --since "$INPUT_SINCE" \
              --json-out artifacts/llmgw-tutorial-drift/report.json \
              --markdown-out artifacts/llmgw-tutorial-drift/report.md \
              --fail-on-drift
          fi

      - name: Upload drift evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: llmgw-tutorial-drift-${{ github.run_id }}
          path: artifacts/llmgw-tutorial-drift/
          if-no-files-found: error
